name: Kanban extraction regression
on:
  push:
    paths:
      - 'qrcheck_v2.html'
      - 'tests/kanban-extraction.cjs'
      - '.github/workflows/kanban-regression.yml'
  pull_request:
    paths:
      - 'qrcheck_v2.html'
      - 'tests/kanban-extraction.cjs'
      - '.github/workflows/kanban-regression.yml'
permissions:
  contents: read
jobs:
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/kanban-extraction.cjs
