<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出荷準備ボード</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #05070a;
      color: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }

    /* ── ヘッダー ── */
    header {
      display: flex; align-items: center; gap: 1.2vw;
      padding: 1.2vh 1.6vw; background: #0d1319;
      border-bottom: 0.4vh solid #1e2a35; flex: 0 0 auto;
    }
    .title { font-size: 3.0vh; font-weight: 900; color: #4fc3f7; white-space: nowrap; }
    .today { font-size: 2.4vh; font-weight: 800; color: #eceff1; white-space: nowrap; }
    .spacer { margin-left: auto; }
    .kpi { display: flex; gap: 1.0vw; align-items: stretch; }
    .kpi div {
      padding: 0.5vh 1.3vw; border-radius: 1vh; text-align: center; min-width: 8.5vw;
      display: flex; flex-direction: column; justify-content: center;
    }
    .kpi .n { font-size: 4.2vh; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    .kpi .l { font-size: 1.5vh; font-weight: 800; opacity: 0.85; }
    .kpi .rest { background: #3a2a00; color: #ffc947; }
    .kpi .fin  { background: #10330f; color: #7ee08a; }
    .clock { font-size: 4.2vh; font-weight: 900; font-variant-numeric: tabular-nums; color: #fff; }
    .conn { font-size: 1.4vh; font-weight: 800; padding: 0.4vh 0.8vw; border-radius: 1vh; }
    .conn.ok { background: #10330f; color: #7ee08a; }
    .conn.ng { background: #3d1010; color: #ff8a80; }
    select {
      background: #0b1116; color: #b0bec5; border: 0.2vh solid #2c3e4c;
      border-radius: 0.7vh; padding: 0.5vh 0.7vw; font-size: 1.6vh; font-weight: 700;
    }

    /* ── 未完了エリア ── */
    main { flex: 1 1 auto; padding: 1.4vh 1.4vw; min-height: 0; }
    .grid { display: grid; gap: 1.4vh 1.4vw; height: 100%; }

    .card {
      border-radius: 1.6vh; padding: 1.8vh 1.6vw; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      border: 0.6vh solid; min-height: 0;
    }
    .card.doing { background: #2b2100; border-color: #ffc947; }
    .card.todo  { background: #151b21; border-color: #64798a; }

    .row1 { display: flex; align-items: flex-start; gap: 1vw; }
    .dest {
      flex: 1 1 auto; font-weight: 900; line-height: 1.1; color: #fff;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      font-size: 5.0vh;
    }
    .dest.code { font-size: 4.4vh; color: #cfd8dc; letter-spacing: 0.02em; }
    .bin {
      flex: 0 0 auto; font-size: 4.6vh; font-weight: 900; line-height: 1;
      padding: 0.8vh 1.4vw; border-radius: 1.2vh; white-space: nowrap;
      background: #fff; color: #10161c;
    }
    .bin.unset { font-size: 2.0vh; background: #37474f; color: #cfd8dc; padding: 1.2vh 1vw; }
    .sub { font-size: 2.0vh; font-weight: 700; color: #b0bec5; margin-top: 0.6vh; }

    .bar { height: 1.6vh; border-radius: 2vh; background: rgba(255,255,255,0.14); overflow: hidden; margin-bottom: 1.0vh; }
    .bar > i { display: block; height: 100%; }
    .card.doing .bar > i { background: #ffc947; }
    .card.todo  .bar > i { background: #78909c; }

    .row2 { display: flex; align-items: baseline; gap: 1vw; }
    .boxes { font-size: 6.4vh; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; color: #fff; }
    .boxes small { font-size: 2.6vh; font-weight: 800; color: #b0bec5; }
    .state { margin-left: auto; font-size: 3.0vh; font-weight: 900; padding: 0.5vh 1.4vw; border-radius: 1vh; }
    .card.doing .state { background: #ffc947; color: #2a1d00; }
    .card.todo  .state { background: #64798a; color: #0b1116; }

    .allclear { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
    .allclear .m { font-size: 9vh; font-weight: 900; color: #7ee08a; }
    .allclear .s { font-size: 3vh; font-weight: 700; color: #4f6b57; }

    /* ── 完了エリア ── */
    footer { flex: 0 0 auto; background: #080e12; border-top: 0.4vh solid #1e2a35; padding: 1.0vh 1.4vw 1.3vh; }
    .fhead { display: flex; align-items: baseline; gap: 1vw; margin-bottom: 0.8vh; }
    .fhead b { font-size: 2.1vh; font-weight: 900; color: #7ee08a; }
    .fhead span { font-size: 1.6vh; color: #607d8b; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.9vh 0.8vw; height: 16vh; overflow: hidden; align-content: flex-start; }
    .chip {
      display: flex; align-items: baseline; gap: 0.6vw;
      background: #10330f; border: 0.25vh solid #3f8f45; border-radius: 1vh;
      padding: 0.6vh 1.0vw;
    }
    .chip .cn { font-size: 2.6vh; font-weight: 900; color: #d6f7d8; max-width: 22vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip .cb { font-size: 2.6vh; font-weight: 900; color: #fff; background: #2e7d32; border-radius: 0.6vh; padding: 0 0.6vw; }
    .chip .cq { font-size: 2.0vh; font-weight: 700; color: #9ccc9f; }
    .fnone { font-size: 2vh; color: #37474f; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div class="title">📦 出荷準備</div>
    <select id="companySelect" onchange="onCompanyChange(this.value)"></select>
    <div class="today" id="todayLabel">-</div>
    <div class="conn ng" id="conn">接続中…</div>
    <div class="spacer"></div>
    <div class="kpi">
      <div class="rest"><div class="n" id="statRest">0</div><div class="l">残り</div></div>
      <div class="fin"><div class="n" id="statDone">0</div><div class="l">完了</div></div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <main><div class="grid" id="grid"></div></main>

  <footer>
    <div class="fhead">
      <b>✅ 完了</b>
      <span id="doneNote"></span>
    </div>
    <div class="chips" id="chips"></div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
  // QR照合システム / ログ画面と同じプロジェクト
  const FIREBASE_CONFIG = {
    apiKey:      "AIzaSyAOMRoojKv9Hnh3OjVGwYV_k1LBTGOKepY",
    authDomain:  "miyamaunitec-fb87a.firebaseapp.com",
    databaseURL: "https://miyamaunitec-fb87a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:   "miyamaunitec-fb87a"
  };
  const COMPANY_KEY = 'qrdash_company';
  const PAGE_MS = 12000;   // 1画面に収まらないときの切替間隔
  const MAX_CARDS = 6;     // 未完了カードは大きく見せたいので1画面6件まで

  // キオスク端末などストレージが使えない環境でも動くようにする
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できなくても続行 */ } }
  };

  let database = null;
  let sessions = [];
  let customerNames = {};
  let companies = [];
  let companyId = store.get(COMPANY_KEY) || 'cmp_mn4ei4sttmc5';
  let sessionsRef = null, namesRef = null;
  let cardPage = 0, chipPage = 0;
  let unknownDest = 0;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function isToday(iso) {
    if (!iso) return false;
    const d = new Date(iso);
    if (isNaN(d.getTime())) return false;
    const n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }

  function fmtDeliveryDate(v) {
    const s = String(v || '');
    if (/^\d{8}$/.test(s)) return `${Number(s.slice(4, 6))}/${Number(s.slice(6, 8))}`;
    return s || '納入日不明';
  }

  function hasName(cid) { return !!(cid && customerNames[cid]); }

  function nameOf(cid) {
    if (!cid) return '納入先不明';
    // 顧客名マスタにはタブ区切りで工場名が入っているものがある
    return String(customerNames[cid] || cid).replace(/\s+/g, ' ').trim();
  }

  // 除外(仕入先パススルー)行は照合対象外なので箱数から外す
  function boxesOf(session) {
    const lines = Array.isArray(session.lines) ? session.lines : Object.values(session.lines || {});
    let req = 0, sc = 0;
    lines.forEach(l => {
      if (l && l.excluded) return;
      req += Number(l && l.requiredBoxes) || 0;
      sc += Number(l && l.scanned) || 0;
    });
    return { req, sc };
  }

  // 納入先 × 納入日 × 便 でまとめる。同じ便に複数の明細セッションがぶら下がることがある。
  function buildGroups() {
    const map = new Map();
    unknownDest = 0;
    sessions.forEach(s => {
      if (!isToday(s.updatedAt || s.createdAt)) return;
      const meta = s.meta || {};
      const cid = String(meta.customerId || '');
      // 納入先が取れていないセッションは束ねても1つの出荷にならないので、
      // ボードには出さず件数だけ知らせる
      if (!cid) { unknownDest += 1; return; }
      const date = String(meta.deliveryDate || '');
      const bin = String(meta.deliveryBin || '');
      const key = `${cid}|${date}|${bin}`;
      if (!map.has(key)) map.set(key, { cid, date, bin, req: 0, sc: 0, sessions: 0, allDone: true });
      const g = map.get(key);
      const { req, sc } = boxesOf(s);
      g.req += req; g.sc += sc; g.sessions += 1;
      if (!s.completedAt) g.allDone = false;
    });

    const groups = [...map.values()].map(g => {
      const done = g.req > 0 && (g.allDone || g.sc >= g.req);
      return { ...g, status: done ? 'done' : (g.sc > 0 ? 'doing' : 'todo') };
    });
    const binOf = g => (g.bin ? Number(g.bin) : 999);
    groups.sort((a, b) => binOf(a) - binOf(b) || nameOf(a.cid).localeCompare(nameOf(b.cid), 'ja'));
    return groups;
  }

  function renderCards(rest) {
    const grid = document.getElementById('grid');
    if (!rest.length) {
      grid.style.gridTemplateColumns = '1fr';
      grid.style.gridTemplateRows = '1fr';
      grid.innerHTML = `<div class="allclear">
        <div class="m">${unknownDest || document.getElementById('statDone').textContent !== '0' ? '本日分 すべて完了' : '本日の処理はまだありません'}</div>
        <div class="s">${unknownDest ? `納入先不明 ${unknownDest}件は対象外` : '明細QRを読み込むとここに表示されます'}</div>
      </div>`;
      return;
    }
    const pages = Math.ceil(rest.length / MAX_CARDS);
    if (cardPage >= pages) cardPage = 0;
    const shown = pages > 1 ? rest.slice(cardPage * MAX_CARDS, (cardPage + 1) * MAX_CARDS) : rest;

    // 空きマスを作らない列数にする(3件なら3列1行にして1枚あたりを大きく取る)
    const cols = shown.length <= 3 ? shown.length : (shown.length === 4 ? 2 : 3);
    const rows = Math.ceil(shown.length / cols);
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

    grid.innerHTML = shown.map(g => {
      const pct = g.req > 0 ? Math.min(100, Math.round(g.sc / g.req * 100)) : 0;
      const label = g.status === 'doing' ? '進行中' : '未着手';
      const binHtml = g.bin ? `<div class="bin">${esc(g.bin)}便</div>` : `<div class="bin unset">便未設定</div>`;
      return `<div class="card ${g.status}">
        <div>
          <div class="row1">
            <div class="dest${hasName(g.cid) ? '' : ' code'}">${esc(nameOf(g.cid))}</div>
            ${binHtml}
          </div>
          <div class="sub">納入 ${esc(fmtDeliveryDate(g.date))}${g.sessions > 1 ? ` ・明細${g.sessions}件` : ''}</div>
        </div>
        <div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="row2">
            <div class="boxes">${g.sc}<small> / ${g.req} 箱</small></div>
            <div class="state">${label}</div>
          </div>
        </div>
      </div>`;
    }).join('');
    return pages;
  }

  function renderChips(done) {
    const box = document.getElementById('chips');
    const note = document.getElementById('doneNote');
    if (!done.length) {
      note.textContent = unknownDest ? `納入先不明 ${unknownDest}件は対象外` : '';
      box.innerHTML = `<div class="fnone">まだありません</div>`;
      return 1;
    }
    const chipHtml = g => `<div class="chip">
      <span class="cn">${esc(nameOf(g.cid))}</span>
      <span class="cb">${g.bin ? esc(g.bin) + '便' : '−'}</span>
      <span class="cq">${g.req}箱</span>
    </div>`;

    // チップの幅は納入先名の長さで変わるため、1ページの件数は固定にできず、
    // ページごとにも変わる。先頭から順に「その位置から何件収まるか」を実測して境界を決める。
    // 1件ずつ削って測るので件数が増えると計算量が伸びる。実測は先頭から数ページ分に絞り、
    // 予算を使い切ったらそれ以降は直前のページ件数を流用する。
    const starts = [0];
    let idx = 0, budget = 400, lastFit = 0;
    while (idx < done.length && starts.length < 40) {
      let n;
      if (budget > 0) {
        box.innerHTML = done.slice(idx).map(chipHtml).join('');
        n = done.length - idx;
        while (n > 1 && budget-- > 0 && box.scrollHeight > box.clientHeight && box.lastElementChild) {
          box.removeChild(box.lastElementChild);
          n -= 1;
        }
        lastFit = n;
      } else {
        n = lastFit || 8;
      }
      idx += Math.max(1, n);
      if (idx < done.length) starts.push(idx);
    }

    const pages = starts.length;
    if (chipPage >= pages) chipPage = 0;
    const from = starts[chipPage];
    const to = chipPage + 1 < pages ? starts[chipPage + 1] : done.length;
    box.innerHTML = done.slice(from, to).map(chipHtml).join('');
    note.textContent = [
      `${done.length}件`,
      pages > 1 ? `${chipPage + 1}/${pages}ページ` : '',
      unknownDest ? `納入先不明 ${unknownDest}件は対象外` : ''
    ].filter(Boolean).join(' ・ ');
    return pages;
  }

  function render() {
    const groups = buildGroups();
    const rest = groups.filter(g => g.status !== 'done');
    const done = groups.filter(g => g.status === 'done');
    document.getElementById('statRest').textContent = rest.length;
    document.getElementById('statDone').textContent = done.length;
    renderCards(rest);
    renderChips(done);
  }

  function setConn(ok, text) {
    const el = document.getElementById('conn');
    el.className = 'conn ' + (ok ? 'ok' : 'ng');
    el.textContent = text;
  }

  function tickClock() {
    const n = new Date();
    document.getElementById('clock').textContent =
      `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;
    document.getElementById('todayLabel').textContent =
      `${n.getMonth() + 1}/${n.getDate()} 本日処理分`;
  }

  function subscribe() {
    if (sessionsRef) sessionsRef.off();
    if (namesRef) namesRef.off();
    store.set(COMPANY_KEY, companyId);

    namesRef = database.ref('qr_match_companies/customer_name_master/' + companyId);
    namesRef.on('value', snap => { customerNames = snap.val() || {}; render(); });

    sessionsRef = database.ref('qr_match_companies/order_detail_sessions/' + companyId);
    sessionsRef.on('value', snap => {
      const data = snap.val() || {};
      sessions = Object.entries(data).map(([key, val]) => ({ ...val, sessionId: (val && val.sessionId) || key }));
      setConn(true, '接続中');
      render();
    }, err => {
      console.error(err);
      setConn(false, '接続エラー');
    });
  }

  function onCompanyChange(value) { companyId = value; cardPage = 0; chipPage = 0; subscribe(); }

  function renderCompanies() {
    document.getElementById('companySelect').innerHTML = companies.map(c =>
      `<option value="${esc(c.id)}"${c.id === companyId ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
  }

  function start() {
    const app = firebase.initializeApp(FIREBASE_CONFIG);
    database = firebase.database(app);

    database.ref('qr_match_companies/profiles').once('value', snap => {
      const data = snap.val() || {};
      companies = Object.entries(data).map(([id, v]) => ({
        id, name: (v && (v.name || v.companyName)) || id
      })).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      if (!companies.some(c => c.id === companyId) && companies.length) companyId = companies[0].id;
      renderCompanies();
      subscribe();
    }, err => {
      console.error(err);
      setConn(false, '接続エラー');
      subscribe();
    });

    tickClock();
    setInterval(tickClock, 10000);
    setInterval(render, 60000);           // 日付が変わっても自動で切り替わるように
    setInterval(() => { cardPage += 1; chipPage += 1; render(); }, PAGE_MS);
  }

  start();
  </script>
</body>
</html>
