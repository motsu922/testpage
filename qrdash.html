<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出荷準備ボード</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }

    header {
      display: flex;
      align-items: center;
      gap: 1.4vw;
      padding: 1.0vh 1.4vw;
      background: #14181d;
      border-bottom: 2px solid #263238;
      flex: 0 0 auto;
    }
    .title { font-size: 2.3vh; font-weight: 900; color: #4fc3f7; letter-spacing: 0.04em; white-space: nowrap; }
    .company { font-size: 1.9vh; font-weight: 800; color: #cfd8dc; white-space: nowrap; }
    .summary { display: flex; gap: 0.9vw; margin-left: auto; align-items: center; }
    .stat {
      display: flex; flex-direction: column; align-items: center;
      padding: 0.3vh 1.1vw; border-radius: 0.8vh; background: #1b2127; min-width: 7vw;
    }
    .stat-label { font-size: 1.3vh; color: #90a4ae; font-weight: 700; }
    .stat-value { font-size: 3.0vh; font-weight: 900; line-height: 1.1; }
    .stat.done .stat-value { color: #66bb6a; }
    .stat.doing .stat-value { color: #ffb300; }
    .stat.todo .stat-value { color: #90a4ae; }
    .clock { font-size: 2.6vh; font-weight: 900; color: #eceff1; font-variant-numeric: tabular-nums; }
    .conn { font-size: 1.3vh; font-weight: 800; padding: 0.3vh 0.7vw; border-radius: 1vh; white-space: nowrap; }
    .conn.ok { background: #1b3d1b; color: #7ee08a; }
    .conn.ng { background: #3d1b1b; color: #ff8a80; }
    select {
      background: #0f1418; color: #cfd8dc; border: 1px solid #37474f;
      border-radius: 0.7vh; padding: 0.4vh 0.6vw; font-size: 1.5vh; font-weight: 700;
    }

    main { flex: 1 1 auto; padding: 1.2vh 1.2vw; overflow: hidden; }
    .grid { display: grid; gap: 1.1vh 1.1vw; height: 100%; align-content: start; }

    .card {
      position: relative;
      border-radius: 1.2vh;
      padding: 1.2vh 1.2vw;
      display: flex; flex-direction: column; justify-content: space-between;
      border: 0.35vh solid transparent;
      background: #171c21;
      overflow: hidden;
      min-height: 0;
    }
    .card.done  { background: #102c15; border-color: #4caf50; }
    .card.doing { background: #2e2408; border-color: #ffb300; }
    .card.todo  { background: #1a1f24; border-color: #455a64; }

    .card-head { display: flex; align-items: flex-start; gap: 0.7vw; }
    .dest {
      font-size: 2.6vh; font-weight: 900; line-height: 1.15; flex: 1 1 auto;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .card.done .dest { color: #c8f7cb; }
    .card.doing .dest { color: #ffe6a8; }
    .card.todo .dest { color: #b0bec5; }
    .bin {
      flex: 0 0 auto; font-size: 2.4vh; font-weight: 900; padding: 0.2vh 0.8vw;
      border-radius: 0.8vh; background: rgba(255,255,255,0.10); white-space: nowrap;
    }
    .bin.unset { font-size: 1.5vh; color: #90a4ae; }
    .date { font-size: 1.5vh; font-weight: 700; color: #90a4ae; margin-top: 0.3vh; }

    .card-foot { display: flex; align-items: flex-end; gap: 0.8vw; }
    .boxes { font-size: 3.4vh; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
    .boxes small { font-size: 1.8vh; font-weight: 800; color: #90a4ae; }
    .state {
      margin-left: auto; font-size: 2.1vh; font-weight: 900; padding: 0.3vh 1.0vw;
      border-radius: 0.8vh; white-space: nowrap;
    }
    .card.done .state  { background: #4caf50; color: #06230b; }
    .card.doing .state { background: #ffb300; color: #2a1d00; }
    .card.todo .state  { background: #455a64; color: #cfd8dc; }

    .bar { height: 0.9vh; border-radius: 1vh; background: rgba(255,255,255,0.12); margin-top: 0.8vh; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 1vh; }
    .card.done .bar > i  { background: #4caf50; }
    .card.doing .bar > i { background: #ffb300; }
    .card.todo .bar > i  { background: #607d8b; }

    .empty { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1.4vh; }
    .empty-main { font-size: 4vh; font-weight: 900; color: #546e7a; }
    .empty-sub { font-size: 2vh; color: #455a64; }
    .page-note { font-size: 1.4vh; color: #78909c; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div class="title">📦 出荷準備ボード</div>
    <select id="companySelect" onchange="onCompanyChange(this.value)"></select>
    <div class="company" id="todayLabel">-</div>
    <div class="conn ng" id="conn">接続中…</div>
    <div class="page-note" id="pageNote"></div>
    <div class="summary">
      <div class="stat done"><div class="stat-label">完了</div><div class="stat-value" id="statDone">0</div></div>
      <div class="stat doing"><div class="stat-label">進行中</div><div class="stat-value" id="statDoing">0</div></div>
      <div class="stat todo"><div class="stat-label">未着手</div><div class="stat-value" id="statTodo">0</div></div>
      <div class="clock" id="clock">--:--</div>
    </div>
  </header>
  <main><div class="grid" id="grid"></div></main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
  // QR照合システム / ログ画面と同じプロジェクト
  const FIREBASE_CONFIG = {
    apiKey:      "AIzaSyAOMRoojKv9Hnh3OjVGwYV_k1LBTGOKepY",
    authDomain:  "miyamaunitec-fb87a.firebaseapp.com",
    databaseURL: "https://miyamaunitec-fb87a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:   "miyamaunitec-fb87a"
  };
  const COMPANY_KEY = 'qrdash_company';
  const PAGE_MS = 12000;      // 1画面に収まらないときの切替間隔
  const CARDS_PER_PAGE = 12;  // 大型モニターで文字が潰れない上限

  let database = null;
  let sessions = [];
  let customerNames = {};
  let companies = [];
  // キオスク端末などストレージが使えない環境でも動くようにする
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できなくても動作は続ける */ } }
  };
  let companyId = store.get(COMPANY_KEY) || 'cmp_mn4ei4sttmc5';
  let sessionsRef = null, namesRef = null;
  let page = 0;
  let unknownDest = 0;   // 納入先が取れていない本日のセッション数

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function isToday(iso) {
    if (!iso) return false;
    const d = new Date(iso);
    if (isNaN(d.getTime())) return false;
    const n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }

  function fmtDeliveryDate(v) {
    const s = String(v || '');
    if (/^\d{8}$/.test(s)) return `${Number(s.slice(4, 6))}/${Number(s.slice(6, 8))}`;
    return s || '納入日不明';
  }

  // 除外(仕入先パススルー)行は照合対象外なので箱数から外す
  function boxesOf(session) {
    const lines = Array.isArray(session.lines) ? session.lines : Object.values(session.lines || {});
    let req = 0, sc = 0;
    lines.forEach(l => {
      if (l && l.excluded) return;
      req += Number(l && l.requiredBoxes) || 0;
      sc += Number(l && l.scanned) || 0;
    });
    return { req, sc };
  }

  // 納入先 × 納入日 × 便 でまとめる。同じ便に複数の明細セッションがぶら下がることがある。
  function buildGroups() {
    const map = new Map();
    unknownDest = 0;
    sessions.forEach(s => {
      if (!isToday(s.updatedAt || s.createdAt)) return;
      const meta = s.meta || {};
      const cid = String(meta.customerId || '');
      // 納入先が取れていないセッションは束ねても1つの出荷にならないので、
      // ボードには出さず件数だけ知らせる
      if (!cid) { unknownDest += 1; return; }
      const date = String(meta.deliveryDate || '');
      const bin = String(meta.deliveryBin || '');
      const key = `${cid}|${date}|${bin}`;
      if (!map.has(key)) {
        map.set(key, { cid, date, bin, req: 0, sc: 0, sessions: 0, allDone: true });
      }
      const g = map.get(key);
      const { req, sc } = boxesOf(s);
      g.req += req; g.sc += sc; g.sessions += 1;
      if (!s.completedAt) g.allDone = false;
    });

    const groups = [...map.values()].map(g => {
      const done = g.req > 0 && (g.allDone || g.sc >= g.req);
      return { ...g, status: done ? 'done' : (g.sc > 0 ? 'doing' : 'todo') };
    });

    const order = { doing: 0, todo: 1, done: 2 };
    groups.sort((a, b) => {
      const ba = a.bin ? Number(a.bin) : 999, bb = b.bin ? Number(b.bin) : 999;
      return ba - bb || order[a.status] - order[b.status] || nameOf(a.cid).localeCompare(nameOf(b.cid), 'ja');
    });
    return groups;
  }

  function nameOf(cid) {
    if (!cid) return '納入先不明';
    // 顧客名マスタにはタブ区切りで工場名が入っているものがある
    return String(customerNames[cid] || cid).replace(/\s+/g, ' ').trim();
  }

  function render() {
    const groups = buildGroups();
    document.getElementById('statDone').textContent = groups.filter(g => g.status === 'done').length;
    document.getElementById('statDoing').textContent = groups.filter(g => g.status === 'doing').length;
    document.getElementById('statTodo').textContent = groups.filter(g => g.status === 'todo').length;

    const grid = document.getElementById('grid');
    const note = document.getElementById('pageNote');
    if (!groups.length) {
      note.textContent = '';
      grid.style.gridTemplateColumns = '1fr';
      grid.innerHTML = `<div class="empty">
        <div class="empty-main">本日の処理はまだありません</div>
        <div class="empty-sub">明細QRを読み込むとここに表示されます</div>
      </div>`;
      return;
    }

    const pages = Math.ceil(groups.length / CARDS_PER_PAGE);
    if (page >= pages) page = 0;
    const shown = pages > 1 ? groups.slice(page * CARDS_PER_PAGE, (page + 1) * CARDS_PER_PAGE) : groups;
    note.textContent = [
      pages > 1 ? `${page + 1} / ${pages} ページ` : '',
      unknownDest ? `納入先不明 ${unknownDest}件` : ''
    ].filter(Boolean).join(' ・ ');

    const cols = shown.length <= 2 ? 1 : shown.length <= 6 ? 2 : shown.length <= 12 ? 3 : 4;
    const rows = Math.ceil(shown.length / cols);
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

    grid.innerHTML = shown.map(g => {
      const pct = g.req > 0 ? Math.min(100, Math.round(g.sc / g.req * 100)) : 0;
      const label = g.status === 'done' ? '完了' : (g.status === 'doing' ? '進行中' : '未着手');
      const binHtml = g.bin
        ? `<div class="bin">${esc(g.bin)}便</div>`
        : `<div class="bin unset">便未設定</div>`;
      return `<div class="card ${g.status}">
        <div>
          <div class="card-head">
            <div class="dest">${esc(nameOf(g.cid))}</div>
            ${binHtml}
          </div>
          <div class="date">納入 ${esc(fmtDeliveryDate(g.date))}${g.sessions > 1 ? ` ・明細${g.sessions}件` : ''}</div>
        </div>
        <div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="card-foot">
            <div class="boxes">${g.sc}<small> / ${g.req} 箱</small></div>
            <div class="state">${label}</div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function setConn(ok, text) {
    const el = document.getElementById('conn');
    el.className = 'conn ' + (ok ? 'ok' : 'ng');
    el.textContent = text;
  }

  function tickClock() {
    const n = new Date();
    document.getElementById('clock').textContent =
      `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;
    document.getElementById('todayLabel').textContent =
      `${n.getFullYear()}/${n.getMonth() + 1}/${n.getDate()} 本日処理分`;
  }

  function subscribe() {
    if (sessionsRef) sessionsRef.off();
    if (namesRef) namesRef.off();
    store.set(COMPANY_KEY, companyId);

    namesRef = database.ref('qr_match_companies/customer_name_master/' + companyId);
    namesRef.on('value', snap => { customerNames = snap.val() || {}; render(); });

    sessionsRef = database.ref('qr_match_companies/order_detail_sessions/' + companyId);
    sessionsRef.on('value', snap => {
      const data = snap.val() || {};
      sessions = Object.entries(data).map(([key, val]) => ({ ...val, sessionId: (val && val.sessionId) || key }));
      setConn(true, '接続中');
      render();
    }, err => {
      console.error(err);
      setConn(false, '接続エラー');
    });
  }

  function onCompanyChange(value) { companyId = value; page = 0; subscribe(); }

  function renderCompanies() {
    const sel = document.getElementById('companySelect');
    sel.innerHTML = companies.map(c =>
      `<option value="${esc(c.id)}"${c.id === companyId ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
  }

  function start() {
    const app = firebase.initializeApp(FIREBASE_CONFIG);
    database = firebase.database(app);

    database.ref('qr_match_companies/profiles').once('value', snap => {
      const data = snap.val() || {};
      companies = Object.entries(data).map(([id, v]) => ({
        id, name: (v && (v.name || v.companyName)) || id
      })).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      if (!companies.some(c => c.id === companyId) && companies.length) companyId = companies[0].id;
      renderCompanies();
      subscribe();
    }, err => {
      console.error(err);
      setConn(false, '接続エラー');
      subscribe();
    });

    tickClock();
    setInterval(tickClock, 10000);
    // 日付が変わったら自動で切り替わるよう、定期的に描き直す
    setInterval(render, 60000);
    setInterval(() => { page += 1; render(); }, PAGE_MS);
  }

  start();
  </script>
</body>
</html>
