<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明細QR 入数マスター管理</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root{--ink:#18212c;--muted:#64748b;--line:#d6dee8;--base:#eef3f8;--blue:#0876c9;--green:#167a46;--red:#b42323}*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{background:#12314c;border-bottom:4px solid #1590d3;color:#fff}.head{width:min(960px,calc(100% - 40px));min-height:74px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:22px}.subtitle{margin-top:4px;color:#b9d5e8;font-size:13px}a{color:#fff;border:1px solid #5b7890;border-radius:5px;padding:7px 10px;text-decoration:none;font-size:12px}.wrap{width:min(960px,calc(100% - 40px));margin:24px auto}.card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px rgba(15,23,42,.08);padding:20px}.field-grid{display:grid;grid-template-columns:1fr 170px 100px;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:5px}label{font-size:12px;font-weight:700;color:#40536a}input{width:100%;min-height:39px;border:1px solid #b9c7d6;border-radius:5px;padding:8px 9px;font-size:14px}button{min-height:39px;border:1px solid #105f35;border-radius:5px;padding:8px 13px;background:var(--green);color:#fff;font-weight:750;cursor:pointer}.toolbar{display:flex;align-items:end;gap:10px;margin:18px 0 10px}.toolbar .field{width:240px}.status{margin-left:auto;padding:7px 10px;border:1px solid #5b7890;border-radius:5px;color:#526274;font-size:12px}.status.ok{border-color:#45956a;color:#17653b}.status.off{border-color:#a77c45;color:#81510d}.table{border:1px solid var(--line);border-radius:6px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e6ebf0;text-align:left}th{background:#f4f7fa;color:#40536a;font-size:12px}td{font-size:14px}tr:last-child td{border-bottom:0}.part{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700}.qty{text-align:right;font-weight:800}.delete{min-height:31px;padding:4px 8px;border-color:#ecb7b7;background:#fff5f5;color:var(--red)}.empty{text-align:center;color:#94a3b8;padding:24px}@media(max-width:640px){.head,.wrap{width:calc(100% - 24px)}.field-grid{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.toolbar .field{width:100%}.status{margin-left:0}}
  </style>
</head>
<body>
  <header><div class="head"><div><h1>入数マスター管理</h1><div class="subtitle">明細QR発行に使用する品番ごとの入数を管理</div></div><a href="order_qr_generator.html">発行画面へ</a></div></header>
  <main class="wrap"><section class="card">
    <div class="toolbar"><div class="field"><label>マスター対象会社</label><input id="companyKey" value="miyama" autocomplete="off" onchange="changeCompany()"></div><div id="status" class="status">Firebase接続中...</div></div>
    <div class="field-grid"><div class="field"><label>品番</label><input id="partNumber" autocomplete="off" placeholder="例: 10101-02301"></div><div class="field"><label>入数</label><input id="packQty" type="number" min="1" step="1"></div><button onclick="saveEntry()">登録</button></div>
    <div class="table" style="margin-top:18px"><table><thead><tr><th>品番</th><th style="text-align:right">入数</th><th></th></tr></thead><tbody id="masterList"></tbody></table></div>
  </section></main>
<script>
  const FIREBASE_CONFIG={apiKey:'AIzaSyAOMRoojKv9Hnh3OjVGwYV_k1LBTGOKepY',authDomain:'miyamaunitec-fb87a.firebaseapp.com',databaseURL:'https://miyamaunitec-fb87a-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'miyamaunitec-fb87a'};
  let database=null;let master=[];
  function cleanPart(value){return String(value??'').normalize('NFKC').toUpperCase().replace(/\s+/g,'');}function partKey(value){return cleanPart(value).replace(/[^0-9A-Z]/g,'');}function companyKey(){return String(document.getElementById('companyKey').value||'miyama').trim().replace(/[.#$\[\]/]/g,'_')||'miyama';}function storageKey(){return'order_qr_generator_pack_master_'+companyKey();}function path(){return'qr_match_companies/order_qr_generator/pack_masters/'+companyKey();}
  function setStatus(kind,text){const e=document.getElementById('status');e.textContent=text;e.className='status '+kind;}function normalize(raw){const map=new Map();(Array.isArray(raw)?raw:Object.values(raw||{})).forEach(item=>{const partNumber=cleanPart(item&&item.partNumber);const packQty=Math.floor(Number(item&&item.packQty));if(partNumber&&packQty>0)map.set(partKey(partNumber),{partNumber,packQty});});return[...map.values()].sort((a,b)=>a.partNumber.localeCompare(b.partNumber));}
  function render(){const body=document.getElementById('masterList');if(!master.length){body.innerHTML='<tr><td colspan="3" class="empty">登録なし</td></tr>';return;}body.innerHTML=master.map(item=>`<tr><td class="part">${escapeHtml(item.partNumber)}</td><td class="qty">${item.packQty} 入/箱</td><td style="width:70px"><button class="delete" onclick="removeEntry('${partKey(item.partNumber)}')">削除</button></td></tr>`).join('');}function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function saveLocal(){localStorage.setItem(storageKey(),JSON.stringify(master));}function persist(){master=normalize(master);saveLocal();render();if(database)database.ref(path()).set(master).then(()=>setStatus('ok','Firebase同期済み')).catch(()=>setStatus('off','ローカル保存'));}
  function saveEntry(){const partNumber=cleanPart(document.getElementById('partNumber').value);const packQty=Math.floor(Number(document.getElementById('packQty').value));if(!partNumber||packQty<1){alert('品番と1以上の入数を入力してください。');return;}const item=master.find(row=>partKey(row.partNumber)===partKey(partNumber));if(item){item.partNumber=partNumber;item.packQty=packQty;}else master.push({partNumber,packQty});document.getElementById('partNumber').value='';document.getElementById('packQty').value='';persist();}
  function removeEntry(key){const item=master.find(row=>partKey(row.partNumber)===key);if(!item||!confirm(`「${item.partNumber}」を削除しますか？`))return;master=master.filter(row=>partKey(row.partNumber)!==key);persist();}function load(){master=normalize(JSON.parse(localStorage.getItem(storageKey())||'[]'));render();if(database)database.ref(path()).once('value').then(snap=>{if(snap.exists()){master=normalize(snap.val());saveLocal();render();setStatus('ok','Firebase同期済み');}else persist();}).catch(()=>setStatus('off','ローカル保存'));}function changeCompany(){load();}
  document.addEventListener('DOMContentLoaded',()=>{try{firebase.initializeApp(FIREBASE_CONFIG);database=firebase.database();}catch(error){setStatus('off','ローカル保存');}load();});
</script>
</body>
</html>
