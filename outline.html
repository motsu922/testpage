              <th style={{...th,width:66}}><TH k="予定時間"/></th>
              <th style={{...th,width:84}}><TH k="予定"/></th>
              <th style={{...th,width:84}}><TH k="実績"/></th>
              <th style={{...th,width:112}}><TH k="進捗"/></th>
              <th style={{...th,width:62}}><TH k="差"/></th>
              <th style={{...th,width:104,textAlign:'center'}}><TH k="作業開始"/></th>
            </tr></thead>
            <tbody>
              {rows.map((o,i)=>{
                const td={padding:'8px 8px',fontSize:13.5,borderBottom:'1px solid '+LINE,whiteSpace:'nowrap'};
                const isNext=nextRow&&o.id===nextRow.id;
                const d=o.diffMin||0;
                const isTask=o.kind==='task';
                const done=Number(o.doneBoxes)||0, tgt=Number(o.targetBoxes)||0;
                const pct=isTask?(o.status==='done'?100:0):(tgt?Math.min(100,Math.round(done/tgt*100)):0);
                const late=o.status==='done'&&Number(o.kosu)>0&&d<0;
                return(
                  <tr key={o.id} style={{background:isNext?'#F2F6FD':(o.status==='done'?'#FAFBFC':(i%2?'#F7F9FC':'#fff')),opacity:o.status==='done'?.8:1}}>
                    <td style={{...td,fontWeight:700,color:'#5A6472'}}>{i+1}</td>
                    <td style={{...td,whiteSpace:'normal'}}>
                      <div style={{fontWeight:700,fontSize:15,color:isTask?'#6D3FBF':'#111'}}>{isTask?'🔧 '+(o.taskName||'作業'):o.hinban}</div>
                      <div style={{fontSize:11,color:'#6B7480',lineHeight:1.45}}>
                        {isTask?'（製品なし）':[(master[o.hinban]||{}).partNo||o.partNo,dv(master[o.hinban]||{},'name',lang)||o.hinbanName].filter(Boolean).join('　')||'—'}
                      </div>
                    </td>
                    <td style={td}>{isTask?'—':`${o.targetBoxes} ${t('箱')}`}</td>
                    <td style={{...td,color:'#5A6472'}}>{isTask?'—':(Number(o.kosu)>0?o.kosu+t('分'):'—')}</td>
                    <td style={{...td,fontWeight:700,color:NAVY}}>{Math.round(o._planMin)} {t('分')}</td>
                    <td style={{...td,fontVariantNumeric:'tabular-nums'}}>
                      <div style={{fontWeight:700,color:NAVY}}>{min2hm(o._planStart)}</div>
                      <div style={{fontSize:11.5,color:'#6B7480'}}>→ {min2hm(o._planEnd)}</div>
                    </td>
                    <td style={{...td,fontVariantNumeric:'tabular-nums'}}>
                      <div style={{fontWeight:700,color:o.startAt?'#1A1A1A':'#C7CDD6'}}>{o.startAt?fmtHM(new Date(o.startAt)):'—'}</div>
                      <div style={{fontSize:11.5,color:'#6B7480'}}>{o.endAt?'→ '+fmtHM(new Date(o.endAt)):(o.startAt?'→ 作業中':'')}</div>
                    </td>
                    <td style={td}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <div style={{flex:1,height:9,background:'#E8EAEE',borderRadius:5,overflow:'hidden',minWidth:38}}>
                          <div style={{width:pct+'%',height:'100%',background:o.status==='done'?'#2E7D4F':(late?'#C2410C':NAVY)}}/>
                        </div>
                        <span style={{fontSize:11.5,fontWeight:700,color:'#3A4552',minWidth:40,textAlign:'right'}}>
                          {isTask?(o.status==='done'?'完了':'—'):`${done}/${tgt}`}
                        </span>
                      </div>
                    </td>
                    <td style={{...td,fontWeight:800,color:o.status==='done'?(Number(o.kosu)>0||isTask?(d>=0?'#1B5E20':'#B71C1C'):'#9AA3AF'):'#C7CDD6'}}>
                      {o.status==='done'?((Number(o.kosu)>0||isTask)?((d>=0?'+':'−')+Math.abs(Math.round(d))):'—'):'—'}
                    </td>
                    <td style={{...td,textAlign:'center'}}>
                      {o.status==='done'
                        ? <span style={{fontSize:13,color:'#9AA3AF'}}>✓ {t('完了')}</span>
                        : <button onClick={()=>o.status==='pending'?onOpenSheet(o,worker):onResume(o)}
                            style={{minHeight:38,padding:'0 10px',borderRadius:8,background:o.status==='pending'?(isNext?'#2E7D4F':NAVY):'#C2410C',color:'#fff',fontSize:13,fontWeight:700,whiteSpace:'nowrap'}}>
                            {o.status==='pending'?t('作業開始'):t('作業に戻る')}
                          </button>}
                    </td>
                  </tr>
                );
              })}
              {rows.length===0&&<tr><td colSpan={10} style={{padding:'44px',textAlign:'center',color:'#9AA3AF',fontSize:14}}>{t('計画がありません')}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      <FooterBar
        left={<>
          <FBtn onClick={onBack}>‹ {t('工程一覧へ')}</FBtn>
          <span style={{display:'flex',alignItems:'center',gap:8,fontSize:14,color:'#5A6472',fontWeight:600,whiteSpace:'nowrap'}}>🕐 {stamp}</span>
        </>}
        right={<div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'flex-end'}}>
          {[...(QR_ENABLED?[['▦ '+t('QR照合'),onQR]]:[]),
            ['🔍 '+t('製品検索'),onSearch],['📅 '+t('スケジュール編集'),onPlanner],
            ['📋 '+t('履歴'),onHistory],['📊 '+t('評価'),onAnalytics],['⚙ '+t('マスター'),onMaster],['⇥ '+t('ログアウト'),onLogout]].map(([lb,fn])=>(
            <button key={lb} onClick={fn} style={{minHeight:44,padding:'0 14px',borderRadius:8,background:'#fff',border:'1px solid '+LINE,color:NAVY,fontSize:13.5,fontWeight:700,whiteSpace:'nowrap'}}>{lb}</button>
          ))}
        </div>}/>
      {QR_ENABLED&&scanW&&<QRScannerModal expectedValue="" label={t('担当者QR')} onSuccess={resolveWorker} onClose={()=>setScanW(false)}/>}
    </div>
  );
}

/* ── スケジュール編集（管理者） ── */
function SchedulePlanner({proc,master,workers,orders,settings,user,onBack}){
  const{lang,t,b}=useLang();
  const[date,setDate]=useState(todayKey());
  const[busy,setBusy]=useState(false);
  const[addH,setAddH]=useState('');
  const[addQty,setAddQty]=useState('');
  const[addW,setAddW]=useState('');
  const[pick,setPick]=useState(false);
  const[mode,setMode]=useState('item');      /* item=製品の行 / task=作業の行 */
  const[addTask,setAddTask]=useState('');
  const[addDur,setAddDur]=useState('');
  const[shiftOpen,setShiftOpen]=useState(false);
  const wlist=Object.values(workers||{}).sort((a,b)=>(a.order||0)-(b.order||0));
  const raw=Object.values(orders||{}).filter(o=>o.procId===proc.id&&o.date===date).sort((a,b)=>(a.order||0)-(b.order||0));
  const rows=buildTimeline(raw,settings);
  const col=db.collection('workOrders');
  async function run(fn){if(busy)return;setBusy(true);try{await fn();}catch(e){alert('更新に失敗: '+e.message);}finally{setBusy(false);}}
  async function add(){
    const h=addH.trim(); const q=parseInt(addQty,10)||0;
    if(!h||q<=0){alert('品番と数量を入力してください');return;}
    const m=master[h]||{};
    const w=wlist.find(x=>x.id===addW)||null;
    await run(()=>col.add({
      date,procId:proc.id,procName:proc.ja,order:(rows.length?Math.max(...rows.map(r=>r.order||0)):0)+10,
      hinban:h,hinbanName:m.name||'',partNo:m.partNo||'',targetBoxes:q,
      kosu:Number(m.sheets?.[proc.id]?.kosu)||0,capacity:Number(m.packing?.capacity)||0,
      assignedWorkerId:w?w.id:null,assignedWorkerName:w?w.name:'',
      workerId:null,workerName:'',status:'pending',
      startAt:null,endAt:null,doneBoxes:0,fraction:0,pauses:[],anomalies:[],createdBy:user?.email||''
    }));
    setAddQty('');
  }
  async function addTaskRow(){
    const nm=addTask.trim(); const dmin=parseInt(addDur,10)||0;
    if(!nm||dmin<=0){alert('作業名と所要時間を入力してください');return;}
    const w=wlist.find(x=>x.id===addW)||null;
    await run(()=>col.add({
      date,procId:proc.id,procName:proc.ja,order:(rows.length?Math.max(...rows.map(r=>r.order||0)):0)+10,
      kind:'task',taskName:nm,durMin:dmin,
      hinban:'',hinbanName:'',partNo:'',targetBoxes:0,kosu:0,capacity:0,
      assignedWorkerId:w?w.id:null,assignedWorkerName:w?w.name:'',
      workerId:null,workerName:'',status:'pending',
      startAt:null,endAt:null,doneBoxes:0,fraction:0,pauses:[],anomalies:[],createdBy:user?.email||''
    }));
    setAddTask('');setAddDur('');
  }
  async function move(i,dir){
    const j=i+dir; if(j<0||j>=rows.length)return;
    const a=rows[i],bb=rows[j];
    await run(async()=>{await col.doc(a.id).update({order:bb.order||0});await col.doc(bb.id).update({order:a.order||0});});
  }
  async function del(o){
    if(o.status!=='pending'&&!window.confirm('開始済みの行です。削除すると実績も消えます。よろしいですか？'))return;
    if(o.status==='pending'&&!window.confirm(`${o.hinban} の行を削除しますか？`))return;
    await run(()=>col.doc(o.id).delete());
  }
  async function setQty(o,v){
    const q=parseInt(v,10)||0; if(q<=0)return;
    await run(()=>col.doc(o.id).update({targetBoxes:q}));
  }
  async function setAssign(o,id){
    const w=wlist.find(x=>x.id===id)||null;
    await run(()=>col.doc(o.id).update({assignedWorkerId:w?w.id:null,assignedWorkerName:w?w.name:''}));
  }
  async function copyFrom(){
    const src=prompt('コピー元の日付（YYYY-MM-DD）',daysAgoKey(1));
    if(!src)return;
    const srcRows=Object.values(orders||{}).filter(o=>o.procId===proc.id&&o.date===src).sort((a,b)=>(a.order||0)-(b.order||0));
    if(!srcRows.length){alert(src+' の計画がありません');return;}
    if(!window.confirm(`${src} の ${srcRows.length} 行を ${date} に複製しますか？`))return;
    await run(async()=>{
      let n=(rows.length?Math.max(...rows.map(r=>r.order||0)):0)+10;
      for(const o of srcRows){
        await col.add({date,procId:proc.id,procName:proc.ja,order:n,kind:o.kind||'item',taskName:o.taskName||'',durMin:o.durMin||0,hinban:o.hinban,hinbanName:o.hinbanName||'',partNo:o.partNo||'',
          targetBoxes:o.targetBoxes,kosu:o.kosu||0,capacity:o.capacity||0,
          assignedWorkerId:o.assignedWorkerId||null,assignedWorkerName:o.assignedWorkerName||'',
          workerId:null,workerName:'',status:'pending',startAt:null,endAt:null,doneBoxes:0,fraction:0,pauses:[],anomalies:[],createdBy:user?.email||''});
        n+=10;
      }
    });
  }
  const planMin=rows.reduce((a,o)=>a+o._planMin,0);
  const th={padding:'7px 8px',fontSize:12,fontWeight:700,color:'#fff',textAlign:'left',whiteSpace:'nowrap',verticalAlign:'bottom'};
  const td={padding:'7px 8px',fontSize:13.5,borderBottom:'1px solid '+LINE,whiteSpace:'nowrap'};
  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column'}}>
      <TopBar title={b('スケジュール編集')} onBack={onBack} user={user}
        left={<div style={{color:'#fff',fontSize:14,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>🏭 {lang==='id'?proc.id_:proc.ja}</div>}/>
      <div style={{flex:1,overflowY:'auto',padding:'16px 24px'}}>
        <div style={{display:'flex',gap:12,alignItems:'flex-end',flexWrap:'wrap',marginBottom:14}}>
          <div><div style={{fontSize:12,fontWeight:700,color:'#4A5460',marginBottom:5}}>{b('日付')}</div>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:172,fontSize:15}}/></div>
          <div style={{display:'flex',gap:0,alignSelf:'flex-end',borderRadius:8,overflow:'hidden',border:'1px solid '+LINE}}>
            {[['item',b('製品の行')],['task',b('作業の行')]].map(([k,lb])=>(
              <button key={k} onClick={()=>setMode(k)} style={{minHeight:46,padding:'0 14px',fontSize:13,fontWeight:700,background:mode===k?NAVY:'#fff',color:mode===k?'#fff':'#4A5460',whiteSpace:'nowrap'}}>{lb}</button>
            ))}
          </div>
          {mode==='task'?<>
            <div style={{flex:1,minWidth:200}}><div style={{fontSize:12,fontWeight:700,color:'#4A5460',marginBottom:5}}>{b('作業名')}</div>
              <input value={addTask} onChange={e=>setAddTask(e.target.value)} placeholder="例: ハンガーマン / 清掃"/></div>
            <div><div style={{fontSize:12,fontWeight:700,color:'#4A5460',marginBottom:5}}>{b('所要時間')}（{t('分')}）</div>
              <input type="number" min="1" value={addDur} onChange={e=>setAddDur(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTaskRow()} placeholder="例: 30" style={{width:120}}/></div>
          </>:<>
          <div style={{flex:1,minWidth:240}}><div style={{fontSize:12,fontWeight:700,color:'#4A5460',marginBottom:5}}>{b('呼称')}</div>
            <button onClick={()=>setPick(true)}
              style={{width:'100%',minHeight:46,padding:'0 14px',borderRadius:8,border:'1px solid '+(addH?NAVY:LINE),background:addH?'#F2F6FD':'#fff',display:'flex',alignItems:'center',gap:10,textAlign:'left'}}>
              {addH?<>
                <span style={{fontSize:16,fontWeight:800,color:NAVY,whiteSpace:'nowrap'}}>{addH}</span>
                <span style={{fontSize:12.5,color:'#5A6472',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{[(master[addH]||{}).partNo,dv(master[addH]||{},'name',lang)].filter(Boolean).join('　')}</span>
                <span style={{fontSize:12,fontWeight:700,color:NAVY,whiteSpace:'nowrap'}}>{t('変更')}</span>
              </>:<>
                <span style={{fontSize:16}}>🔍</span>
                <span style={{fontSize:14,color:'#9AA3AF',flex:1}}>{t('選択してください')}</span>
              </>}
            </button></div>
          <div><div style={{fontSize:12,fontWeight:700,color:'#4A5460',marginBottom:5}}>{b('数量')}（{t('箱')}）</div>
            <input type="number" min="1" value={addQty} onChange={e=>setAddQty(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="例: 20" style={{width:120}}/></div>
          </>}
          <div><div style={{fontSize:12,fontWeight:700,color:'#4A5460',marginBottom:5}}>{b('担当者')}（{b('任意')}）</div>
            <select value={addW} onChange={e=>setAddW(e.target.value)} style={{width:150}}>
              <option value="">{t('未割当')}</option>
              {wlist.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
            </select></div>
          {mode==='task'
            ?<button onClick={addTaskRow} disabled={busy||!addTask.trim()||!(parseInt(addDur,10)>0)}
               style={{minHeight:46,padding:'0 22px',borderRadius:8,background:(busy||!addTask.trim()||!(parseInt(addDur,10)>0))?'#C7CDD6':'#6D3FBF',color:'#fff',fontSize:15,fontWeight:700,whiteSpace:'nowrap'}}>＋ {t('行を追加')}</button>
            :<button onClick={add} disabled={busy||!addH.trim()||!(parseInt(addQty,10)>0)}
               style={{minHeight:46,padding:'0 22px',borderRadius:8,background:(busy||!addH.trim()||!(parseInt(addQty,10)>0))?'#C7CDD6':NAVY,color:'#fff',fontSize:15,fontWeight:700,whiteSpace:'nowrap'}}>＋ {t('行を追加')}</button>}
          <button onClick={copyFrom} disabled={busy} style={{minHeight:46,padding:'0 16px',borderRadius:8,border:'1px solid '+LINE,background:'#fff',color:NAVY,fontSize:14,fontWeight:700,whiteSpace:'nowrap'}}>⧉ 前日から複製</button>
          <button onClick={()=>setShiftOpen(true)} style={{minHeight:46,padding:'0 16px',borderRadius:8,border:'1px solid '+LINE,background:'#fff',color:NAVY,fontSize:14,fontWeight:700,whiteSpace:'nowrap'}}>⏰ {t('始業・休憩設定')}</button>
        </div>
        <div style={{fontSize:13,color:'#5A6472',marginBottom:8}}>
          {rows.length} 行　/　{b('予定時間')} <b style={{color:NAVY}}>{Math.round(planMin)} {t('分')}</b>
          　/　{b('始業時刻')} <b style={{color:NAVY}}>{(settings||DEFAULT_SETTINGS).startTime}</b>
          {rows.length>0&&<>　/　{b('終業見込み')} <b style={{color:NAVY}}>{min2hm(rows[rows.length-1]._planEnd)}</b></>}
          <div style={{fontSize:11.5,color:'#8A93A0',marginTop:3}}>
            {b('休憩')}：{((settings||DEFAULT_SETTINGS).breaks||[]).map(x=>`${x.label} ${x.from}-${x.to}`).join('　')||'なし'}
          </div>
        </div>
        <div style={{border:'1px solid '+LINE,borderRadius:10,overflowX:'auto',background:'#fff'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{background:NAVY}}>
              <th style={{...th,width:40}}>#</th><th style={{...th,minWidth:150}}><TH k="呼称" k2="品名"/></th>
              <th style={{...th,width:78}}><TH k="数量"/></th><th style={{...th,width:66}}><TH k="1箱工数"/></th>
              <th style={{...th,width:66}}><TH k="予定時間"/></th><th style={{...th,width:84}}><TH k="予定"/></th>
              <th style={{...th,width:120}}><TH k="担当者"/></th><th style={{...th,width:74}}><TH k="状態"/></th><th style={{...th,width:112,textAlign:'center'}}>操作</th>
            </tr></thead>
            <tbody>
              {rows.map((o,i)=>{
                const m=master[o.hinban]||{};
                const locked=o.status!=='pending';
                const isTask=o.kind==='task';
                return(
                  <tr key={o.id} style={{background:i%2?'#F7F9FC':'#fff'}}>
                    <td style={{...td,fontWeight:700,color:'#5A6472'}}>{i+1}</td>
                    <td style={{...td,whiteSpace:'normal'}}>
                      <div style={{fontWeight:700,color:isTask?'#6D3FBF':'#111'}}>{isTask?'🔧 '+(o.taskName||'作業'):o.hinban}</div>
                      <div style={{fontSize:11,color:'#6B7480',lineHeight:1.45}}>{isTask?'（製品なし）':[m.partNo||o.partNo,dv(m,'name',lang)||o.hinbanName].filter(Boolean).join('　')||'—'}</div>
                    </td>
                    <td style={td}>
                      {isTask?'—':(locked?`${o.targetBoxes} ${t('箱')}`:
                        <input type="number" min="1" defaultValue={o.targetBoxes} onBlur={e=>setQty(o,e.target.value)} style={{width:84,fontSize:14,padding:'6px 8px'}}/>)}
                    </td>
                    <td style={{...td,color:isTask?'#6B7480':(Number(o.kosu)>0?'#1A1A1A':'#C2410C')}}>{isTask?'—':(Number(o.kosu)>0?o.kosu+' '+t('分'):'未登録')}</td>
                    <td style={{...td,fontWeight:700,color:NAVY}}>{Math.round(o._planMin)} {t('分')}</td>
                    <td style={{...td,fontVariantNumeric:'tabular-nums'}}>
                      <div style={{fontWeight:700,color:NAVY}}>{min2hm(o._planStart)}</div>
                      <div style={{fontSize:11.5,color:'#6B7480'}}>→ {min2hm(o._planEnd)}</div>
                    </td>
                    <td style={td}>
                      {locked?(o.workerName||o.assignedWorkerName||t('未割当')):
                        <select value={o.assignedWorkerId||''} onChange={e=>setAssign(o,e.target.value)} style={{width:140,fontSize:13,padding:'6px 8px'}}>
                          <option value="">{t('未割当')}</option>
                          {wlist.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
                        </select>}
                    </td>
                    <td style={td}>
                      <span style={{fontSize:12,fontWeight:700,padding:'3px 9px',borderRadius:5,
                        background:o.status==='done'?'#DBEAFE':(o.status==='pending'?'#E8EAEE':'#FDE68A'),
                        color:o.status==='done'?'#1E40AF':(o.status==='pending'?'#5A6472':'#7A5A00')}}>
                        {o.status==='done'?t('完了'):(o.status==='pending'?t('未着手'):t('作業中'))}
                      </span>
                    </td>
                    <td style={{...td,textAlign:'center'}}>
                      <div style={{display:'flex',gap:5,justifyContent:'center'}}>
                        <button onClick={()=>move(i,-1)} disabled={busy||i===0} style={{width:30,height:32,borderRadius:6,border:'1px solid '+LINE,background:'#fff',color:i===0?'#C7CDD6':NAVY,fontSize:13,fontWeight:700}}>↑</button>
                        <button onClick={()=>move(i,1)} disabled={busy||i===rows.length-1} style={{width:30,height:32,borderRadius:6,border:'1px solid '+LINE,background:'#fff',color:i===rows.length-1?'#C7CDD6':NAVY,fontSize:13,fontWeight:700}}>↓</button>
                        <button onClick={()=>del(o)} disabled={busy} style={{width:30,height:32,borderRadius:6,background:'#FDECEA',color:'#B71C1C',fontSize:13,fontWeight:700}}>×</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {rows.length===0&&<tr><td colSpan={9} style={{padding:'40px',textAlign:'center',color:'#9AA3AF',fontSize:14}}>{t('計画がありません')}　上の欄から行を追加してください。</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      <FooterBar left={<FBtn onClick={onBack}>‹ {b('計画表')}</FBtn>}/>
      {pick&&<HinbanPicker master={master} procId={proc.id} onPick={h=>setAddH(h)} onClose={()=>setPick(false)}/>}
      {shiftOpen&&<ShiftSettingsModal proc={proc} settings={settings} onClose={()=>setShiftOpen(false)}/>}
    </div>
  );
}

/* ── 要領書 表示部品（要領書画面・実行画面で共用） ── */
function SheetSteps({sheet,lang,compact}){
  const{t}=useLang();
  const steps=(sheet&&sheet.steps)||[];
  if(!steps.length)return <div style={{padding:'30px 16px',textAlign:'center',color:'#9AA3AF',fontSize:14}}>{t('要領書が未登録です')}</div>;
  return(
    <div style={{display:'flex',flexDirection:'column',gap:compact?10:14}}>
      {steps.map((s,i)=>(
        <div key={i} style={{display:'flex',gap:12,padding:compact?'10px 12px':'14px 16px',background:'#fff',border:'1px solid '+LINE,borderRadius:10}}>
          <NumBadge n={i+1} size={compact?26:30}/>
          {s.img&&<TapPhoto src={s.img} style={{width:compact?120:180,height:compact?90:135,objectFit:'contain',borderRadius:8,background:'#F0F2F5',flexShrink:0}} ratio={90}/>}
          <div style={{flex:1,fontSize:compact?14:15.5,lineHeight:1.8,color:'#2A3340',whiteSpace:'pre-wrap'}}>{dv(s,'text',lang)}</div>
        </div>
      ))}
    </div>
  );
}

/* ── 要領書確認画面（作業開始前） ── */
function WorkSheetScreen({proc,order,worker,master,user,onBack,onStart,onInfo}){
  const{lang,t,b}=useLang();
  const hinban=order.hinban;
  const m=master[hinban]||{};
  const sheet=m.sheets?.[proc.id]||{};
  const kosu=Number(order.kosu)||Number(sheet.kosu)||0;
  const cap=Number(order.capacity)||Number(m.packing?.capacity)||0;
  const tgt=Number(order.targetBoxes)||0;
  const[ack,setAck]=useState(false);
  const[starting,setStarting]=useState(false);
  const useWorker=worker||(order.assignedWorkerId?{id:order.assignedWorkerId,name:order.assignedWorkerName}:null);
  async function start(){
    setStarting(true);
    try{
      await db.collection('workOrders').doc(order.id).update({
        status:'running',startAt:Date.now(),
        kosu,capacity:cap,
        workerId:useWorker?useWorker.id:null,workerName:useWorker?useWorker.name:'',
      });
      onStart(order.id);
    }catch(e){alert('開始に失敗: '+e.message);setStarting(false);}
  }
  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column'}}>
      <TopBar title={b('要領書')+'：'+hinban} onBack={onBack} user={user}
        left={<div style={{color:'#fff',fontSize:14,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>🏭 {lang==='id'?proc.id_:proc.ja}</div>}/>
      <div style={{flex:1,display:'flex',minHeight:0}}>
        <div style={{flex:'1 1 60%',overflowY:'auto',padding:'18px 22px'}}>
          <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:12}}>
            <div style={{fontSize:30,fontWeight:800,color:NAVY}}>{hinban}</div>
            <div style={{fontSize:16,color:'#3A4552'}}>{dv(m,'name',lang)}</div>
            {m.productImg&&<TapPhoto src={m.productImg} style={{width:70,height:56,objectFit:'contain',borderRadius:6,border:'1px solid '+LINE,marginLeft:'auto'}}/>}
          </div>
          <div style={{fontSize:14,fontWeight:700,color:BLUE,marginBottom:10}}>📋 {b('作業手順を確認してください')}</div>
          <SheetSteps sheet={sheet} lang={lang}/>
          <WarnBox items={dva(sheet,'notes',lang)}/>
        </div>
        <div style={{flex:'0 0 360px',borderLeft:'1px solid '+LINE,background:'#fff',padding:'20px',display:'flex',flexDirection:'column',gap:14,overflowY:'auto'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:'#F2F6FD',borderRadius:10}}>
            <span style={{fontSize:22}}>👤</span>
            <div><div style={{fontSize:11,color:'#6B7480'}}>{b('担当者')}</div>
              <div style={{fontSize:17,fontWeight:700,color:useWorker?NAVY:'#9AA3AF'}}>{useWorker?useWorker.name:t('担当者なし')}</div></div>
          </div>
          <div style={{padding:'16px',background:'#F2F6FD',borderRadius:10,textAlign:'center'}}>
            <div style={{fontSize:12,color:'#6B7480'}}>{b('目標箱数')}</div>
            <div style={{fontSize:44,fontWeight:800,color:NAVY,lineHeight:1.15}}>{tgt}<span style={{fontSize:18,marginLeft:4}}>{t('箱')}</span></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div style={{padding:'10px 12px',border:'1px solid '+LINE,borderRadius:10}}>
              <div style={{fontSize:11,color:'#6B7480'}}>{b('1箱工数')}</div>
              <div style={{fontSize:22,fontWeight:800,color:kosu?NAVY:'#C7CDD6'}}>{kosu||'—'}<span style={{fontSize:12,marginLeft:3}}>{t('分')}</span></div>
            </div>
            <div style={{padding:'10px 12px',border:'1px solid '+LINE,borderRadius:10}}>
              <div style={{fontSize:11,color:'#6B7480'}}>{b('収容数')}</div>
              <div style={{fontSize:22,fontWeight:800,color:cap?NAVY:'#C7CDD6'}}>{cap||'—'}<span style={{fontSize:12,marginLeft:3}}>個</span></div>
            </div>
          </div>
          {kosu>0&&tgt>0&&<div style={{fontSize:12.5,color:'#5A6472',textAlign:'center'}}>{b('標準')}: {Math.round(kosu*tgt)} {t('分')}（{b('終了予定')} {fmtHM(new Date(Date.now()+kosu*tgt*60000))}）</div>}
          {!kosu&&<div style={{fontSize:12,color:'#B45309',background:'#FEF3E7',padding:'8px 10px',borderRadius:8}}>⚠ 1箱工数が未登録のため先行・遅れは表示されません（マスター管理 → 要領書・工数）</div>}
          <label style={{display:'flex',alignItems:'center',gap:10,padding:'14px',border:'2px solid '+(ack?'#2E7D4F':LINE),borderRadius:10,background:ack?'#E8F5E9':'#fff',cursor:'pointer',marginTop:'auto'}}>
            <input type="checkbox" checked={ack} onChange={e=>setAck(e.target.checked)} style={{width:22,height:22}}/>
            <span style={{fontSize:15,fontWeight:700,color:ack?'#1B5E20':'#4A5460'}}>{b('確認しました')}</span>
          </label>
          <button onClick={start} disabled={starting||!ack}
            style={{minHeight:74,borderRadius:12,background:(starting||!ack)?'#C7CDD6':'#2E7D4F',color:'#fff',fontSize:24,fontWeight:800}}>
            ▶ {t('作業開始')}
          </button>
        </div>
      </div>
      <FooterBar left={<FBtn onClick={onBack}>‹ {b('計画表')}</FBtn>} right={<FBtn onClick={()=>onInfo(hinban)}>ℹ {t('製品情報を見る')}</FBtn>}/>
    </div>
  );
}

/* ── 実行画面（作業中） ── */
function WorkRunScreen({proc,log,master,orders,user,onExit,onInfo,onDone}){
  const{lang,t,b}=useLang();
  const now=useNow();
  const[anom,setAnom]=useState(false);
  const[out,setOut]=useState(false);
  const[result,setResult]=useState(null);
  const[busy,setBusy]=useState(false);
  const isTask=log.kind==='task';
  const m=master[log.hinban]||{};
  const sheet=m.sheets?.[proc.id]||{};
  const c=calcLog(log,now);
  const taskPlanMin=Number(log.durMin)||0;
  const taskDiff=taskPlanMin-(c.active/60000);
  /* 今日・同一工程の完了分の累計（リザルトに表示） */
  const todaySum=summarize(Object.values(orders||{}).filter(o=>o.status==='done'&&o.procId===proc.id&&o.date===log.date));
  const paused=log.status==='paused';
  const ref=db.collection('workOrders').doc(log.id);
  async function w(fn){if(busy)return;setBusy(true);try{await fn();}catch(e){alert('更新に失敗: '+e.message);}finally{setBusy(false);}}
  const addBox=()=>w(()=>ref.update({doneBoxes:(log.doneBoxes||0)+1}));
  const undoBox=()=>w(()=>ref.update({doneBoxes:Math.max(0,(log.doneBoxes||0)-1)}));
  const pause=type=>w(()=>ref.update({status:'paused',pauses:[...(log.pauses||[]),{type,from:Date.now()}]}));
  const resume=()=>w(()=>{const ps=[...(log.pauses||[])];const last=ps[ps.length-1];if(last&&!last.to)ps[ps.length-1]={...last,to:Date.now()};return ref.update({status:'running',pauses:ps});});
  const addAnom=comment=>w(()=>ref.update({anomalies:[...(log.anomalies||[]),{at:Date.now(),comment}]}));
  async function finish(fraction){
    let res=null;
    await w(async()=>{
      const ps=[...(log.pauses||[])];const last=ps[ps.length-1];const end=Date.now();
      if(last&&!last.to)ps[ps.length-1]={...last,to:end};
      const snap=calcLog({...log,pauses:ps,fraction,endAt:end},end);
      const std=isTask?taskPlanMin:snap.stdMin;
      const payload={status:'done',endAt:end,pauses:ps,fraction,
        stdMin:Math.round(std*10)/10,actMin:Math.round(snap.actMin*10)/10,
        diffMin:Math.round((std-snap.actMin)*10)/10,pausedMin:Math.round(snap.paused/600)/100};
      await ref.update(payload);
      res={
        title:isTask?('🔧 '+(log.taskName||'作業')):(log.hinban+'　'+(dv(m,'name',lang)||'')),
        isTask,doneBoxes:log.doneBoxes||0,targetBoxes:log.targetBoxes||0,fraction:Number(fraction)||0,
        stdMin:payload.stdMin,actMin:payload.actMin,diffMin:payload.diffMin,pausedMin:payload.pausedMin,
        startAt:log.startAt||end,endAt:end,anomCount:(log.anomalies||[]).length
      };
    });
    setOut(false);
    if(res)setResult(res); else onDone();
  }
  const done=log.doneBoxes||0, target=log.targetBoxes||0;
  const pct=target?Math.min(100,Math.round(done/target*100)):0;
  const ahead=c.diffMin>=0;
  const diffTxt=c.hasKosu?((ahead?'+':'−')+Math.abs(Math.round(c.diffMin))+' '+t('分')):'—';
  const curType=c.cur?(c.cur.type==='break'?t('休憩'):t('ライン応援')):'';
  const bigBtn=(label,onClick,bg,disabled,h)=>(
    <button onClick={onClick} disabled={disabled||busy}
      style={{minHeight:h||64,borderRadius:12,background:disabled?'#C7CDD6':bg,color:'#fff',fontSize:h?26:17,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',gap:10,opacity:busy?.7:1}}>{label}</button>
  );
  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column'}}>
      <TopBar title={isTask?('🔧 '+(log.taskName||'作業')):(log.hinban+'　'+(dv(m,'name',lang)||''))} user={user}
        left={<div style={{color:'#fff',fontSize:14,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>👤 {log.workerName||t('担当者なし')}　｜ {lang==='id'?proc.id_:proc.ja}</div>}/>
      {paused&&(
        <div style={{background:'#FDE68A',color:'#7A5A00',padding:'10px 20px',display:'flex',alignItems:'center',gap:14,fontWeight:800,fontSize:17}}>
          ⏸ {t('一時停止中')}（{curType}）　{c.cur&&fmtDur(now-c.cur.from)}
          <button onClick={resume} style={{marginLeft:'auto',minHeight:44,padding:'0 26px',borderRadius:10,background:'#2E7D4F',color:'#fff',fontSize:16,fontWeight:800}}>▶ {t('再開')}</button>
        </div>
      )}
      <div style={{flex:1,display:'flex',minHeight:0}}>
        {/* 左：要領書 */}
        <div style={{flex:'1 1 45%',overflowY:'auto',padding:'14px 18px',background:'#F5F6F8'}}>
          {isTask?(
            <div className="panel"><div className="panel-h">🔧 {log.taskName||'作業'}</div>
              <div style={{padding:16,fontSize:15,lineHeight:1.9,color:'#2A3340'}}>
                {b('所要時間')}：<b style={{fontSize:20,color:NAVY}}>{taskPlanMin} {t('分')}</b><br/>
                <span style={{fontSize:13,color:'#6B7480'}}>製品を伴わない作業です。完了したら「作業終了」を押してください。</span>
              </div>
            </div>
          ):(<>
            <div style={{fontSize:13,fontWeight:700,color:BLUE,marginBottom:8}}>📋 {b('要領書')}</div>
            <SheetSteps sheet={sheet} lang={lang} compact/>
            <WarnBox items={dva(sheet,'notes',lang)}/>
          </>)}
        </div>
        {/* 右：操作パネル */}
        <div style={{flex:'0 0 520px',borderLeft:'1px solid '+LINE,background:'#fff',padding:'14px 18px',display:'flex',flexDirection:'column',gap:10,overflowY:'auto'}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
            {[[b('現在時刻'),fmtHMS(new Date(now)),NAVY],[b('終了予定'),c.hasKosu?fmtHM(c.eta):'—',NAVY],[b('経過')+' / '+b('実働'),fmtDur(c.elapsed)+' / '+fmtDur(c.active),'#3A4552']].map(([k,v,col],i)=>(
              <div key={i} style={{padding:'8px 10px',background:'#F7F9FC',borderRadius:8,textAlign:'center'}}>
                <div style={{fontSize:10.5,color:'#6B7480'}}>{k}</div><div style={{fontSize:i===2?14:20,fontWeight:800,color:col,fontVariantNumeric:'tabular-nums'}}>{v}</div>
              </div>
            ))}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div style={{padding:'12px 14px',border:'1px solid '+LINE,borderRadius:10}}>
              <div style={{fontSize:11,color:'#6B7480'}}>{b('進捗')}</div>
              {isTask?<>
                <div style={{fontSize:30,fontWeight:800,color:NAVY,lineHeight:1.15}}>{Math.round(c.active/60000)}<span style={{fontSize:15,color:'#6B7480'}}> / {taskPlanMin} {t('分')}</span></div>
                <div style={{height:10,background:'#E8EAEE',borderRadius:5,marginTop:8,overflow:'hidden'}}>
                  <div style={{width:Math.min(100,taskPlanMin?Math.round(c.active/60000/taskPlanMin*100):0)+'%',height:'100%',background:NAVY,transition:'width .3s'}}/>
                </div>
              </>:<>
                <div style={{fontSize:34,fontWeight:800,color:NAVY,lineHeight:1.1}}>{done}<span style={{fontSize:16,color:'#6B7480'}}> / {target} {t('箱')}</span></div>
                <div style={{height:10,background:'#E8EAEE',borderRadius:5,marginTop:8,overflow:'hidden'}}><div style={{width:pct+'%',height:'100%',background:done>=target&&target?'#2E7D4F':NAVY,transition:'width .3s'}}/></div>
                <div style={{fontSize:11,color:'#6B7480',marginTop:4,textAlign:'right'}}>{pct}%</div>
              </>}
            </div>
            <div style={{padding:'12px 14px',borderRadius:10,background:(c.hasKosu||isTask)?((isTask?taskDiff>=0:ahead)?'#E8F5E9':'#FDECEA'):'#F7F9FC',border:'1px solid '+((c.hasKosu||isTask)?((isTask?taskDiff>=0:ahead)?'#A5D6A7':'#F5B7B1'):LINE)}}>
              <div style={{fontSize:11,color:'#6B7480'}}>{(c.hasKosu||isTask)?((isTask?taskDiff>=0:ahead)?'▲ '+b('先行'):'▼ '+b('遅れ')):b('先行')+'/'+b('遅れ')}</div>
              <div style={{fontSize:34,fontWeight:800,lineHeight:1.1,color:(c.hasKosu||isTask)?((isTask?taskDiff>=0:ahead)?'#1B5E20':'#B71C1C'):'#C7CDD6',fontVariantNumeric:'tabular-nums'}}>
                {isTask?((taskDiff>=0?'+':'−')+Math.abs(Math.round(taskDiff))+' '+t('分')):diffTxt}
              </div>
              <div style={{fontSize:11,color:'#6B7480',marginTop:6}}>{b('標準')} {Math.round(isTask?taskPlanMin:c.stdMin)}{t('分')} / {b('実働')} {Math.round(c.actMin)}{t('分')}</div>
            </div>
          </div>
          {!isTask&&bigBtn(<><span style={{fontSize:34}}>📦</span>{t('1箱完了')}</>,addBox,'#2E7D4F',paused,112)}
          <div style={{display:'grid',gridTemplateColumns:isTask?'1fr 1fr':'1fr 1fr 1fr',gap:8}}>
            {!isTask&&<button onClick={undoBox} disabled={busy||paused||done<=0} style={{minHeight:46,borderRadius:10,border:'1px solid '+LINE,background:'#fff',color:done>0&&!paused?'#3A4552':'#C7CDD6',fontSize:14,fontWeight:700}}>↩ {t('1つ戻す')}</button>}
            <button onClick={()=>pause('break')} disabled={busy||paused} style={{minHeight:46,borderRadius:10,background:paused?'#E8EAEE':'#FEF3C7',color:paused?'#9AA3AF':'#92400E',fontSize:14,fontWeight:800}}>☕ {t('休憩')}</button>
            <button onClick={()=>pause('support')} disabled={busy||paused} style={{minHeight:46,borderRadius:10,background:paused?'#E8EAEE':'#DBEAFE',color:paused?'#9AA3AF':'#1E40AF',fontSize:14,fontWeight:800}}>🤝 {t('ライン応援')}</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <button onClick={()=>setAnom(true)} disabled={busy} style={{minHeight:52,borderRadius:10,background:'#FDECEA',color:'#B71C1C',fontSize:15,fontWeight:800}}>⚠ {t('異常')}{(log.anomalies||[]).length?` (${log.anomalies.length})`:''}</button>
            <button onClick={()=>isTask?finish(0):setOut(true)} disabled={busy} style={{minHeight:52,borderRadius:10,background:NAVY,color:'#fff',fontSize:15,fontWeight:800}}>■ OUT　{t('作業終了')}</button>
          </div>
          {(log.anomalies||[]).length>0&&(
            <div style={{fontSize:12,color:'#7A3A08',background:'#FEF3E7',borderRadius:8,padding:'8px 10px',maxHeight:90,overflowY:'auto'}}>
              {log.anomalies.map((a,i)=><div key={i}>・{fmtHM(new Date(a.at))} {a.comment}</div>)}
            </div>
          )}
        </div>
      </div>
      <FooterBar left={<FBtn onClick={onExit}>‹ {b('計画表')}</FBtn>} right={<FBtn onClick={()=>onInfo(log.hinban)}>ℹ {t('製品情報を見る')}</FBtn>}/>
      {anom&&<AnomalyModal onClose={()=>setAnom(false)} onSave={async c=>{await addAnom(c);setAnom(false);}}/>}
      {out&&<OutModal log={log} calc={c} onClose={()=>setOut(false)} onFinish={finish}/>}
      {result&&<ResultModal result={result} todaySum={todaySum} onClose={()=>{setResult(null);onDone();}}/>}
    </div>
  );
}
function AnomalyModal({onClose,onSave}){
  const{t,b}=useLang();
  const[c,setC]=useState('');
  const quick=['設備の異常','素材の異常','塗装の異常','かんばんの異常','部品不足','その他'];
  return(
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{background:'#fff',borderRadius:16,width:'100%',maxWidth:520,overflow:'hidden'}}>
        <div style={{background:'#B71C1C',padding:'14px 20px',color:'#fff',fontSize:17,fontWeight:800}}>⚠ {b('異常')}</div>
        <div style={{padding:20}}>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
            {quick.map(q=><button key={q} onClick={()=>setC(s=>s?s+'／'+q:q)} style={{padding:'7px 12px',borderRadius:16,border:'1px solid '+LINE,background:'#F7F9FC',fontSize:13,fontWeight:600,color:'#3A4552'}}>{q}</button>)}
          </div>
          <textarea value={c} onChange={e=>setC(e.target.value)} placeholder={t('コメント')} style={{height:100,resize:'vertical'}} autoFocus/>
        </div>
        <div style={{padding:'0 20px 20px',display:'flex',gap:10}}>
          <button onClick={onClose} style={{flex:1,minHeight:46,borderRadius:10,border:'1px solid '+LINE,background:'#fff',fontSize:14,color:'#555'}}>{t('閉じる')}</button>
          <button onClick={()=>c.trim()&&onSave(c.trim())} disabled={!c.trim()} style={{flex:1,minHeight:46,borderRadius:10,background:c.trim()?'#B71C1C':'#C7CDD6',color:'#fff',fontSize:15,fontWeight:800}}>{t('記録する')}</button>
        </div>
      </div>
    </div>
  );
}
function OutModal({log,calc,onClose,onFinish}){
  const{t,b}=useLang();
  const[frac,setFrac]=useState('');
  const[busy,setBusy]=useState(false);
  const cap=Number(log.capacity)||0;
  const f=parseInt(frac,10)||0;
  const preview=calcLog({...log,fraction:f},Date.now());
  return(
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{background:'#fff',borderRadius:16,width:'100%',maxWidth:520,overflow:'hidden'}}>
        <div style={{background:NAVY,padding:'14px 20px',color:'#fff',fontSize:17,fontWeight:800}}>■ OUT　{b('作業終了')}</div>
        <div style={{padding:20}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
            {[[b('完了箱数'),`${log.doneBoxes||0} / ${log.targetBoxes||0}`],[b('実働'),fmtDur(preview.active)],[b('標準'),Math.round(preview.stdMin)+' '+t('分')],[b('先行')+'/'+b('遅れ'),preview.hasKosu?((preview.diffMin>=0?'+':'−')+Math.abs(Math.round(preview.diffMin))+' '+t('分')):'—']].map(([k,v],i)=>(
              <div key={i} style={{padding:'10px 12px',background:'#F7F9FC',borderRadius:8}}><div style={{fontSize:11,color:'#6B7480'}}>{k}</div><div style={{fontSize:18,fontWeight:800,color:NAVY}}>{v}</div></div>
            ))}
          </div>
          <div style={{fontSize:13,fontWeight:700,color:'#4A5460',marginBottom:6}}>{b('端数（個）')}{cap?`　※${b('収容数')} ${cap}個で箱換算`:''}</div>
          <input type="number" inputMode="numeric" min="0" value={frac} onChange={e=>setFrac(e.target.value)} placeholder="満数でない最後の箱の個数（任意）" style={{fontSize:20,fontWeight:700,textAlign:'center'}}/>
        </div>
        <div style={{padding:'0 20px 20px',display:'flex',gap:10}}>
          <button onClick={onClose} style={{flex:1,minHeight:48,borderRadius:10,border:'1px solid '+LINE,background:'#fff',fontSize:14,color:'#555'}}>{t('閉じる')}</button>
          <button onClick={async()=>{setBusy(true);await onFinish(f);}} disabled={busy} style={{flex:1,minHeight:48,borderRadius:10,background:busy?'#C7CDD6':NAVY,color:'#fff',fontSize:16,fontWeight:800}}>{busy?'...':t('完了')}</button>
        </div>
      </div>
    </div>
  );
}

/* ── 評価（日／月／年） ── */
function AnalyticsScreen({proc,master,workers,user,onBack}){
  const{lang,t,b}=useLang();
  const[mode,setMode]=useState('day');
  const[allProc,setAllProc]=useState(false);
  const[rows,setRows]=useState(null);
  const[err,setErr]=useState('');
  const buckets=buildBuckets(mode);
  const from=buckets[0].key+(mode==='day'?'':(mode==='month'?'-01':'-01-01'));
  const to=buckets[buckets.length-1].key+(mode==='day'?'':(mode==='month'?'-31':'-12-31'));

  useEffect(()=>{
    let dead=false;setRows(null);setErr('');
    (async()=>{
      try{
        const snap=await db.collection('workOrders').where('date','>=',from).where('date','<=',to).get();
        const list=[];(snap.docs||[]).forEach(d=>list.push({id:d.id,...d.data()}));
        if(!dead)setRows(list);
      }catch(e){if(!dead)setErr(e.message);}
    })();
    return()=>{dead=true;};
  },[from,to]);

  const done=(rows||[]).filter(o=>o.status==='done'&&(allProc||o.procId===proc.id));
  const sum=summarize(done);
  const values=buckets.map(bk=>summarize(done.filter(o=>bucketOf(o,mode)===bk.key)).diff);
  const boxesPer=buckets.map(bk=>summarize(done.filter(o=>bucketOf(o,mode)===bk.key)).boxes);
  const rate=sum.target?Math.round(sum.boxes/sum.target*100):0;

  function groupBy(keyFn,labelFn){
    const m={};
    done.forEach(o=>{const k=keyFn(o)||'—';(m[k]=m[k]||[]).push(o);});
    return Object.entries(m).map(([k,v])=>({key:k,label:labelFn?labelFn(k,v):k,...summarize(v)}))
      .sort((a,b)=>b.boxes-a.boxes);
  }
  const byWorker=groupBy(o=>o.workerName||t('担当者なし'));
  const byItem=groupBy(o=>o.kind==='task'?('🔧 '+(o.taskName||'作業')):o.hinban);

  const card=(k,v,col)=>(
    <div key={k} style={{padding:'12px 14px',background:'#fff',border:'1px solid '+LINE,borderRadius:10}}>
      <div style={{fontSize:11,color:'#6B7480'}}>{k}</div>
      <div style={{fontSize:24,fontWeight:800,color:col||NAVY}}>{v}</div>
    </div>
  );
  const th={padding:'9px 12px',fontSize:12.5,fontWeight:700,color:'#fff',textAlign:'left',whiteSpace:'nowrap'};
  const td={padding:'9px 12px',fontSize:13.5,borderBottom:'1px solid '+LINE,whiteSpace:'nowrap'};
  const tbl=(title,list)=>(
    <div style={{flex:'1 1 360px',minWidth:320}}>
      <div style={{fontSize:13,fontWeight:700,color:BLUE,marginBottom:6}}>{title}</div>
      <div style={{border:'1px solid '+LINE,borderRadius:10,overflowX:'auto',background:'#fff'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{background:NAVY}}>
            <th style={th}>　</th><th style={{...th,width:70}}>{b('件')}</th><th style={{...th,width:90}}>{b('箱')}</th>
            <th style={{...th,width:100}}>{b('先行')}/{b('遅れ')}</th><th style={{...th,width:70}}>⚠</th>
          </tr></thead>
          <tbody>
            {list.map((r,i)=>(
              <tr key={r.key} style={{background:i%2?'#F7F9FC':'#fff'}}>
                <td style={{...td,fontWeight:700}}>{r.label}</td>
                <td style={td}>{r.n}</td>
                <td style={td}>{r.boxes}</td>
                <td style={{...td,fontWeight:800,color:r.diff>=0?'#1B5E20':'#B71C1C'}}>{(r.diff>=0?'+':'−')+Math.abs(Math.round(r.diff))}</td>
                <td style={{...td,color:r.anom?'#B71C1C':'#C7CDD6'}}>{r.anom||'—'}</td>
              </tr>
            ))}
            {list.length===0&&<tr><td colSpan={5} style={{...td,textAlign:'center',color:'#9AA3AF',padding:'24px'}}>{t('データがありません')}</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );

  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column'}}>
      <TopBar title={b('評価')} onBack={onBack} user={user}
        left={<div style={{color:'#fff',fontSize:14,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>🏭 {lang==='id'?proc.id_:proc.ja}</div>}/>
      <div style={{flex:1,overflowY:'auto',padding:'16px 24px'}}>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',marginBottom:14}}>
          <div style={{display:'flex',borderRadius:8,overflow:'hidden',border:'1px solid '+LINE}}>
            {[['day',b('日')],['month',b('月')],['year',b('年')]].map(([k,lb])=>(
              <button key={k} onClick={()=>setMode(k)} style={{minHeight:44,padding:'0 20px',fontSize:14,fontWeight:700,background:mode===k?NAVY:'#fff',color:mode===k?'#fff':'#4A5460',whiteSpace:'nowrap'}}>{lb}</button>
            ))}
          </div>
          <button onClick={()=>setAllProc(a=>!a)}
            style={{minHeight:44,padding:'0 16px',borderRadius:8,border:'1px solid '+(allProc?NAVY:LINE),background:allProc?NAVY:'#fff',color:allProc?'#fff':'#4A5460',fontSize:13.5,fontWeight:700,whiteSpace:'nowrap'}}>
            {allProc?'✓ ':''}{t('全工程')}
          </button>
          <div style={{fontSize:12.5,color:'#6B7480'}}>{from} 〜 {to}</div>
        </div>

        {err&&<div style={{padding:'12px 16px',background:'#FDECEA',color:'#B71C1C',borderRadius:10,fontSize:13,marginBottom:14}}>{err}</div>}
        {rows===null&&!err&&<div style={{padding:'40px',textAlign:'center',color:'#9AA3AF'}}>{t('読込中...')}</div>}

        {rows!==null&&<>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(135px,1fr))',gap:10,marginBottom:16}}>
            {card(b('完了')+' '+b('件'),sum.n)}
            {card(b('完了箱数'),sum.boxes+' / '+sum.target)}
            {card(b('達成率'),rate+'%',rate>=100?'#1B5E20':NAVY)}
            {card(b('標準'),Math.round(sum.std)+t('分'),'#3A4552')}
            {card(b('実働'),Math.round(sum.act)+t('分'),'#3A4552')}
            {card(b('先行')+'/'+b('遅れ'),(sum.diff>=0?'+':'−')+Math.abs(Math.round(sum.diff))+t('分'),sum.diff>=0?'#1B5E20':'#B71C1C')}
            {card(b('異常'),sum.anom,sum.anom?'#B71C1C':'#C7CDD6')}
          </div>

          <div className="panel" style={{marginBottom:16}}>
            <div className="panel-h">📊 {b('先行')}/{b('遅れ')} {b('推移')}（{t('分')}）</div>
            <div style={{padding:14}}><DiffBarChart buckets={buckets} values={values} unit={t('分')}/></div>
          </div>
          <div className="panel" style={{marginBottom:16}}>
            <div className="panel-h">📦 {b('完了箱数')} {b('推移')}</div>
            <div style={{padding:14,display:'flex',alignItems:'flex-end',gap:6,overflowX:'auto',minHeight:140}}>
              {buckets.map((bk,i)=>{
                const mx=Math.max(1,...boxesPer);
                return(
                  <div key={bk.key} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,minWidth:48}}>
                    <div style={{fontSize:11,fontWeight:700,color:NAVY}}>{boxesPer[i]||''}</div>
                    <div style={{width:26,height:Math.round((boxesPer[i]||0)/mx*90),background:NAVY,borderRadius:'4px 4px 0 0',minHeight:boxesPer[i]?2:0}}/>
                    <div style={{fontSize:11,color:'#6B7480'}}>{bk.label}</div>
                  </div>
                );
              })}
            </div>
          </div>
          <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
            {tbl('👤 '+b('担当者別'),byWorker)}
            {tbl('📦 '+b('製品別'),byItem)}
          </div>
        </>}
      </div>
      <FooterBar left={<FBtn onClick={onBack}>‹ {b('計画表')}</FBtn>}/>
    </div>
  );
}

/* ── 評価の調整（管理者） ── */
function AdjustModal({order,onClose}){
  const{t,b}=useLang();
  const[v,setV]=useState(String(order.adjustMin||''));
  const[note,setNote]=useState(order.adjustNote||'');
  const[busy,setBusy]=useState(false);
  const n=Number(v)||0;
  const base=Number(order.diffMin)||0;
  async function save(){
    setBusy(true);
    try{
      await db.collection('workOrders').doc(order.id).update({adjustMin:n,adjustNote:note.trim(),adjustedAt:Date.now()});
      onClose();
    }catch(e){alert('保存に失敗: '+e.message);}
    finally{setBusy(false);}
  }
  return(
    <div onClick={e=>e.target===e.currentTarget&&!busy&&onClose()} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:650,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{background:'#fff',borderRadius:16,width:'100%',maxWidth:520,overflow:'hidden'}}>
        <div style={{background:NAVY,padding:'14px 20px',color:'#fff',fontSize:17,fontWeight:800}}>⚖ {b('評価を調整')}</div>
        <div style={{padding:20}}>
          <div style={{fontSize:13,color:'#5A6472',lineHeight:1.9,marginBottom:12}}>
            {order.kind==='task'?('🔧 '+(order.taskName||'作業')):order.hinban}　/　{order.date}　/　{order.workerName||t('担当者なし')}<br/>
            {(order.anomalies||[]).length>0&&<span style={{color:'#B71C1C'}}>⚠ {(order.anomalies||[]).map(a=>a.comment).join('／')}</span>}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
            <div style={{padding:'10px 12px',background:'#F7F9FC',borderRadius:8}}>
              <div style={{fontSize:11,color:'#6B7480'}}>{b('調整前')}</div>
              <div style={{fontSize:20,fontWeight:800,color:base>=0?'#1B5E20':'#B71C1C'}}>{(base>=0?'+':'−')+Math.abs(Math.round(base))} {t('分')}</div>
            </div>
            <div style={{padding:'10px 12px',background:'#F2F6FD',borderRadius:8}}>
              <div style={{fontSize:11,color:'#6B7480'}}>{b('調整後')}</div>
              <div style={{fontSize:20,fontWeight:800,color:(base+n)>=0?'#1B5E20':'#B71C1C'}}>{((base+n)>=0?'+':'−')+Math.abs(Math.round(base+n))} {t('分')}</div>
            </div>
          </div>
          <div style={{fontSize:12.5,fontWeight:700,color:'#4A5460',marginBottom:6}}>{b('調整時間')}（{t('分')}・遅れを取り消すなら＋）</div>
          <input type="number" value={v} onChange={e=>setV(e.target.value)} placeholder="例: 15"
            style={{fontSize:22,fontWeight:700,textAlign:'center',color:NAVY}}/>
          <div style={{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}}>
            {[5,10,15,30,-5,-10].map(x=>(
              <button key={x} onClick={()=>setV(String((Number(v)||0)+x))} style={{minHeight:38,padding:'0 12px',borderRadius:8,border:'1px solid '+LINE,background:'#fff',color:NAVY,fontSize:13,fontWeight:700}}>{x>0?'+':''}{x}</button>
            ))}
            <button onClick={()=>setV('')} style={{minHeight:38,padding:'0 12px',borderRadius:8,border:'1px solid '+LINE,background:'#fff',color:'#B71C1C',fontSize:13,fontWeight:700}}>クリア</button>
          </div>
          <div style={{fontSize:12.5,fontWeight:700,color:'#4A5460',margin:'14px 0 6px'}}>{b('理由')}</div>
          <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="例: 設備故障で15分停止したため" style={{height:80,resize:'vertical'}}/>
        </div>
        <div style={{padding:'0 20px 20px',display:'flex',gap:10}}>
          <button onClick={onClose} disabled={busy} style={{flex:1,minHeight:48,borderRadius:10,border:'1px solid '+LINE,background:'#fff',fontSize:14,color:'#555'}}>{t('閉じる')}</button>
          <button onClick={save} disabled={busy} style={{flex:1,minHeight:48,borderRadius:10,background:busy?'#C7CDD6':NAVY,color:'#fff',fontSize:16,fontWeight:800}}>{busy?t('保存中...'):t('保存する')}</button>
        </div>
      </div>
    </div>
  );
}

/* ── 作業完了リザルト（1品番終えた時点で作業者本人が確認） ── */
function ResultModal({result,todaySum,onClose}){
  const{t,b}=useLang();
  const r=result;
  const d=r.diffMin;                       /* ＋＝先行（早い） −＝遅れ */
  const ahead=d>0.5, behind=d<-0.5;
  const col=ahead?'#1B5E20':(behind?'#B71C1C':NAVY);
  const bg =ahead?'#E8F5E9':(behind?'#FDECEA':'#F2F6FD');
  const bd =ahead?'#A5D6A7':(behind?'#F5B7B1':'#C3D6F0');
  const row=(k,v,strong)=>(
    <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',padding:'9px 0',borderBottom:'1px solid '+LINE}}>
      <span style={{fontSize:13.5,color:'#6B7480'}}>{k}</span>
      <span style={{fontSize:strong?19:15.5,fontWeight:strong?800:700,color:strong?NAVY:'#2A3340',fontVariantNumeric:'tabular-nums'}}>{v}</span>
    </div>
  );
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.65)',zIndex:700,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{background:'#fff',borderRadius:18,width:'100%',maxWidth:560,overflow:'hidden',boxShadow:'0 20px 60px rgba(0,0,0,.4)'}}>
        <div style={{background:'#2E7D4F',padding:'16px 22px',display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:26}}>✅</span>
          <div>
            <div style={{fontSize:19,fontWeight:800,color:'#fff'}}>{b('作業完了')}</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,.85)'}}>{r.title}</div>
          </div>
        </div>
        {/* 主役：予定差 */}
        <div style={{margin:'18px 22px 0',padding:'20px',background:bg,border:'2px solid '+bd,borderRadius:14,textAlign:'center'}}>
          <div style={{fontSize:14,fontWeight:700,color:'#5A6472'}}>{b('予定より')}</div>
          <div style={{fontSize:56,fontWeight:800,color:col,lineHeight:1.15,fontVariantNumeric:'tabular-nums'}}>
            {(ahead||behind)?(Math.abs(Math.round(d*10)/10)+' '+t('分')):'±0'}
          </div>
          <div style={{fontSize:19,fontWeight:800,color:col}}>
            {ahead?'▲ '+t('早く終わりました'):(behind?'▼ '+t('かかりました'):t('予定どおりです'))}
          </div>
        </div>
        <div style={{padding:'14px 22px 4px'}}>
          {!r.isTask&&row(b('完了箱数'),`${r.doneBoxes} / ${r.targetBoxes} ${t('箱')}`+(r.fraction?`（+${r.fraction}個）`:''),true)}
          {row(b('予定時間'),Math.round(r.stdMin*10)/10+' '+t('分'))}
          {row(b('実働'),Math.round(r.actMin*10)/10+' '+t('分'))}
          {row(b('開始')+' → '+b('終了'),`${fmtHM(new Date(r.startAt))} → ${fmtHM(new Date(r.endAt))}`)}
          {r.pausedMin>0.1&&row(b('休憩')+'・'+t('中断'),Math.round(r.pausedMin*10)/10+' '+t('分'))}
          {r.anomCount>0&&row(b('異常'),r.anomCount+' '+t('件'))}
        </div>
        {todaySum&&todaySum.n>0&&(
          <div style={{margin:'10px 22px 0',padding:'10px 14px',background:'#F7F9FC',borderRadius:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:12.5,color:'#6B7480'}}>{b('今日の累計')}（{todaySum.n} {t('件')}）</span>
            <span style={{fontSize:16,fontWeight:800,color:todaySum.diff>=0?'#1B5E20':'#B71C1C'}}>
              {(todaySum.diff>=0?'+':'−')+Math.abs(Math.round(todaySum.diff))} {t('分')}
            </span>
          </div>
        )}
        <div style={{padding:'16px 22px 22px'}}>
          <button onClick={onClose} style={{width:'100%',minHeight:62,borderRadius:12,background:NAVY,color:'#fff',fontSize:19,fontWeight:800}}>
            {t('次の作業へ')} ▶
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── 履歴（直近7日） ── */
function WorkHistory({proc,logs,user,onBack}){
  const{lang,t,b}=useLang();
  const[all,setAll]=useState(false);
  const[adj,setAdj]=useState(null);
  const list=Object.values(logs||{}).filter(l=>l.status==='done'&&(all||l.procId===proc.id)).sort((a,b)=>(b.endAt||0)-(a.endAt||0));
  const th={padding:'7px 8px',fontSize:12,fontWeight:700,color:'#fff',textAlign:'left',whiteSpace:'nowrap',verticalAlign:'bottom'};
  const td={padding:'8px 8px',fontSize:13.5,borderBottom:'1px solid '+LINE,whiteSpace:'nowrap'};
  const sum=list.reduce((a,l)=>({boxes:a.boxes+(l.doneBoxes||0),diff:a.diff+effDiff(l),anom:a.anom+((l.anomalies||[]).length)}),{boxes:0,diff:0,anom:0});
  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column'}}>
      <TopBar title={b('履歴')+'（直近7日）'} onBack={onBack} user={user}/>
      <div style={{flex:1,overflowY:'auto',padding:'18px 26px'}}>
        <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
          <button onClick={()=>setAll(false)} style={{padding:'8px 16px',borderRadius:18,fontSize:13,fontWeight:700,background:!all?NAVY:'#F2F4F7',color:!all?'#fff':'#4A5460'}}>{lang==='id'?proc.id_:proc.ja}</button>
          <button onClick={()=>setAll(true)} style={{padding:'8px 16px',borderRadius:18,fontSize:13,fontWeight:700,background:all?NAVY:'#F2F4F7',color:all?'#fff':'#4A5460'}}>全工程</button>
          <div style={{marginLeft:'auto',display:'flex',gap:16,fontSize:13,color:'#3A4552'}}>
            <span>{list.length} 件</span><span>{sum.boxes} {t('箱')}</span>
            <span style={{fontWeight:800,color:sum.diff>=0?'#1B5E20':'#B71C1C'}}>{(sum.diff>=0?'+':'−')+Math.abs(Math.round(sum.diff))} {t('分')}</span>
            <span style={{color:'#B71C1C'}}>⚠ {sum.anom}</span>
          </div>
        </div>
        <div style={{border:'1px solid '+LINE,borderRadius:10,overflow:'auto',background:'#fff'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{background:NAVY}}>
              <th style={th}>日付</th><th style={th}><TH k="担当者"/></th>{all&&<th style={th}>工程</th>}<th style={th}><TH k="呼称"/></th>
              <th style={th}>開始 → 終了</th><th style={th}><TH k="完了箱数"/></th><th style={th}><TH k="実働"/></th><th style={th}>停止</th><th style={th}><TH k="先行" k2="遅れ"/></th><th style={th}><TH k="異常"/></th><th style={{...th,width:92,textAlign:'center'}}><TH k="調整"/></th>
            </tr></thead>
            <tbody>
              {list.map((l,i)=>{
                const d=effDiff(l);const hasK=Number(l.kosu)>0||l.kind==='task';const hasAdj=Number(l.adjustMin)||0;
                return(
                  <tr key={l.id} style={{background:i%2?'#F7F9FC':'#fff'}}>
                    <td style={td}>{l.date}</td><td style={{...td,color:l.workerName?'#1A1A1A':'#9AA3AF'}}>{l.workerName||t('担当者なし')}</td>{all&&<td style={td}>{l.procName}</td>}
                    <td style={{...td,fontWeight:700}}>{l.hinban}</td>
                    <td style={td}>{l.startAt?fmtHM(new Date(l.startAt)):''} → {l.endAt?fmtHM(new Date(l.endAt)):''}</td>
                    <td style={td}>{l.doneBoxes||0} / {l.targetBoxes||0}{l.fraction?`（+${l.fraction}個）`:''}</td>
                    <td style={td}>{Math.round(l.actMin||0)} {t('分')}</td>
                    <td style={td}>{Math.round(l.pausedMin||0)} {t('分')}</td>
                    <td style={{...td,fontWeight:800,color:hasK?(d>=0?'#1B5E20':'#B71C1C'):'#9AA3AF'}}>
                      {hasK?((d>=0?'+':'−')+Math.abs(Math.round(d))):'—'}
                      {hasAdj?<div style={{fontSize:10.5,fontWeight:600,color:'#6D3FBF'}}>（調整 {hasAdj>0?'+':''}{hasAdj}）</div>:null}
                    </td>
                    <td style={{...td,color:'#B71C1C',whiteSpace:'normal',maxWidth:240,fontSize:12}}>{(l.anomalies||[]).map(a=>a.comment).join('／')||''}</td>
                    <td style={{...td,textAlign:'center'}}>
                      <button onClick={()=>setAdj(l)} style={{minHeight:36,padding:'0 14px',borderRadius:7,border:'1px solid '+(hasAdj?'#6D3FBF':LINE),background:hasAdj?'#F6F2FD':'#fff',color:hasAdj?'#6D3FBF':NAVY,fontSize:12.5,fontWeight:700}}>⚖ {t('調整')}</button>
                    </td>
                  </tr>
                );
              })}
              {list.length===0&&<tr><td colSpan={all?11:10} style={{...td,textAlign:'center',color:'#9AA3AF',padding:'36px'}}>履歴がありません</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      <FooterBar left={<FBtn onClick={onBack}>‹ {b('計画表')}</FBtn>}/>
      {adj&&<AdjustModal order={adj} onClose={()=>setAdj(null)}/>}
    </div>
  );
}

/* ══════════ アプリ本体 ══════════ */
function App(){
  const[lang,setLang]=useState('ja');
  const[user,setUser]=useState(undefined);
  const[ready,setReady]=useState(false);
  const[err,setErr]=useState(null);
  const[master,setMaster]=useState({});
  const[workers,setWorkers]=useState({});
  const[orders,setOrders]=useState({});
  const[procSettings,setProcSettings]=useState({});
  const[view,setView]=useState({name:'proc'});
  const[scanHome,setScanHome]=useState(false);

  useEffect(()=>auth.onAuthStateChanged(u=>{setUser(u);setReady(true);}),[]);
  useEffect(()=>{
    if(!user)return;
    return db.collection('outlineMaster').onSnapshot(
      s=>{const o={};s.forEach(x=>o[x.id]=x.data());setMaster(o);setErr(null);},
      e=>setErr(e.message));
  },[user]);
  useEffect(()=>{
    if(!user)return;
    return db.collection('procSettings').onSnapshot(
      s=>{const o={};s.forEach(x=>o[x.id]=x.data());setProcSettings(o);},
      e=>console.warn('procSettings:',e.message));
  },[user]);
  useEffect(()=>{
    if(!user)return;
    return db.collection('workers').onSnapshot(
      s=>{const o={};s.forEach(x=>o[x.id]={id:x.id,...x.data()});setWorkers(o);},
      e=>console.warn('workers:',e.message));
  },[user]);
  /* 作業指示：直近7日以降（未来日の計画も含む） ＋ 進行中（日付をまたいだ未完了分） */
  useEffect(()=>{
    if(!user)return;
    const merge=(s,tag)=>setOrders(prev=>{
      const o={...prev};
      Object.keys(o).forEach(k=>{if(o[k].__tag===tag)delete o[k];});
      s.forEach(x=>{o[x.id]={id:x.id,...x.data(),__tag:tag};});
      return o;
    });
    const u1=db.collection('workOrders').where('date','>=',daysAgoKey(7)).onSnapshot(s=>merge(s,'recent'),e=>console.warn('orders:',e.message));
    const u2=db.collection('workOrders').where('status','in',['running','paused']).onSnapshot(s=>merge(s,'live'),e=>console.warn('live:',e.message));
    return ()=>{u1();u2();};
  },[user]);

  const ctx={lang,setLang,...makeT(lang)};
  if(!ready)return <LoadingScreen/>;
  if(!user)return <LangCtx.Provider value={ctx}><LoginScreen/></LangCtx.Provider>;

  /* QRガイド読取 → 品番解決 */
  function resolveScan(text){
    const v=(text||'').trim();
    const keys=Object.keys(master);
    let hit=keys.find(h=>h===v)
      ||keys.find(h=>{const q=master[h]?.qrText;return q&&(q===v||q.includes(v)||v.includes(q));})
      ||keys.find(h=>v.includes(h));
    setScanHome(false);
    if(hit)setView(x=>({name:'info',proc:x.proc,hinban:hit}));
    else alert('該当する品番が見つかりません: '+v.slice(0,30));
  }

  let screen;
  if(err)screen=<ErrorScreen error={err} onRetry={()=>window.location.reload()}/>;
  else if(view.name==='proc')screen=<ProcessSelect user={user} onPick={p=>setView({name:'work',proc:p})} onLogout={()=>auth.signOut()}/>;
  else if(view.name==='search')screen=<SearchScreen master={master} proc={view.proc} user={user}
    onPick={h=>setView({name:'info',proc:view.proc,hinban:h})}
    onBack={()=>setView({name:'work',proc:view.proc})} onHome={()=>setView({name:'work',proc:view.proc})}/>;
  else if(view.name==='info')screen=<InfoViewer proc={view.proc} hinban={view.hinban} master={master} user={user}
    onBack={()=>setView(view.backTo||{name:'search',proc:view.proc})}
    onChangeProc={p=>setView({...view,proc:p})}/>;
  else if(view.name==='master')screen=<MasterAdmin master={master} workers={workers} user={user} onBack={()=>setView({name:'work',proc:view.proc})}/>;
  else if(view.name==='work')screen=<WorkPlanScreen proc={view.proc} master={master} workers={workers} orders={orders} settings={procSettings[view.proc.id]} user={user}
    onBack={()=>setView({name:'proc'})}
    onQR={()=>setScanHome(true)}
    onSearch={()=>setView({name:'search',proc:view.proc})}
    onMaster={()=>setView({name:'master',proc:view.proc})}
    onLogout={()=>auth.signOut()}
    onOpenSheet={async(o,w)=>{
      if(o.kind==='task'){
        try{await db.collection('workOrders').doc(o.id).update({status:'running',startAt:Date.now(),
          workerId:w?w.id:(o.assignedWorkerId||null),workerName:w?w.name:(o.assignedWorkerName||'')});
          setView({name:'workrun',proc:view.proc,logId:o.id});
        }catch(e){alert('開始に失敗: '+e.message);}
      }else setView({name:'worksheet',proc:view.proc,orderId:o.id,worker:w});
    }}
    onResume={o=>setView({name:'workrun',proc:view.proc,logId:o.id})}
    onHistory={()=>setView({name:'workhist',proc:view.proc})}
    onPlanner={()=>setView({name:'planner',proc:view.proc})}
    onAnalytics={()=>setView({name:'analytics',proc:view.proc})}/>;
  else if(view.name==='planner')screen=<SchedulePlanner proc={view.proc} master={master} workers={workers} orders={orders} settings={procSettings[view.proc.id]} user={user}
    onBack={()=>setView({name:'work',proc:view.proc})}/>;
  else if(view.name==='worksheet'){
    const o=orders[view.orderId];
    screen=o?<WorkSheetScreen proc={view.proc} order={o} worker={view.worker} master={master} user={user}
      onBack={()=>setView({name:'work',proc:view.proc})}
      onStart={id=>setView({name:'workrun',proc:view.proc,logId:id})}
      onInfo={h=>setView({name:'info',proc:view.proc,hinban:h,backTo:view})}/>:<LoadingScreen/>;
  }
  else if(view.name==='workrun'){
    const log=orders[view.logId];
    screen=log?<WorkRunScreen proc={view.proc} log={log} master={master} orders={orders} user={user}
      onExit={()=>setView({name:'work',proc:view.proc})}
      onInfo={h=>setView({name:'info',proc:view.proc,hinban:h,backTo:view})}
      onDone={()=>setView({name:'work',proc:view.proc})}/>:<LoadingScreen/>;
  }
  else if(view.name==='workhist')screen=<WorkHistory proc={view.proc} logs={orders} user={user} onBack={()=>setView({name:'work',proc:view.proc})}/>;
  else if(view.name==='analytics')screen=<AnalyticsScreen proc={view.proc} master={master} workers={workers} user={user} onBack={()=>setView({name:'work',proc:view.proc})}/>;

  return(
    <LangCtx.Provider value={ctx}>
      {screen}
      {QR_ENABLED&&scanHome&&<QRScannerModal expectedValue="" label="ガイドQRを読み取ってください" onSuccess={resolveScan} onClose={()=>setScanHome(false)}/>}
    </LangCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
