const LangCtx=createContext({lang:'ja'});
function useLang(){return useContext(LangCtx);}
/* t: UIラベル翻訳 / b: 併記（日本語 / Indonesian） */
function makeT(lang){
  const t=s=>lang==='id'?(DICT[s]||s):s;
  const b=s=>{const i=DICT[s];return (lang==='id'&&i)?i:(i?s+' / '+i:s);};
  return{t,b};
}
/* データ側の言語出し分け（_id フィールドがあれば優先） */
function dv(obj,key,lang){
  if(!obj)return '';
  if(lang==='id'&&obj[key+'_id'])return obj[key+'_id'];
  return obj[key]||'';
}

function QRDisplay({value,size=120}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!value)return;
    const gen=()=>{if(!window.QRious){setTimeout(gen,300);return;}
      try{new window.QRious({element:ref.current,value,size,padding:4,level:'M'});}catch(e){}};
    gen();
  },[value,size]);
  return <canvas ref={ref} style={{display:'block',borderRadius:4,width:size+'px',height:size+'px'}}/>;
}

/* QR照合モーダル（ハンディスキャナー方式） */
function QRScannerModal({expectedValue,label,onSuccess,onClose}){
  const{t,b}=useLang();
  const inputRef=useRef(null);
  const[scanned,setScanned]=useState('');
  const[fb,setFb]=useState(null);
  const[done,setDone]=useState(false);
  useEffect(()=>{setTimeout(()=>inputRef.current?.focus(),150);},[]);
  function check(text){
    const v=(text||'').trim();
    if(!v)return;
    const ok=expectedValue?(v.includes(expectedValue)||expectedValue.includes(v)):true;
    if(ok){setFb({ok:true,text:t('照合成功')+' ✓'});setDone(true);setTimeout(()=>onSuccess(v),600);}
    else{setFb({ok:false,text:t('不一致')+': "'+v.slice(0,24)+'"'});setTimeout(()=>{setFb(null);setScanned('');inputRef.current?.focus();},2000);}
  }
  return(
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{background:'#fff',borderRadius:16,width:'100%',maxWidth:440,overflow:'hidden'}}>
        <div style={{background:NAVY,padding:'16px 20px'}}>
          <div style={{fontSize:17,fontWeight:700,color:'#fff'}}>{b('QR照合')}</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.75)',marginTop:2}}>{label}</div>
        </div>
        <div style={{padding:'26px 24px 18px',textAlign:'center'}}>
          <div style={{fontSize:52,lineHeight:1,marginBottom:14,color:NAVY}}>▦</div>
          <div style={{fontSize:15,fontWeight:600,marginBottom:16}}>{t('ハンディスキャナーでスキャンしてください')}</div>
          <input ref={inputRef} value={scanned} onChange={e=>setScanned(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&check(scanned)} inputMode="none" autoFocus
            style={{position:'fixed',top:-9999,left:-9999,opacity:0,width:1,height:1}}/>
          <div style={{padding:'14px 16px',borderRadius:10,border:'2px solid '+(fb?(fb.ok?'#2E7D32':'#C62828'):'#CBD3DC'),background:scanned?'#F2F7FF':'#F7F8FA',display:'flex',alignItems:'center',gap:10,minHeight:52}}>
            <span style={{fontSize:20}}>{done?'✅':scanned?'⌛':'📷'}</span>
            <span style={{flex:1,fontFamily:'monospace',fontSize:15,color:scanned?'#111':'#AAB',letterSpacing:1,wordBreak:'break-all',textAlign:'left'}}>{scanned||t('スキャン待機中...')}</span>
          </div>
          {scanned&&!done&&<button onClick={()=>check(scanned)} style={{width:'100%',minHeight:46,borderRadius:10,background:NAVY,color:'#fff',fontSize:15,fontWeight:700,marginTop:10}}>{b('QR照合')}</button>}
          {fb&&<div style={{marginTop:12,padding:12,borderRadius:10,background:fb.ok?'#E8F5E9':'#FDECEA',color:fb.ok?'#1B5E20':'#B71C1C',fontSize:16,fontWeight:700}}>{fb.text}</div>}
        </div>
        <div style={{padding:'0 24px 22px'}}>
          <button onClick={onClose} style={{width:'100%',minHeight:46,borderRadius:10,border:'1px solid '+LINE,background:'#fff',fontSize:14,color:'#555'}}>{t('閉じる')}</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════ ログイン ══════════ */
function LoginScreen(){
  const[email,setEmail]=useState('');
  const[password,setPassword]=useState('');
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState('');
  async function submit(e){
    e.preventDefault();
    if(!email||!password)return;
    setLoading(true);setError('');
    try{await auth.signInWithEmailAndPassword(email.trim(),password);}
    catch(err){
      const m={'auth/user-not-found':'メールアドレスが登録されていません','auth/wrong-password':'パスワードが間違っています',
        'auth/invalid-email':'メールアドレスの形式が正しくありません','auth/invalid-credential':'メールアドレスまたはパスワードが間違っています',
        'auth/too-many-requests':'試行回数が多すぎます。しばらく待ってから再試行してください'};
      setError(m[err.code]||'ログインに失敗しました');
    }finally{setLoading(false);}
  }
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,'+NAVY_D+' 0%,'+NAVY+' 100%)',padding:24}}>
      <div style={{background:'#fff',borderRadius:16,padding:'40px 34px',width:'100%',maxWidth:410,boxShadow:'0 20px 60px rgba(0,0,0,.35)'}}>
        <div style={{textAlign:'center',marginBottom:30}}>
          <div style={{fontSize:38,marginBottom:8}}>🏭</div>
          <div style={{fontSize:22,fontWeight:700,color:NAVY,letterSpacing:1}}>長坂コーティング</div>
          <div style={{fontSize:13,color:'#8A93A0',marginTop:6}}>アウトライン工程システム</div>
        </div>
        <form onSubmit={submit}>
          <div style={{marginBottom:16}}>
            <label style={{display:'block',fontSize:13,fontWeight:600,color:'#444',marginBottom:6}}>メールアドレス</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="example@email.com" autoComplete="email"/>
          </div>
          <div style={{marginBottom:22}}>
            <label style={{display:'block',fontSize:13,fontWeight:600,color:'#444',marginBottom:6}}>パスワード</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="パスワードを入力" autoComplete="current-password"/>
          </div>
          {error&&<div style={{padding:'10px 14px',borderRadius:8,background:'#FDECEA',color:'#B71C1C',fontSize:13,marginBottom:16,fontWeight:600}}>{error}</div>}
          <button type="submit" disabled={loading||!email||!password}
            style={{width:'100%',minHeight:50,borderRadius:10,background:(loading||!email||!password)?'#AEB6C2':NAVY,color:'#fff',fontSize:16,fontWeight:700}}>
            {loading?'ログイン中...':'ログイン'}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ══════════ 品番検索 ══════════ */
function SearchScreen({master,user,onPick,onBack,onHome}){
  const{lang,t,b}=useLang();
  const[q,setQ]=useState('');
  const[page,setPage]=useState(1);
  const PER=10;
  const all=Object.keys(master).sort();
  const kw=q.trim().toLowerCase();
  const hits=kw?all.filter(h=>h.toLowerCase().includes(kw)||(master[h]?.name||'').toLowerCase().includes(kw)):all;
  const pages=Math.max(1,Math.ceil(hits.length/PER));
  const cur=Math.min(page,pages);
  const rows=hits.slice((cur-1)*PER,cur*PER);
  const th={padding:'12px 14px',fontSize:14,fontWeight:700,color:'#fff',textAlign:'left',whiteSpace:'nowrap'};
  const td={padding:'12px 14px',fontSize:15,color:'#1A1A1A',borderBottom:'1px solid '+LINE};
  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column'}}>
      <TopBar title={b('品番検索')} onBack={onBack} user={user}/>
      <div style={{flex:1,overflowY:'auto',padding:'20px 28px'}}>
        <div style={{fontSize:13,fontWeight:600,color:'#5A6472',marginBottom:8}}>{b('キーワード')}</div>
        <div style={{display:'flex',gap:14,marginBottom:18,maxWidth:1100}}>
          <div style={{flex:1,display:'flex'}}>
            <input value={q} onChange={e=>{setQ(e.target.value);setPage(1);}} placeholder={b('品番を入力してください')}
              style={{borderRadius:'8px 0 0 8px',borderRight:'none'}}/>
            <div style={{background:NAVY,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',width:58,borderRadius:'0 8px 8px 0',fontSize:20}}>🔍</div>
          </div>
        </div>
        <div style={{fontSize:15,fontWeight:600,color:'#3A4552',marginBottom:10}}>
          {lang==='id'?`Hasil pencarian: ${hits.length} item`:`検索結果：${hits.length}件 / Hasil pencarian: ${hits.length} item`}
        </div>
        <div style={{border:'1px solid '+LINE,borderRadius:10,overflow:'hidden',background:'#fff'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{background:NAVY}}>
              <th style={{...th,width:70}}>No.</th>
              <th style={th}>{b('品番')}</th>
              <th style={th}>{b('品名')}</th>
              <th style={{...th,width:190}}>{b('更新日')}</th>
              <th style={{...th,width:150,textAlign:'center'}}>{b('選択')}</th>
            </tr></thead>
            <tbody>
              {rows.map((h,i)=>{
                const m=master[h]||{};
                return(
                  <tr key={h} style={{background:i%2?'#F7F9FC':'#fff'}}>
                    <td style={td}>{(cur-1)*PER+i+1}</td>
                    <td style={{...td,fontWeight:700}}>{h}</td>
                    <td style={td}>{dv(m,'name',lang)||'—'}</td>
                    <td style={td}>{m.updatedAt||'—'}</td>
                    <td style={{...td,textAlign:'center'}}>
                      <button onClick={()=>onPick(h)} style={{minHeight:40,padding:'0 22px',borderRadius:6,background:NAVY,color:'#fff',fontSize:14,fontWeight:700}}>{b('選択')}</button>
                    </td>
                  </tr>
                );
              })}
              {rows.length===0&&<tr><td colSpan={5} style={{...td,textAlign:'center',color:'#9AA3AF',padding:'40px'}}>{t('品番が未登録です')}</td></tr>}
            </tbody>
          </table>
        </div>
        {pages>1&&(
          <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:10,marginTop:18}}>
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={cur===1}
              style={{minHeight:42,padding:'0 18px',borderRadius:8,border:'1px solid '+LINE,background:'#fff',color:cur===1?'#B0B7C0':NAVY,fontSize:14,fontWeight:600}}>‹ {b('前へ')}</button>
            {Array.from({length:pages},(_,i)=>i+1).map(n=>(
              <button key={n} onClick={()=>setPage(n)}
                style={{minWidth:44,minHeight:42,borderRadius:8,border:'1px solid '+(n===cur?NAVY:LINE),background:n===cur?NAVY:'#fff',color:n===cur?'#fff':NAVY,fontSize:15,fontWeight:700}}>{n}</button>
            ))}
            <button onClick={()=>setPage(p=>Math.min(pages,p+1))} disabled={cur===pages}
              style={{minHeight:42,padding:'0 18px',borderRadius:8,border:'1px solid '+LINE,background:'#fff',color:cur===pages?'#B0B7C0':NAVY,fontSize:14,fontWeight:600}}>{b('次へ')} ›</button>
          </div>
        )}
      </div>
      <FooterBar left={<FBtn onClick={onHome}>🏠 {b('ホーム')}</FBtn>} right={<FBtn onClick={()=>{setQ('');setPage(1);}}>🗑 {b('クリア')}</FBtn>}/>
    </div>
  );
}

                  </div>
                ))}
              </div>
              <button onClick={()=>m.videoUrl?setVideo(true):alert(t('動画が未登録です'))}

/* ── 各情報ページの中身 ── */
function PageBody({pageKey,m,hinban,onScan}){

  const P=({children})=><div className="panel" style={{marginBottom:14}}>{children}</div>;
  const H=({children})=><div className="panel-h">{children}</div>;
  const Body=({children,pad})=><div style={{padding:pad===false?0:16}}>{children}</div>;
  const none=<div style={{color:'#9AA3AF',fontSize:14,padding:'8px 0'}}>{t('未登録')}</div>;
  const txt=s=>s?<div style={{fontSize:14.5,lineHeight:1.85,whiteSpace:'pre-wrap',color:'#2A3340'}}>{s}</div>:none;
  const L=(o,k)=>dv(o,k,lang);

  if(pageKey==='product'){
    return(<>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))',gap:14}}>
        <P><H>{b('全体写真')}</H><Body><TapPhoto src={m.productImg} style={{width:'100%',maxHeight:420,objectFit:'contain',borderRadius:8,display:'block',margin:'0 auto'}} ratio={280}/></Body></P>
        <P><H>{b('品番')} / {b('品名')}</H><Body>
          <div style={{fontSize:34,fontWeight:800,color:NAVY,marginBottom:6}}>{hinban}</div>
          <div style={{fontSize:18,color:'#3A4552',marginBottom:14}}>{L(m,'name')||'—'}</div>
          {m.qrText&&<div style={{display:'flex',alignItems:'center',gap:16}}><QRDisplay value={m.qrText} size={120}/><div style={{fontSize:12,color:'#6B7480',wordBreak:'break-all'}}>{m.qrText}</div></div>}
        </Body></P>
      </div>
      <WarnBox items={(m.productNotes||[])}/>
    </>);
  }

  if(pageKey==='shape'){
    const pts=m.shape?.points||[], sims=m.shape?.similars||[];
    return(<>
      <div style={{fontSize:14,color:'#5A6472',marginBottom:12}}>この品番を、類似品と見分けるための形状の特徴です。作業前に必ず確認してください。</div>
      <div style={{display:'grid',gridTemplateColumns:'minmax(320px,1fr) minmax(340px,1.3fr)',gap:14,alignItems:'start'}}>
        <P><H>{hinban}（{b('本品の特徴')}）</H><Body>
          <div style={{display:'flex',gap:14,flexWrap:'wrap'}}>
            <TapPhoto src={m.shape?.img} style={{width:'100%',maxWidth:300,maxHeight:260,objectFit:'contain',borderRadius:8}} ratio={220}/>

                <div key={i} style={{display:'flex',gap:10}}>
                  <NumBadge n={i+1} size={22} bg="#C0392B"/>
                  <span style={{fontSize:14,lineHeight:1.7,color:'#2A3340'}}>{L(p,'text')}</span>
                </div>
              )):none}
            </div>
          </div>
        </Body></P>
        <P><H>{b('類似品との違い')}</H><Body>
          <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.max(1,Math.min(3,sims.length||1))},1fr)`,gap:12}}>

        {st.length?(

/* ══════════ マスター管理 ══════════ */
function MasterAdmin({master,user,onBack}){
  const{t,b}=useLang();
  const[sel,setSel]=useState(null);
  const[newH,setNewH]=useState('');
  const[q,setQ]=useState('');
  const list=Object.keys(master).sort().filter(h=>!q.trim()||h.toLowerCase().includes(q.trim().toLowerCase()));

  async function add(){
    const h=newH.trim();if(!h)return;
    if(master[h]){alert('すでに登録されています');return;}
    try{await db.collection('outlineMaster').doc(h).set({createdAt:new Date().toISOString().slice(0,10)},{merge:true});setNewH('');setSel(h);}
    catch(e){alert('追加に失敗: '+e.message);}
  }
  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column'}}>
      <TopBar title={b('マスター管理')} onBack={onBack} user={user}/>
      <div style={{flex:1,overflowY:'auto',padding:'20px 28px'}}>
        <div style={{display:'flex',gap:12,marginBottom:16,maxWidth:900}}>
          <input value={newH} onChange={e=>setNewH(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="新しい品番を追加..."/>
          <button onClick={add} disabled={!newH.trim()} style={{minHeight:46,padding:'0 24px',borderRadius:8,background:newH.trim()?NAVY:'#C7CDD6',color:'#fff',fontSize:15,fontWeight:700,whiteSpace:'nowrap'}}>{t('追加')}</button>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="品番で絞り込み..." style={{maxWidth:260}}/>
        </div>
        {list.length===0&&<div style={{padding:'40px',textAlign:'center',color:'#9AA3AF',fontSize:14}}>品番が登録されていません。</div>}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:10}}>
          {list.map(h=>{
            const d=master[h]||{};
            const filled=['productImg','shape','teekin','hanger','steps','cautions','tools','packing','boxes','idMark','kanbans','locNo','qrText']
              .filter(k=>{const v=d[k];return Array.isArray(v)?v.length:(v&&typeof v==='object'?Object.keys(v).length:!!v);}).length;
            return(
              <button key={h} onClick={()=>setSel(h)} style={{padding:'12px 14px',textAlign:'left',background:'#fff',border:'1px solid '+LINE,borderRadius:10}}>
                <div style={{fontSize:15,fontWeight:700,color:'#111',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{h}</div>
                <div style={{fontSize:12,color:'#6B7480',marginTop:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.name||'（品名未設定）'}</div>
                <div style={{fontSize:11,fontWeight:700,color:filled?'#2E7D4F':'#C7CDD6',marginTop:5}}>{filled?`${filled}/13 項目`:'未登録'}</div>
              </button>
            );
          })}
        </div>
      </div>
      {sel&&<MasterEditor hinban={sel} data={master[sel]||{}} onClose={()=>setSel(null)}/>}
    </div>
  );
}

/* ── マスター編集（ポップアップ） ── */
function MasterEditor({hinban,data,onClose}){
  const[d,setD]=useState(data);
  const[tab,setTab]=useState('basic');
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);
  const[busy,setBusy]=useState(null);
  useEffect(()=>{setD(data);},[hinban]);

  const ref=db.collection('outlineMaster').doc(hinban);
  function upd(patch){setD(p=>({...p,...patch}));}
  async function save(){
    setSaving(true);
    try{
      await ref.set({...d,updatedAt:new Date().toISOString().slice(0,10)},{merge:true});
      setSaved(true);setTimeout(()=>setSaved(false),2500);
    }catch(e){alert('保存に失敗: '+e.message);}
    finally{setSaving(false);}
  }
  async function del(){
    if(!window.confirm(`品番「${hinban}」を削除しますか？`))return;
    try{await ref.delete();onClose();}catch(e){alert('削除に失敗: '+e.message);}
  }
  /* 画像アップロード：path は任意の識別子 */
  async function upImg(path,file,apply){
    if(!file)return;
    if(file.size>4*1024*1024){alert('4MB以下の画像を選択してください');return;}
    setBusy(path);
    try{
      const r=stor.ref(`outline-images/${hinban}/${path}`);
      await r.put(file);
      const url=await r.getDownloadURL();
      apply(url);
    }catch(e){alert('アップロード失敗: '+e.message);}
    finally{setBusy(null);}
  }

  const TABS=[
    ['basic','基本情報'],['shape','形状確認'],['teekin','テーキン'],['hanger','ハンガー'],
    ['steps','作業の流れ'],['caution','注意ポイント'],['tools','必要道具'],['packing','収容数・荷姿'],
    ['boxes','納入箱'],['idmark','識別マーク'],['kanban','かんばん'],
  ];
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:600,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{background:'#fff',borderRadius:14,width:'100%',maxWidth:1000,height:'calc(100vh - 40px)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{background:NAVY,padding:'14px 20px',display:'flex',alignItems:'center',gap:14}}>
          <div style={{fontSize:20,fontWeight:700,color:'#fff',flex:1}}>{hinban}</div>
          <button onClick={del} style={{padding:'7px 16px',borderRadius:7,background:'rgba(255,255,255,.15)',color:'#FFD9D9',fontSize:13,fontWeight:700}}>削除</button>
          <button onClick={onClose} style={{width:36,height:36,borderRadius:'50%',background:'rgba(255,255,255,.18)',color:'#fff',fontSize:20}}>×</button>
        </div>
        <div style={{display:'flex',gap:5,padding:'10px 16px',borderBottom:'1px solid '+LINE,overflowX:'auto',flexShrink:0}}>
          {TABS.map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)}
              style={{padding:'7px 13px',borderRadius:18,whiteSpace:'nowrap',fontSize:13,fontWeight:tab===k?700:600,background:tab===k?NAVY:'#F2F4F7',color:tab===k?'#fff':'#4A5460'}}>{l}</button>
          ))}
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'18px 20px'}}>
          <EditorBody tab={tab} d={d} upd={upd} upImg={upImg} busy={busy} hinban={hinban}/>
        </div>
        <div style={{padding:'12px 20px',borderTop:'1px solid '+LINE,display:'flex',gap:12,alignItems:'center',background:'#F7F8FA'}}>
          <button onClick={save} disabled={saving} style={{flex:1,minHeight:48,borderRadius:10,background:saving?'#AEB6C2':NAVY,color:'#fff',fontSize:16,fontWeight:700}}>{saving?'保存中...':'保存する'}</button>
          {saved&&<span style={{color:'#2E7D4F',fontWeight:700,fontSize:14,whiteSpace:'nowrap'}}>✓ 保存しました</span>}
        </div>
      </div>
    </div>
  );
}

function ImgSlot({url,label,busy,onPick,onClear,h}){
  const r=useRef(null);

        </div>
      ):(
        <div onClick={()=>!busy&&r.current?.click()} style={{width:150,height:h||110,border:'2px dashed #C7CDD6',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',background:'#FAFBFC',cursor:'pointer',fontSize:12,color:'#9AA3AF'}}>
          {busy?'アップ中…':'＋ 画像'}
        </div>
      )}
      <input type="file" accept="image/*" ref={r} style={{display:'none'}} onChange={e=>{onPick(e.target.files[0]);e.target.value='';}}/>
    </div>
  );
}
/* 可変リスト編集 */
function RepList({items,onChange,render,addLabel,blank,max}){
  const arr=items||[];
  const set=(i,v)=>{const n=[...arr];n[i]=v;onChange(n);};
  const rm=i=>onChange(arr.filter((_,j)=>j!==i));
  return(
    <div>
      {arr.map((it,i)=>(
        <div key={i} style={{border:'1px solid '+LINE,borderRadius:10,padding:12,marginBottom:10,background:'#FAFBFC'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
            <NumBadge n={i+1} size={22}/>
            <div style={{flex:1}}/>
            <button onClick={()=>rm(i)} style={{padding:'4px 12px',borderRadius:6,background:'#FDECEA',color:'#B71C1C',fontSize:12,fontWeight:700}}>削除</button>
          </div>
          {render(it,v=>set(i,v),i)}
        </div>
      ))}
      {(!max||arr.length<max)&&(
        <button onClick={()=>onChange([...arr,blank?JSON.parse(JSON.stringify(blank)):{}])}
          style={{width:'100%',minHeight:44,borderRadius:8,border:'2px dashed #C7CDD6',background:'#fff',color:NAVY,fontSize:14,fontWeight:700}}>＋ {addLabel||'追加'}</button>
      )}
    </div>
  );
}
/* 1行1項目のテキストエリア ⇄ 配列 */
function LinesArea({value,onChange,height,ph}){
  return <textarea value={(value||[]).join('\n')} onChange={e=>onChange(e.target.value.split('\n').map(s=>s.trim()).filter(Boolean))}
    style={{width:'100%',height:height||80,resize:'vertical'}} placeholder={ph||'1行に1項目'}/>;
}

function EditorBody({tab,d,upd,upImg,busy,hinban}){
  const S=(k,v)=>upd({[k]:v});
  const sub=(k,patch)=>upd({[k]:{...(d[k]||{}),...patch}});

  if(tab==='basic')return(<>
    <Row>
      <div><FLbl>品名（日本語）</FLbl><input value={d.name||''} onChange={e=>S('name',e.target.value)} placeholder="例: ブラケット ASSY"/></div>
      <div><FLbl>品名（インドネシア語）</FLbl><input value={d.name_id||''} onChange={e=>S('name_id',e.target.value)} placeholder="Nama produk"/></div>
    </Row>
    <FLbl>製品写真</FLbl>
    <ImgSlot url={d.productImg} busy={busy==='productImg'} h={150}
      onPick={f=>upImg('productImg',f,u=>S('productImg',u))} onClear={()=>S('productImg','')}/>
    <Row>
      <div><FLbl>QR照合文字列（製品）</FLbl><input value={d.qrText||''} onChange={e=>S('qrText',e.target.value)} placeholder="未設定なら品番で照合"/></div>
      <div><FLbl>かんばんQR照合文字列</FLbl><input value={d.kanbanQr||''} onChange={e=>S('kanbanQr',e.target.value)}/></div>
    </Row>

      <div><FLbl>端数品置き場所（ロケ番号）</FLbl><input value={d.locNo||''} onChange={e=>S('locNo',e.target.value)} placeholder="例: A-12"/></div>

          style={{width:'100%',height:90,resize:'vertical'}}/>

      <Row>

/* ══════════ アプリ本体 ══════════ */
function App(){
  const[lang,setLang]=useState('ja');
  const[user,setUser]=useState(undefined);
  const[ready,setReady]=useState(false);
  const[err,setErr]=useState(null);
  const[master,setMaster]=useState({});
  const[view,setView]=useState({name:'proc'});
  const[scanHome,setScanHome]=useState(false);

  useEffect(()=>auth.onAuthStateChanged(u=>{setUser(u);setReady(true);}),[]);
  useEffect(()=>{
    if(!user)return;
    return db.collection('outlineMaster').onSnapshot(
      s=>{const o={};s.forEach(x=>o[x.id]=x.data());setMaster(o);setErr(null);},
      e=>setErr(e.message));
  },[user]);

  const ctx={lang,setLang,...makeT(lang)};
  if(!ready)return <LoadingScreen/>;
  if(!user)return <LangCtx.Provider value={ctx}><LoginScreen/></LangCtx.Provider>;

  /* QRガイド読取 → 品番解決 */
  function resolveScan(text){
    const v=(text||'').trim();
    const keys=Object.keys(master);
    let hit=keys.find(h=>h===v)
      ||keys.find(h=>{const q=master[h]?.qrText;return q&&(q===v||q.includes(v)||v.includes(q));})
      ||keys.find(h=>v.includes(h));
    setScanHome(false);
    if(hit)setView(x=>({name:'info',proc:x.proc,hinban:hit}));
    else alert('該当する品番が見つかりません: '+v.slice(0,30));
  }

  let screen;
  if(err)screen=<ErrorScreen error={err} onRetry={()=>window.location.reload()}/>;
  else if(view.name==='proc')screen=<ProcessSelect user={user} onPick={p=>setView({name:'start',proc:p})} onLogout={()=>auth.signOut()}/>;
  else if(view.name==='start')screen=<StartScreen proc={view.proc} user={user}
    onQR={()=>setScanHome(true)}
    onSearch={()=>setView({name:'search',proc:view.proc})}
    onWork={()=>alert('作業指示は Phase 2 で実装予定です。')}
    onMaster={()=>setView({name:'master',proc:view.proc})}
    onBack={()=>setView({name:'proc'})} onLogout={()=>auth.signOut()}/>;
  else if(view.name==='search')screen=<SearchScreen master={master} user={user}
    onPick={h=>setView({name:'info',proc:view.proc,hinban:h})}
    onBack={()=>setView({name:'start',proc:view.proc})} onHome={()=>setView({name:'start',proc:view.proc})}/>;
  else if(view.name==='info')screen=<InfoViewer proc={view.proc} hinban={view.hinban} master={master} user={user}
    onBack={()=>setView({name:'search',proc:view.proc})}
    onChangeProc={p=>setView({name:'info',proc:p,hinban:view.hinban})}/>;
  else if(view.name==='master')screen=<MasterAdmin master={master} user={user} onBack={()=>setView({name:'start',proc:view.proc})}/>;

  return(
    <LangCtx.Provider value={ctx}>
      {screen}
      {scanHome&&<QRScannerModal expectedValue="" label="ガイドQRを読み取ってください" onSuccess={resolveScan} onClose={()=>setScanHome(false)}/>}
    </LangCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
