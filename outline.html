const LangCtx=createContext({lang:'ja'});
function useLang(){return useContext(LangCtx);}
/* t: UIラベル翻訳 / b: 併記（日本語 / Indonesian） */
function makeT(lang){
  const t=s=>lang==='id'?(DICT[s]||s):s;
  const b=s=>{const i=DICT[s];return (lang==='id'&&i)?i:(i?s+' / '+i:s);};
  return{t,b};
}
/* データ側の言語出し分け（_id フィールドがあれば優先） */
function dv(obj,key,lang){
  if(!obj)return '';
  if(lang==='id'&&obj[key+'_id'])return obj[key+'_id'];
  return obj[key]||'';
}
/* 文字列配列の言語出し分け（要素ごとに _id を参照、無ければ日本語） */
function dva(obj,key,lang){
  const a=(obj&&Array.isArray(obj[key]))?obj[key]:[];
  if(lang!=='id')return a;
  const ids=obj[key+'_id'];
  if(!Array.isArray(ids))return a;
  return a.map((jp,i)=>ids[i]||jp);
}

/* ══════════ 自動翻訳（JP→ID）：生産計画アプリと同じプロキシ ══════════ */
const TRANSLATE_URL='https://dawn-wave-20e6.motsu922.workers.dev';
async function translateText(text){
  const r=await fetch(TRANSLATE_URL+'?text='+encodeURIComponent(text));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(j.error)throw new Error(j.error);
  return j.translated||'';
}
/* 翻訳が必要な箇所を収集（_src＝翻訳元の日本語。日本語が変わった項目だけ再翻訳。手入力の _id は尊重） */
function trStr(obj,key,jobs,force){
  if(!obj)return;
  const jp=(obj[key]||'').trim();
  if(!jp){delete obj[key+'_id'];delete obj[key+'_src'];return;}
  if(!force&&obj[key+'_id']&&(obj[key+'_src']===undefined||obj[key+'_src']===jp)){obj[key+'_src']=jp;return;}
  jobs.push({jp,apply:id=>{obj[key+'_id']=id;obj[key+'_src']=jp;}});
}
function trArr(obj,key,jobs,force){
  if(!obj)return;
  const a=Array.isArray(obj[key])?obj[key]:[];
  if(!a.length){delete obj[key+'_id'];delete obj[key+'_src'];return;}
  const ids=Array.isArray(obj[key+'_id'])?obj[key+'_id']:[];
  const srcs=Array.isArray(obj[key+'_src'])?obj[key+'_src']:[];
  const nid=a.map((jp,i)=>(!force&&ids[i]&&srcs[i]===jp)?ids[i]:null);
  obj[key+'_id']=nid;obj[key+'_src']=a.slice();
  a.forEach((jp,i)=>{if(nid[i]==null&&jp.trim())jobs.push({jp,apply:id=>{nid[i]=id;}});});
}
function collectTranslateJobs(d,force){
  const jobs=[];
  const S=(o,k)=>trStr(o,k,jobs,force), A=(o,k)=>trArr(o,k,jobs,force);
  S(d,'name');S(d,'locNote');
  A(d,'productNotes');A(d,'cautions');A(d,'toolNotes');A(d,'kanbanNotes');
  if(d.shape){(d.shape.points||[]).forEach(p=>S(p,'text'));(d.shape.similars||[]).forEach(x=>{S(x,'name');A(x,'diffs');});A(d.shape,'notes');}
  if(d.teekin)S(d.teekin,'note');
  if(d.hanger){(d.hanger.features||[]).forEach(f=>{S(f,'title');S(f,'note');});A(d.hanger,'cautions');}
  (d.steps||[]).forEach(x=>S(x,'text'));
  (d.tools||[]).forEach(x=>{S(x,'name');S(x,'note');});
  if(d.packing){(d.packing.patterns||[]).forEach(x=>{S(x,'divider');S(x,'direction');});A(d.packing,'notes');}
  (d.boxes||[]).forEach(bx=>{S(bx,'name');(bx.steps||[]).forEach(x=>{S(x,'title');S(x,'desc');});});
  if(d.idMark){S(d.idMark,'fullNote');S(d.idMark,'zoomNote');S(d.idMark,'markType');}
  (d.kanbans||[]).forEach(k=>['type','use','process','issuer','note'].forEach(f=>S(k,f)));
  Object.values(d.sheets||{}).forEach(sh=>{(sh.steps||[]).forEach(x=>S(x,'text'));A(sh,'notes');});
  return jobs;
}
async function runTranslate(jobs,onProgress){
  let done=0,fail=0;const queue=jobs.slice();
  async function worker(){
    while(queue.length){
      const j=queue.shift();
      try{const id=await translateText(j.jp);if(id)j.apply(id);else fail++;}catch(e){fail++;}
      done++;onProgress&&onProgress(done,jobs.length);
    }
  }
  await Promise.all([0,1,2,3].map(worker));
  return{done,fail};
}

function LoadingScreen(){return <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',gap:16}}><Spinner/><div style={{fontSize:14,color:'#888'}}>接続中...</div></div>;}
function ErrorScreen({error,onRetry}){

      <div style={{fontSize:16,color:'#C0392B',fontWeight:700}}>接続に失敗しました</div>

      <button onClick={onRetry} style={{minHeight:48,padding:'0 32px',borderRadius:10,background:NAVY,color:'#fff',fontSize:15,fontWeight:700}}>再試行</button>
    </div>
  );
}
function QRDisplay({value,size=120}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!value)return;
    const gen=()=>{if(!window.QRious){setTimeout(gen,300);return;}
      try{new window.QRious({element:ref.current,value,size,padding:4,level:'M'});}catch(e){}};
    gen();
  },[value,size]);
  return <canvas ref={ref} style={{display:'block',borderRadius:4,width:size+'px',height:size+'px'}}/>;
}
function ImageModal({src,onClose}){
  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:500}}>
      <img src={src} style={{maxWidth:'95vw',maxHeight:'92vh',borderRadius:10,objectFit:'contain'}} onClick={e=>e.stopPropagation()}/>
      <button onClick={onClose} style={{position:'fixed',top:16,right:16,width:44,height:44,borderRadius:'50%',background:'rgba(255,255,255,.2)',color:'#fff',fontSize:24}}>×</button>
    </div>
  );
}
function TapPhoto({src,style,ratio,empty}){
  const[open,setOpen]=useState(false);
  if(!src)return <div style={{...(style||{}),background:'#F0F2F5',border:'1px dashed #C7CDD6',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',color:'#B0B7C0',fontSize:12,minHeight:ratio||120}}>{empty||'写真なし'}</div>;
  return(<>
    <img src={src} style={{...style,cursor:'zoom-in'}} onClick={()=>setOpen(true)}/>
    {open&&<ImageModal src={src} onClose={()=>setOpen(false)}/>}
  </>);
}
/* テーブル見出し：現在の言語を上段、もう一方を小さく下段に（横幅を節約） */
function TH({k,k2}){
  const{lang}=useLang();
  const main=k2?(lang==='id'?(DICT[k]||k)+' / '+(DICT[k2]||k2):k+' / '+k2):(lang==='id'?(DICT[k]||k):k);

/* QR照合モーダル（ハンディスキャナー方式） */
function QRScannerModal({expectedValue,label,onSuccess,onClose}){
  const{t,b}=useLang();
  const inputRef=useRef(null);
  const[scanned,setScanned]=useState('');
  const[fb,setFb]=useState(null);
  const[done,setDone]=useState(false);
  useEffect(()=>{setTimeout(()=>inputRef.current?.focus(),150);},[]);
  function check(text){
    const v=(text||'').trim();
    if(!v)return;
    const ok=expectedValue?(v.includes(expectedValue)||expectedValue.includes(v)):true;
    if(ok){setFb({ok:true,text:t('照合成功')+' ✓'});setDone(true);setTimeout(()=>onSuccess(v),600);}
    else{setFb({ok:false,text:t('不一致')+': "'+v.slice(0,24)+'"'});setTimeout(()=>{setFb(null);setScanned('');inputRef.current?.focus();},2000);}
  }
  return(
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{background:'#fff',borderRadius:16,width:'100%',maxWidth:440,overflow:'hidden'}}>
        <div style={{background:NAVY,padding:'16px 20px'}}>
          <div style={{fontSize:17,fontWeight:700,color:'#fff'}}>{b('QR照合')}</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.75)',marginTop:2}}>{label}</div>
        </div>
        <div style={{padding:'26px 24px 18px',textAlign:'center'}}>
          <div style={{fontSize:52,lineHeight:1,marginBottom:14,color:NAVY}}>▦</div>
          <div style={{fontSize:15,fontWeight:600,marginBottom:16}}>{t('ハンディスキャナーでスキャンしてください')}</div>
          <input ref={inputRef} value={scanned} onChange={e=>setScanned(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&check(scanned)} inputMode="none" autoFocus
            style={{position:'fixed',top:-9999,left:-9999,opacity:0,width:1,height:1}}/>
          <div style={{padding:'14px 16px',borderRadius:10,border:'2px solid '+(fb?(fb.ok?'#2E7D32':'#C62828'):'#CBD3DC'),background:scanned?'#F2F7FF':'#F7F8FA',display:'flex',alignItems:'center',gap:10,minHeight:52}}>
            <span style={{fontSize:20}}>{done?'✅':scanned?'⌛':'📷'}</span>
            <span style={{flex:1,fontFamily:'monospace',fontSize:15,color:scanned?'#111':'#AAB',letterSpacing:1,wordBreak:'break-all',textAlign:'left'}}>{scanned||t('スキャン待機中...')}</span>
          </div>
          {scanned&&!done&&<button onClick={()=>check(scanned)} style={{width:'100%',minHeight:46,borderRadius:10,background:NAVY,color:'#fff',fontSize:15,fontWeight:700,marginTop:10}}>{b('QR照合')}</button>}
          {fb&&<div style={{marginTop:12,padding:12,borderRadius:10,background:fb.ok?'#E8F5E9':'#FDECEA',color:fb.ok?'#1B5E20':'#B71C1C',fontSize:16,fontWeight:700}}>{fb.text}</div>}
        </div>
        <div style={{padding:'0 24px 22px'}}>
          <button onClick={onClose} style={{width:'100%',minHeight:46,borderRadius:10,border:'1px solid '+LINE,background:'#fff',fontSize:14,color:'#555'}}>{t('閉じる')}</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════ ログイン ══════════ */
function LoginScreen(){
  const[email,setEmail]=useState('');
  const[password,setPassword]=useState('');
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState('');
  async function submit(e){
    e.preventDefault();
    if(!email||!password)return;
    setLoading(true);setError('');
    try{await auth.signInWithEmailAndPassword(email.trim(),password);}
    catch(err){
      const m={'auth/user-not-found':'メールアドレスが登録されていません','auth/wrong-password':'パスワードが間違っています',
        'auth/invalid-email':'メールアドレスの形式が正しくありません','auth/invalid-credential':'メールアドレスまたはパスワードが間違っています',
        'auth/too-many-requests':'試行回数が多すぎます。しばらく待ってから再試行してください'};
      setError(m[err.code]||'ログインに失敗しました');
    }finally{setLoading(false);}
  }
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,'+NAVY_D+' 0%,'+NAVY+' 100%)',padding:24}}>
      <div style={{background:'#fff',borderRadius:16,padding:'40px 34px',width:'100%',maxWidth:410,boxShadow:'0 20px 60px rgba(0,0,0,.35)'}}>
        <div style={{textAlign:'center',marginBottom:30}}>
          <div style={{fontSize:38,marginBottom:8}}>🏭</div>
          <div style={{fontSize:22,fontWeight:700,color:NAVY,letterSpacing:1}}>長坂コーティング</div>
          <div style={{fontSize:13,color:'#8A93A0',marginTop:6}}>アウトライン工程システム</div>
        </div>
        <form onSubmit={submit}>
          <div style={{marginBottom:16}}>
            <label style={{display:'block',fontSize:13,fontWeight:600,color:'#444',marginBottom:6}}>メールアドレス</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="example@email.com" autoComplete="email"/>
          </div>
          <div style={{marginBottom:22}}>
            <label style={{display:'block',fontSize:13,fontWeight:600,color:'#444',marginBottom:6}}>パスワード</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="パスワードを入力" autoComplete="current-password"/>
          </div>
          {error&&<div style={{padding:'10px 14px',borderRadius:8,background:'#FDECEA',color:'#B71C1C',fontSize:13,marginBottom:16,fontWeight:600}}>{error}</div>}
          <button type="submit" disabled={loading||!email||!password}
            style={{width:'100%',minHeight:50,borderRadius:10,background:(loading||!email||!password)?'#AEB6C2':NAVY,color:'#fff',fontSize:16,fontWeight:700}}>
            {loading?'ログイン中...':'ログイン'}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ══════════ 品番検索 ══════════ */
function SearchScreen({master,proc,user,onPick,onBack,onHome}){
  const{lang,t,b}=useLang();
  const[q,setQ]=useState('');
  const[page,setPage]=useState(1);
  const PER=10;
  const all=proc?hinbansOf(master,proc.id):Object.keys(master).sort();
  const kw=q.trim().toLowerCase();
  const hits=all.filter(h=>matchHinban(master,h,kw));
  const pages=Math.max(1,Math.ceil(hits.length/PER));
  const cur=Math.min(page,pages);
  const rows=hits.slice((cur-1)*PER,cur*PER);
  const th={padding:'12px 14px',fontSize:14,fontWeight:700,color:'#fff',textAlign:'left',whiteSpace:'nowrap'};
  const td={padding:'12px 14px',fontSize:15,color:'#1A1A1A',borderBottom:'1px solid '+LINE};
  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column'}}>
      <TopBar title={b('製品検索')} onBack={onBack} user={user}
        left={proc?<div style={{color:'#fff',fontSize:14,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>🏭 {lang==='id'?proc.id_:proc.ja}</div>:null}/>
      <div style={{flex:1,overflowY:'auto',padding:'20px 28px'}}>
        <div style={{fontSize:13,fontWeight:600,color:'#5A6472',marginBottom:8}}>{b('キーワード')}</div>
        <div style={{display:'flex',gap:14,marginBottom:18,maxWidth:1100}}>
          <div style={{flex:1,display:'flex'}}>
            <input value={q} onChange={e=>{setQ(e.target.value);setPage(1);}} placeholder={b('呼称・品番で検索')}
              style={{borderRadius:'8px 0 0 8px',borderRight:'none'}}/>
            <div style={{background:NAVY,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',width:58,borderRadius:'0 8px 8px 0',fontSize:20}}>🔍</div>
          </div>
        </div>
        <div style={{fontSize:15,fontWeight:600,color:'#3A4552',marginBottom:10}}>
          {lang==='id'?`Hasil pencarian: ${hits.length} item`:`検索結果：${hits.length}件 / Hasil pencarian: ${hits.length} item`}
        </div>
        <div style={{border:'1px solid '+LINE,borderRadius:10,overflowX:'auto',background:'#fff'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{background:NAVY}}>
              <th style={{...th,width:70}}>No.</th>
              <th style={th}>{b('呼称')}</th>
              <th style={th}>{b('品番')}</th>
              <th style={th}>{b('品名')}</th>
              <th style={{...th,width:190}}>{b('更新日')}</th>
              <th style={{...th,width:150,textAlign:'center'}}>{b('選択')}</th>
            </tr></thead>
            <tbody>
              {rows.map((h,i)=>{
                const m=master[h]||{};
                return(
                  <tr key={h} style={{background:i%2?'#F7F9FC':'#fff'}}>
                    <td style={td}>{(cur-1)*PER+i+1}</td>
                    <td style={{...td,fontWeight:700}}>{h}</td>
                    <td style={td}>{m.partNo||'—'}</td>
                    <td style={td}>{dv(m,'name',lang)||'—'}</td>
                    <td style={td}>{m.updatedAt||'—'}</td>
                    <td style={{...td,textAlign:'center'}}>
                      <button onClick={()=>onPick(h)} style={{minHeight:40,padding:'0 22px',borderRadius:6,background:NAVY,color:'#fff',fontSize:14,fontWeight:700}}>{b('選択')}</button>
                    </td>
                  </tr>
                );
              })}
              {rows.length===0&&<tr><td colSpan={6} style={{...td,textAlign:'center',color:'#9AA3AF',padding:'40px',whiteSpace:'normal'}}>
                {all.length===0&&proc?<>{t('この工程の製品がありません')}<br/><span style={{fontSize:12}}>マスター管理 →「工程名」でこの工程を登録してください。</span></>:t('製品が未登録です')}
              </td></tr>}
            </tbody>
          </table>
        </div>
        {pages>1&&(
          <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:10,marginTop:18}}>
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={cur===1}
              style={{minHeight:42,padding:'0 18px',borderRadius:8,border:'1px solid '+LINE,background:'#fff',color:cur===1?'#B0B7C0':NAVY,fontSize:14,fontWeight:600}}>‹ {b('前へ')}</button>
            {Array.from({length:pages},(_,i)=>i+1).map(n=>(
              <button key={n} onClick={()=>setPage(n)}
                style={{minWidth:44,minHeight:42,borderRadius:8,border:'1px solid '+(n===cur?NAVY:LINE),background:n===cur?NAVY:'#fff',color:n===cur?'#fff':NAVY,fontSize:15,fontWeight:700}}>{n}</button>
            ))}
            <button onClick={()=>setPage(p=>Math.min(pages,p+1))} disabled={cur===pages}
              style={{minHeight:42,padding:'0 18px',borderRadius:8,border:'1px solid '+LINE,background:'#fff',color:cur===pages?'#B0B7C0':NAVY,fontSize:14,fontWeight:600}}>{b('次へ')} ›</button>
          </div>
        )}
      </div>

    </div>
  );
}

      {scan&&<QRScannerModal expectedValue={scan.expected} label={scan.label} onSuccess={()=>setScan(null)} onClose={()=>setScan(null)}/>}
      {video&&m.videoUrl&&<VideoModal url={m.videoUrl} onClose={()=>setVideo(false)}/>}
    </div>
  );
}

/* ── 各情報ページの中身 ── */
function PageBody({pageKey,m,hinban,onScan}){
  const{lang,t,b}=useLang();
  const P=({children})=><div className="panel" style={{marginBottom:14}}>{children}</div>;
  const H=({children})=><div className="panel-h">{children}</div>;
  const Body=({children,pad})=><div style={{padding:pad===false?0:16}}>{children}</div>;
  const none=<div style={{color:'#9AA3AF',fontSize:14,padding:'8px 0'}}>{t('未登録')}</div>;
  const txt=s=>s?<div style={{fontSize:14.5,lineHeight:1.85,whiteSpace:'pre-wrap',color:'#2A3340'}}>{s}</div>:none;
  const L=(o,k)=>dv(o,k,lang);

  if(pageKey==='product'){
    return(<>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))',gap:14}}>
        <P><H>{b('全体写真')}</H><Body><TapPhoto src={m.productImg} style={{width:'100%',maxHeight:420,objectFit:'contain',borderRadius:8,display:'block',margin:'0 auto'}} ratio={280}/></Body></P>
        <P><H>{b('呼称')} / {b('品番')} / {b('品名')}</H><Body>
          <div style={{fontSize:34,fontWeight:800,color:NAVY,marginBottom:4}}>{hinban}</div>
          {m.partNo&&<div style={{fontSize:16,color:'#5A6472',marginBottom:4}}>{b('品番')}：<b style={{color:'#2A3340'}}>{m.partNo}</b></div>}
          <div style={{fontSize:18,color:'#3A4552',marginBottom:10}}>{L(m,'name')||'—'}</div>
          {(m.procIds||[]).length>0&&<div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:12}}>
            {(m.procIds||[]).map(pid=>{const pp=procById(pid);return pp?<span key={pid} style={{fontSize:11.5,fontWeight:700,padding:'3px 9px',borderRadius:5,background:LBLUE,color:BLUE}}>{pp.no}. {lang==='id'?pp.id_:pp.ja}</span>:null;})}
          </div>}
          {m.qrText&&<div style={{display:'flex',alignItems:'center',gap:16}}><QRDisplay value={m.qrText} size={120}/><div style={{fontSize:12,color:'#6B7480',wordBreak:'break-all'}}>{m.qrText}</div></div>}
        </Body></P>
      </div>
      <WarnBox items={dva(m,'productNotes',lang)}/>
    </>);
  }

  if(pageKey==='shape'){
    const pts=m.shape?.points||[], sims=m.shape?.similars||[];
    return(<>
      <div style={{fontSize:14,color:'#5A6472',marginBottom:12}}>この品番を、類似品と見分けるための形状の特徴です。作業前に必ず確認してください。</div>
      <div style={{display:'grid',gridTemplateColumns:'minmax(320px,1fr) minmax(340px,1.3fr)',gap:14,alignItems:'start'}}>
        <P><H>{hinban}（{b('本品の特徴')}）</H><Body>
          {(()=>{const imgs=[m.shape?.img,m.shape?.img2,m.shape?.img3].filter(Boolean);
            return imgs.length?(
              <div style={{display:'grid',gridTemplateColumns:`repeat(${imgs.length},1fr)`,gap:8,marginBottom:12}}>
                {imgs.map((u,i)=><TapPhoto key={i} src={u} style={{width:'100%',height:imgs.length>1?150:250,objectFit:'contain',borderRadius:8,background:'#F0F2F5',display:'block'}} ratio={150}/>)}
              </div>
            ):<div style={{marginBottom:12}}><TapPhoto src="" ratio={200}/></div>;})()}
          <div style={{display:'flex',gap:14,flexWrap:'wrap'}}>
            <div style={{flex:1,minWidth:180,display:'flex',flexDirection:'column',gap:12}}>
              {pts.length?pts.map((p,i)=>(
                <div key={i} style={{display:'flex',gap:10}}>
                  <NumBadge n={i+1} size={22} bg="#C0392B"/>
                  <span style={{fontSize:14,lineHeight:1.7,color:'#2A3340'}}>{L(p,'text')}</span>
                </div>
              )):none}
            </div>
          </div>
        </Body></P>
        <P><H>{b('類似品との違い')}</H><Body>
          <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.max(1,Math.min(3,sims.length||1))},1fr)`,gap:12}}>
            {sims.length?sims.map((s,i)=>(
              <div key={i} style={{border:'1px solid '+LINE,borderRadius:8,overflow:'hidden'}}>
                <div style={{background:'#6B7480',color:'#fff',padding:'7px 10px',fontSize:13,fontWeight:700,textAlign:'center'}}>{lang==='id'?'Produk serupa':'類似品'}：{L(s,'name')||'—'}</div>
                <TapPhoto src={s.img} style={{width:'100%',height:150,objectFit:'contain',background:'#F0F2F5',display:'block'}} ratio={150}/>
                <div style={{padding:'10px'}}>
                  {dva(s,'diffs',lang).map((d,j)=><div key={j} style={{fontSize:12.5,lineHeight:1.7,color:'#2A3340'}}>・{d}</div>)}
                </div>
              </div>
            )):none}
          </div>
        </Body></P>
      </div>
      <WarnBox items={(m.shape?.notes||[]).length?dva(m.shape,'notes',lang):(lang==='id'?['Periksa poin di atas agar tidak tertukar dengan produk serupa.','Jika ragu, pastikan bertanya kepada pengelola.']:['上記のポイントを確認し、類似品と間違えないようにしてください。','不明な場合は、必ず管理者に確認してください。'])}/>
    </>);
  }

  if(pageKey==='teekin'){
    return(<>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))',gap:14}}>
        <P><H>{b('全体写真')}</H><Body><TapPhoto src={m.teekin?.img} style={{width:'100%',maxHeight:380,objectFit:'contain',borderRadius:8,display:'block',margin:'0 auto'}} ratio={260}/></Body></P>
        <P><H>{b('注意事項')}</H><Body>{txt(L(m.teekin||{},'note'))}</Body></P>
      </div>
    </>);
  }

  if(pageKey==='hanger'){
    const f=m.hanger?.features||[], sp=m.hanger?.spec||[];
    return(<>
      <div style={{fontSize:14,color:'#5A6472',marginBottom:12}}>この品番で使用するハンガーの写真と仕様です。</div>
      <div style={{display:'grid',gridTemplateColumns:'minmax(260px,1fr) minmax(300px,1.1fr) minmax(280px,1fr)',gap:14,alignItems:'start'}}>
        <P><H>{b('全体写真')}</H><Body><TapPhoto src={m.hanger?.img} style={{width:'100%',maxHeight:400,objectFit:'contain',borderRadius:8,display:'block'}} ratio={300}/></Body></P>
        <P><H>{b('主な特徴')}</H><Body>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {f.length?f.map((x,i)=>(
              <div key={i} style={{border:'1px solid '+LINE,borderRadius:8,overflow:'hidden'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',background:LBLUE}}>
                  <NumBadge n={i+1} size={20}/><span style={{fontSize:12.5,fontWeight:700,color:BLUE}}>{L(x,'title')}</span>
                </div>
                <TapPhoto src={x.img} style={{width:'100%',height:120,objectFit:'contain',background:'#F0F2F5',display:'block'}} ratio={120}/>
                <div style={{padding:'8px 10px',fontSize:12.5,lineHeight:1.6,color:'#2A3340',whiteSpace:'pre-wrap'}}>{L(x,'note')}</div>
              </div>
            )):none}
          </div>
        </Body></P>
        <div>
          <P><H>{b('仕様')}</H><Body pad={false}>
            {sp.length?sp.map((r,i)=>(
              <div key={i} style={{display:'flex',borderBottom:i<sp.length-1?'1px solid '+LINE:'none'}}>
                <div style={{width:130,padding:'10px 12px',fontSize:13,color:'#5A6472',background:'#F7F9FC',flexShrink:0}}>{r.k}</div>
                <div style={{padding:'10px 12px',fontSize:13.5,fontWeight:600,color:'#2A3340'}}>{r.v}</div>
              </div>
            )):<div style={{padding:16}}>{none}</div>}
          </Body></P>
          {(m.hanger?.cautions||[]).length>0&&(
            <div style={{background:LBLUE,border:'1px solid #D5E3F5',borderRadius:10,padding:'12px 16px'}}>
              <div style={{fontSize:13,fontWeight:700,color:BLUE,marginBottom:6}}>{b('使用時の注意')}</div>
              {dva(m.hanger,'cautions',lang).map((c,i)=><div key={i} style={{fontSize:13,lineHeight:1.75,color:'#2A3340'}}>・{c}</div>)}
            </div>
          )}
        </div>
      </div>
    </>);
  }

  if(pageKey==='steps'){
    const st=m.steps||[];
    return(<>
      <P><H>{b('作業の流れ')}</H><Body>
        {st.length?(
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {st.map((s,i)=>(
              <div key={i} style={{display:'flex',gap:14,alignItems:'flex-start',padding:'12px 14px',background:i%2?'#F7F9FC':'#fff',border:'1px solid '+LINE,borderRadius:8}}>
                <NumBadge n={i+1} size={28}/>
                {s.img&&<TapPhoto src={s.img} style={{width:130,height:100,objectFit:'contain',borderRadius:6,background:'#F0F2F5',flexShrink:0}} ratio={100}/>}
                <div style={{flex:1,fontSize:15,lineHeight:1.8,color:'#2A3340',whiteSpace:'pre-wrap'}}>{L(s,'text')}</div>
              </div>
            ))}
          </div>
        ):none}
      </Body></P>
    </>);
  }

  if(pageKey==='caution'){
    const cs=dva(m,'cautions',lang);
    return(<>
      <P><H>{b('注意ポイント')}</H><Body>
        {cs.length?(
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {cs.map((c,i)=>(
              <div key={i} style={{display:'flex',gap:12,padding:'14px 16px',background:'#FEF3E7',border:'1px solid #F5D9BC',borderRadius:8}}>
                <span style={{color:'#C2410C',fontWeight:800,fontSize:17,flexShrink:0}}>!</span>
                <span style={{fontSize:15,lineHeight:1.75,color:'#7A3A08',whiteSpace:'pre-wrap'}}>{c}</span>
              </div>
            ))}
          </div>
        ):none}
      </Body></P>
    </>);
  }

  if(pageKey==='tools'){
    const ts=m.tools||[];
    return(<>
      <div style={{fontSize:14,color:'#5A6472',marginBottom:12}}>この品番の作業で使用する道具・備品です。作業前に準備してください。</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:12}}>
        {ts.length?ts.map((x,i)=>(
          <div key={i} className="panel">
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:LBLUE}}>
              <NumBadge n={i+1} size={21}/><span style={{fontSize:13,fontWeight:700,color:BLUE}}>{L(x,'name')}</span>
            </div>
            <TapPhoto src={x.img} style={{width:'100%',height:135,objectFit:'contain',background:'#F0F2F5',display:'block'}} ratio={135}/>
            <div style={{padding:'9px 11px',fontSize:12.5,lineHeight:1.65,color:'#2A3340',whiteSpace:'pre-wrap'}}>{L(x,'note')}</div>
          </div>
        )):none}
      </div>
      <WarnBox items={dva(m,'toolNotes',lang)}/>
    </>);
  }

  if(pageKey==='packing'){
    const pk=m.packing||{}, pats=pk.patterns||[];
    return(<>
      <div style={{fontSize:14,color:'#5A6472',marginBottom:12}}>この品番の収容数と梱包荷姿は以下の通りです。作業時に確認してください。</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
        <P><H>{b('収容数')}</H><Body>
          {(()=>{
            const caps=pats.map(x=>String(x.capacity||pk.capacity||'').trim()).filter(Boolean);
            const uniq=[...new Set(caps)];
            const varies=uniq.length>1;
            if(!varies)return(
              <div style={{background:'#F2F6FD',borderRadius:10,padding:'26px',textAlign:'center'}}>
                <div style={{fontSize:14,color:'#5A6472',marginBottom:8}}>{b('1箱あたりの収容数')}</div>
                <div style={{fontSize:44,fontWeight:800,color:NAVY}}>{uniq[0]||pk.capacity||'—'}<span style={{fontSize:20,marginLeft:4}}>個</span></div>
              </div>);
            return(
              <div style={{background:'#F2F6FD',borderRadius:10,padding:'16px'}}>
                <div style={{fontSize:14,fontWeight:700,color:'#C2410C',textAlign:'center',marginBottom:12}}>⚠ {b('荷姿により異なります')}</div>
                <div style={{display:'flex',flexDirection:'column',gap:7}}>
                  {pats.map((x,i)=>(
                    <div key={i} style={{display:'flex',alignItems:'center',gap:10,background:'#fff',borderRadius:8,padding:'8px 12px'}}>
                      <NumBadge n={i+1} size={22}/>
                      <span style={{fontSize:12.5,color:'#5A6472',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{L(x,'divider')||b('梱包荷姿')+(i+1)}</span>
                      <span style={{fontSize:22,fontWeight:800,color:NAVY,fontVariantNumeric:'tabular-nums'}}>{x.capacity||pk.capacity||'—'}<span style={{fontSize:12,marginLeft:2,color:'#6B7480'}}>個</span></span>
                    </div>
                  ))}
                </div>
              </div>);
          })()}
        </Body></P>
        <P><H>{b('製品イメージ')}</H><Body><TapPhoto src={pk.productImg||m.productImg} style={{width:'100%',maxHeight:190,objectFit:'contain',borderRadius:8,display:'block'}} ratio={170}/></Body></P>
      </div>
      <P><H>{b('梱包荷姿')}（最大4種類）</H><Body>
        <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.max(1,Math.min(4,pats.length||1))},1fr)`,gap:12}}>
          {pats.length?pats.map((p,i)=>(
            <div key={i} style={{border:'1px solid '+LINE,borderRadius:8,overflow:'hidden'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'8px',background:LBLUE}}>
                <span style={{fontSize:13,fontWeight:700,color:BLUE}}>{b('梱包荷姿')}</span><NumBadge n={i+1} size={20}/>
              </div>
              <TapPhoto src={p.img} style={{width:'100%',height:140,objectFit:'cover',background:'#F0F2F5',display:'block'}} ratio={140}/>
              <div style={{padding:'10px'}}>
                <div style={{fontSize:12.5,color:'#2A3340',lineHeight:1.8}}>{b('仕切り')}：{L(p,'divider')||'—'}</div>
                <div style={{fontSize:12.5,color:'#2A3340',lineHeight:1.8}}>{b('向き')}：{L(p,'direction')||'—'}</div>
                <div style={{marginTop:8,textAlign:'center',background:'#F2F6FD',borderRadius:8,padding:'7px 4px'}}>
                  <div style={{fontSize:10.5,color:'#6B7480'}}>{b('収容数')}</div>
                  <div style={{fontSize:24,fontWeight:800,color:NAVY,lineHeight:1.15,fontVariantNumeric:'tabular-nums'}}>{p.capacity||pk.capacity||'—'}<span style={{fontSize:12,marginLeft:2,color:'#6B7480'}}>個</span></div>
                </div>
              </div>
            </div>
          )):none}
        </div>
      </Body></P>
      <WarnBox items={dva(pk,'notes',lang)}/>
    </>);
  }

  if(pageKey==='boxes'){
    const bx=m.boxes||[];
    return(<>
      <div style={{background:LBLUE,border:'1px solid #D5E3F5',borderRadius:10,padding:'12px 18px',display:'flex',gap:10,alignItems:'center',marginBottom:14}}>
        <span style={{fontSize:20}}>🗃</span>
        <span style={{fontSize:14,fontWeight:700,color:BLUE}}>納入箱の確認を行います。製品の入った箱を確認し、指定の場所に納めてください。</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        {bx.length?bx.map((x,i)=>(
          <div key={i} className="panel">
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'11px 14px',borderBottom:'1px solid '+LINE}}>
              <NumBadge n={i+1} size={26}/>
              <span style={{fontSize:16,fontWeight:700,color:BLUE,flex:1}}>{L(x,'name')}</span>
              <span style={{fontSize:11.5,fontWeight:700,padding:'4px 10px',borderRadius:5,background:x.inUse?'#FDE68A':'#E8EAEE',color:x.inUse?'#7A5A00':'#6B7480'}}>{x.inUse?b('使用中'):b('未使用')}</span>
            </div>
            <div style={{padding:14,display:'flex',gap:14}}>
              <TapPhoto src={x.img} style={{width:190,height:170,objectFit:'contain',borderRadius:8,background:'#F0F2F5',flexShrink:0}} ratio={170}/>
              <div style={{flex:1,display:'flex',flexDirection:'column',gap:9}}>
                {(x.steps||[]).map((s,j)=>(
                  <div key={j} style={{display:'flex',gap:9}}>
                    <NumBadge n={j+1} size={19}/>
                    <div><div style={{fontSize:13,fontWeight:700,color:BLUE}}>{L(s,'title')}</div><div style={{fontSize:12,color:'#5A6472',lineHeight:1.55}}>{L(s,'desc')}</div></div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{padding:'10px 14px',borderTop:'1px solid '+LINE,display:'flex',gap:16,flexWrap:'wrap',fontSize:12.5,color:'#5A6472'}}>
              <span>{b('外寸')}：{x.size||'—'}</span><span>|</span>
              <span>{b('仕切数')}：{x.dividers||'—'}</span><span>|</span>
              <span>{b('材質')}：{x.material||'—'}</span>
            </div>
          </div>
        )):none}
      </div>
    </>);
  }

  if(pageKey==='idmark'){
    const im=m.idMark||{};
    return(<>
      <div style={{fontSize:14,color:'#5A6472',marginBottom:12}}>この品番の識別マークは以下の通りです。製品の識別・工程管理に使用します。</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <P><H>{b('全体写真')}</H><Body>
          <TapPhoto src={im.fullImg} style={{width:'100%',maxHeight:330,objectFit:'contain',borderRadius:8,display:'block'}} ratio={260}/>
          <div style={{fontSize:13.5,color:'#2A3340',marginTop:10}}>{L(im,'fullNote')||'製品に付いている識別マークの位置（全体）'}</div>
        </Body></P>
        <P><H>{b('拡大写真')}</H><Body>
          <TapPhoto src={im.zoomImg} style={{width:'100%',maxHeight:330,objectFit:'contain',borderRadius:8,display:'block'}} ratio={260}/>
          <div style={{fontSize:13.5,color:'#2A3340',marginTop:10}}>{L(im,'zoomNote')||'識別マークの拡大写真'}</div>
          {im.markType&&<div style={{fontSize:14,fontWeight:700,color:'#C0392B',marginTop:6}}>※ {im.markType}</div>}
        </Body></P>
      </div>
    </>);
  }

  if(pageKey==='kanban'){
    const kb=m.kanbans||[];
    const COL={'緑':'#2E7D32','黄':'#F1C40F','青':'#1B4A9C','ピンク':'#E48AA5','赤':'#C0392B','白':'#FFFFFF'};
    return(<>
      <div style={{fontSize:14,color:'#5A6472',marginBottom:12}}>この品番で使用するかんばんの種類と内容です。</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        {kb.length?kb.map((k,i)=>(
          <div key={i} className="panel">
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'11px 14px'}}>
              <NumBadge n={i+1} size={24}/><span style={{fontSize:15,fontWeight:700,color:BLUE}}>{L(k,'type')}</span>
            </div>
            <div style={{padding:'0 14px 14px',display:'flex',gap:14}}>
              {/* かんばん見本 */}
              <div style={{width:215,flexShrink:0,border:'1px solid #333',borderRadius:4,overflow:'hidden',background:'#fff'}}>
                <div style={{display:'flex'}}>
                  <div style={{flex:1,background:COL[k.color]||'#DDD',color:(k.color==='黄'||k.color==='白')?'#333':'#fff',fontSize:12,fontWeight:700,padding:'5px 8px'}}>{L(k,'type')}</div>
                  <div style={{width:64,fontSize:11,fontWeight:700,padding:'5px 6px',textAlign:'center',borderLeft:'1px solid #333'}}>{hinban}</div>
                </div>
                <div style={{padding:'12px 8px 8px',textAlign:'center'}}>
                  <div style={{fontSize:26,fontWeight:800,letterSpacing:1}}>{hinban}</div>
                  <div style={{fontSize:12,color:'#333',marginTop:2}}>{dv(m,'name',lang)}</div>
                  <div style={{marginTop:8,height:34,background:'repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px)'}}/>
                  <div style={{fontSize:11,marginTop:3,fontFamily:'monospace'}}>{k.code||''}</div>
                </div>
              </div>
              <div style={{flex:1}}>
                {[[b('用途'),L(k,'use')],[b('使用工程'),L(k,'process')],[b('発行先'),L(k,'issuer')],[b('色'),k.color],[b('サイズ'),k.size],[b('備考'),L(k,'note')]].map(([kk,vv],j)=>(
                  <div key={j} style={{display:'flex',borderBottom:'1px solid '+LINE}}>
                    <div style={{width:96,padding:'7px 9px',fontSize:12,color:'#5A6472',background:'#F7F9FC',flexShrink:0}}>{kk}</div>
                    <div style={{padding:'7px 9px',fontSize:12.5,color:'#2A3340',display:'flex',alignItems:'center',gap:6}}>
                      {kk===b('色')&&vv&&<span style={{width:13,height:13,borderRadius:3,background:COL[vv]||'#DDD',border:'1px solid #B0B7C0',display:'inline-block'}}/>}
                      {vv||'—'}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )):none}
      </div>
      <WarnBox items={dva(m,'kanbanNotes',lang)}/>
      {QR_ENABLED&&m.kanbanQr&&(
        <div style={{marginTop:14,display:'flex',justifyContent:'center'}}>
          <button onClick={()=>onScan({expected:m.kanbanQr,label:hinban+'：かんばんQR照合'})}

            {QR_ENABLED
              ?<button onClick={()=>onScan({expected:m.qrText||hinban,label:hinban+'：製品QR照合'})}
                 style={{marginTop:14,minHeight:50,padding:'0 30px',borderRadius:10,background:NAVY,color:'#fff',fontSize:16,fontWeight:700}}>▦ {b('QR照合')}</button>
              :<div style={{marginTop:14,fontSize:12,color:'#9AA3AF'}}>※ {t('QRスキャナー導入後に利用できます')}</div>}
          </div>
        </Body></P>
        <P><H>かんばんQR / QR Kanban</H><Body>
          <div style={{textAlign:'center'}}>
            {m.kanbanQr?<><QRDisplay value={m.kanbanQr} size={180}/><div style={{fontSize:12,color:'#6B7480',marginTop:10,wordBreak:'break-all'}}>{m.kanbanQr}</div></>:none}
            {QR_ENABLED
              ?<button onClick={()=>onScan({expected:m.kanbanQr,label:hinban+'：かんばんQR照合'})} disabled={!m.kanbanQr}
                 style={{marginTop:14,minHeight:50,padding:'0 30px',borderRadius:10,background:m.kanbanQr?'#D97706':'#C7CDD6',color:'#fff',fontSize:16,fontWeight:700}}>▦ かんばん照合</button>
              :<div style={{marginTop:14,fontSize:12,color:'#9AA3AF'}}>※ {t('QRスキャナー導入後に利用できます')}</div>}
          </div>
        </Body></P>
      </div>
    );
  }
  return null;
}

/* ── マスター編集（ポップアップ） ── */
function MasterEditor({hinban,data,taken,onClose,onRenamed}){
  const{t,b}=useLang();
  const[d,setD]=useState(data);
  const[tab,setTab]=useState('basic');
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);
  const[busy,setBusy]=useState(null);
  const[renaming,setRenaming]=useState(false);
  const[rnBusy,setRnBusy]=useState(false);
  const[rnProg,setRnProg]=useState('');
  useEffect(()=>{setD(data);},[hinban]);

  const ref=db.collection('outlineMaster').doc(hinban);
  const[trProg,setTrProg]=useState(null);
  function upd(patch){setD(p=>({...p,...patch}));}
  /* 保存：日本語を先に保存 → 未翻訳/変更分を自動翻訳 → _id を保存 */
  async function save(force){
    setSaving(true);
    try{
      const stamp=new Date().toISOString().slice(0,10);
      await ref.set({...d,updatedAt:stamp},{merge:true});
      const nd=JSON.parse(JSON.stringify(d));
      const jobs=collectTranslateJobs(nd,force===true);
      if(jobs.length){
        setTrProg({done:0,total:jobs.length});
        const r=await runTranslate(jobs,(a,b)=>setTrProg({done:a,total:b}));
        setTrProg(null);
        await ref.set({...nd,updatedAt:stamp},{merge:true});
        setD(nd);
        if(r.fail)alert(`${r.fail}件の翻訳に失敗しました（該当箇所は日本語のまま表示されます）`);
      }
      setSaved(true);setTimeout(()=>setSaved(false),2500);
    }catch(e){alert('保存に失敗: '+e.message);}
    finally{setSaving(false);setTrProg(null);}
  }
  async function del(){
    if(!window.confirm(`呼称「${hinban}」を削除しますか？`))return;
    try{await ref.delete();onClose();}catch(e){alert('削除に失敗: '+e.message);}
  }
  /* 呼称（ドキュメントID）の変更：新IDで複製 → workOrders の参照を付け替え → 旧IDを削除 */
  async function doRename(nn){
    setRnBusy(true);
    try{
      setRnProg('① マスターを複製中...');
      const stamp=new Date().toISOString().slice(0,10);
      await db.collection('outlineMaster').doc(nn).set({...d,updatedAt:stamp},{merge:true});

      setRnProg('② スケジュール・実績を更新中...');
      let n=0;
      try{
        const snap=await db.collection('workOrders').where('hinban','==',hinban).get();
        const docs=snap.docs||[];
        for(const doc of docs){await doc.ref.update({hinban:nn});n++;}
      }catch(e){
        await db.collection('outlineMaster').doc(nn).delete().catch(()=>{});
        throw new Error('スケジュールの更新に失敗したため中止しました: '+e.message);
      }

      setRnProg('③ 旧データを削除中...');
      await db.collection('outlineMaster').doc(hinban).delete();

      setRenaming(false);setRnProg('');
      alert(`呼称を「${hinban}」→「${nn}」に変更しました。\nスケジュール・実績 ${n} 件も更新しました。`);
      onRenamed?onRenamed(nn):onClose();
    }catch(e){
      alert('呼称の変更に失敗: '+e.message);
    }finally{setRnBusy(false);setRnProg('');}
  }
  /* 画像アップロード：path は任意の識別子 */
  async function upImg(path,file,apply){
    if(!file)return;
    if(file.size>4*1024*1024){alert('4MB以下の画像を選択してください');return;}
    setBusy(path);
    try{
      const r=stor.ref(`outline-images/${hinban}/${path}`);
      await r.put(file);
      const url=await r.getDownloadURL();
      apply(url);
    }catch(e){alert('アップロード失敗: '+e.message);}
    finally{setBusy(null);}
  }

  const TABS=[
    ['basic','基本情報'],['shape','形状確認'],['teekin','テーキン'],['hanger','ハンガー'],
    ['steps','作業の流れ'],['caution','注意ポイント'],['tools','必要道具'],['packing','収容数・荷姿'],
    ['boxes','納入箱'],['idmark','識別マーク'],['kanban','かんばん'],['sheet','要領書・工数'],
  ];
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:600,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{background:'#fff',borderRadius:14,width:'100%',maxWidth:1000,height:'calc(100vh - 40px)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{background:NAVY,padding:'14px 20px',display:'flex',alignItems:'center',gap:14}}>
          <div style={{fontSize:20,fontWeight:700,color:'#fff',flex:1}}>{hinban}</div>
          <button onClick={()=>setRenaming(true)} style={{padding:'7px 16px',borderRadius:7,background:'rgba(255,255,255,.18)',color:'#fff',fontSize:13,fontWeight:700}}>✎ {t('呼称を変更')}</button>
          <button onClick={del} style={{padding:'7px 16px',borderRadius:7,background:'rgba(255,255,255,.15)',color:'#FFD9D9',fontSize:13,fontWeight:700}}>削除</button>
          <button onClick={onClose} style={{width:36,height:36,borderRadius:'50%',background:'rgba(255,255,255,.18)',color:'#fff',fontSize:20}}>×</button>
        </div>
        <div style={{display:'flex',gap:5,padding:'10px 16px',borderBottom:'1px solid '+LINE,overflowX:'auto',flexShrink:0}}>
          {TABS.map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)}
              style={{padding:'7px 13px',borderRadius:18,whiteSpace:'nowrap',fontSize:13,fontWeight:tab===k?700:600,background:tab===k?NAVY:'#F2F4F7',color:tab===k?'#fff':'#4A5460'}}>{l}</button>
          ))}
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'18px 20px'}}>
          <EditorBody tab={tab} d={d} upd={upd} upImg={upImg} busy={busy} hinban={hinban}/>
        </div>
        <div style={{padding:'12px 20px',borderTop:'1px solid '+LINE,display:'flex',gap:12,alignItems:'center',background:'#F7F8FA'}}>
          <button onClick={()=>save(false)} disabled={saving} style={{flex:1,minHeight:48,borderRadius:10,background:saving?'#AEB6C2':NAVY,color:'#fff',fontSize:16,fontWeight:700}}>
            {trProg?`🌐 翻訳中 ${trProg.done}/${trProg.total}`:(saving?'保存中...':'保存する（未翻訳分を自動でID翻訳）')}
          </button>
          <button onClick={()=>window.confirm('登録内容の全ての日本語を翻訳し直します。手入力した翻訳も上書きされます。よろしいですか？')&&save(true)} disabled={saving}
            style={{minHeight:48,padding:'0 16px',borderRadius:10,border:'1px solid '+LINE,background:'#fff',color:saving?'#9AA3AF':'#1A7FA8',fontSize:13,fontWeight:700,whiteSpace:'nowrap'}}>🌐 全て再翻訳</button>
          {saved&&<span style={{color:'#2E7D4F',fontWeight:700,fontSize:14,whiteSpace:'nowrap'}}>✓ 保存しました</span>}
        </div>
      </div>
      {renaming&&<RenameModal current={hinban} taken={taken||[]} busy={rnBusy} progress={rnProg}
        onSubmit={doRename} onClose={()=>!rnBusy&&setRenaming(false)}/>}
    </div>
  );
}

/* 1行1項目のテキストエリア ⇄ 配列 */
function LinesArea({value,onChange,height,ph}){
  return <textarea value={(value||[]).join('\n')} onChange={e=>onChange(e.target.value.split('\n').map(s=>s.trim()).filter(Boolean))}
    style={{width:'100%',height:height||80,resize:'vertical'}} placeholder={ph||'1行に1項目'}/>;
}

function EditorBody({tab,d,upd,upImg,busy,hinban}){
  const[sheetProc,setSheetProc]=useState(PROCESSES[0].id);
  const S=(k,v)=>upd({[k]:v});
  const sub=(k,patch)=>upd({[k]:{...(d[k]||{}),...patch}});

  if(tab==='basic')return(<>
    <div style={{padding:'10px 12px',background:'#F2F6FD',borderRadius:8,fontSize:12.5,color:'#4A5460',marginBottom:4}}>
      <b style={{color:NAVY}}>{hinban}</b> が「呼称」です（上の「✎ 呼称を変更」で変更できます）。実際の品番は下の欄に登録してください。
    </div>
    <Row>
      <div><FLbl>品番</FLbl><input value={d.partNo||''} onChange={e=>S('partNo',e.target.value)} placeholder="例: 1234-56789"/></div>
      <div><FLbl>品名（日本語）</FLbl><input value={d.name||''} onChange={e=>S('name',e.target.value)} placeholder="例: ブラケット ASSY"/></div>
    </Row>
    <FLbl>品名（インドネシア語）</FLbl>
    <input value={d.name_id||''} onChange={e=>S('name_id',e.target.value)} placeholder="Nama produk"/>
    <FLbl>工程名（この製品が通る工程・複数選択可）</FLbl>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',padding:'10px',border:'1px solid '+LINE,borderRadius:8,background:'#FAFBFC'}}>
      {PROCESSES.map(pp=>{
        const on=(d.procIds||[]).includes(pp.id);
        return(
          <button key={pp.id}
            onClick={()=>S('procIds', on?(d.procIds||[]).filter(x=>x!==pp.id):[...(d.procIds||[]),pp.id])}
            style={{padding:'8px 12px',borderRadius:8,fontSize:12.5,fontWeight:on?700:600,textAlign:'left',
              border:'1px solid '+(on?NAVY:LINE),background:on?'#E8F0FB':'#fff',color:on?NAVY:'#4A5460'}}>
            {on?'☑':'☐'} {pp.no}. {pp.ja}
          </button>
        );
      })}
    </div>
    {!(d.procIds||[]).length&&<div style={{fontSize:12,color:'#C2410C',marginTop:6}}>⚠ 工程を1つ以上選択しないと、各工程の作業画面にこの製品が表示されません。</div>}
    <FLbl>製品写真</FLbl>
    <ImgSlot url={d.productImg} busy={busy==='productImg'} h={150}
      onPick={f=>upImg('productImg',f,u=>S('productImg',u))} onClear={()=>S('productImg','')}/>
    <Row>
      <div><FLbl>QR照合文字列（製品）</FLbl><input value={d.qrText||''} onChange={e=>S('qrText',e.target.value)} placeholder="未設定なら品番で照合"/></div>
      <div><FLbl>かんばんQR照合文字列</FLbl><input value={d.kanbanQr||''} onChange={e=>S('kanbanQr',e.target.value)}/></div>
    </Row>
    <Row>
      <div><FLbl>端数品置き場所（ロケ番号）</FLbl><input value={d.locNo||''} onChange={e=>S('locNo',e.target.value)} placeholder="例: A-12"/></div>
      <div><FLbl>作業動画URL</FLbl><input value={d.videoUrl||''} onChange={e=>S('videoUrl',e.target.value)} placeholder="https://..."/></div>
    </Row>
    <FLbl>製品写真ページの注意事項（1行1項目）</FLbl>
    <LinesArea value={d.productNotes} onChange={v=>S('productNotes',v)}/>
  </>);

  if(tab==='shape'){
    const sh=d.shape||{};
    return(<>
      <FLbl>本品の写真（最大3枚）</FLbl>
      <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
        {['img','img2','img3'].map((k,i)=>(
          <ImgSlot key={k} label={`写真${i+1}`} url={sh[k]} busy={busy==='shape/'+k} h={150}
            onPick={f=>upImg('shape/'+k,f,u=>sub('shape',{[k]:u}))} onClear={()=>sub('shape',{[k]:''})}/>
        ))}
      </div>
      <FLbl>本品の特徴（番号順）</FLbl>
      <RepList items={sh.points} onChange={v=>sub('shape',{points:v})} addLabel="特徴を追加" blank={{text:'',text_id:''}}
        render={(it,set)=>(<Row>
          <div><input value={it.text||''} onChange={e=>set({...it,text:e.target.value})} placeholder="例: 丸穴あり（穴径：φ10±0.1）"/></div>
          <div><input value={it.text_id||''} onChange={e=>set({...it,text_id:e.target.value})} placeholder="Indonesian（任意）"/></div>
        </Row>)}/>
      <FLbl>類似品との違い（最大3件）</FLbl>
      <RepList items={sh.similars} onChange={v=>sub('shape',{similars:v})} max={3} addLabel="類似品を追加" blank={{name:'',img:'',diffs:[]}}
        render={(it,set,i)=>(<>
          <Row cols="1fr 170px">
            <div><input value={it.name||''} onChange={e=>set({...it,name:e.target.value})} placeholder="類似品の品番 例: B-123"/></div>
            <ImgSlot url={it.img} busy={busy==='shape/sim'+i} h={90} onPick={f=>upImg('shape/sim'+i,f,u=>set({...it,img:u}))} onClear={()=>set({...it,img:''})}/>
          </Row>
          <FLbl>違い（1行1項目）</FLbl>
          <LinesArea value={it.diffs} onChange={v=>set({...it,diffs:v})} height={70}/>
        </>)}/>
      <FLbl>注意事項（1行1項目）</FLbl>
      <LinesArea value={sh.notes} onChange={v=>sub('shape',{notes:v})}/>
    </>);
  }

  if(tab==='teekin'){
    const tk=d.teekin||{};
    return(<>
      <FLbl>テーキン写真</FLbl>
      <ImgSlot url={tk.img} busy={busy==='teekin/img'} h={150} onPick={f=>upImg('teekin/img',f,u=>sub('teekin',{img:u}))} onClear={()=>sub('teekin',{img:''})}/>
      <FLbl>説明・注意事項（日本語）</FLbl>
      <textarea value={tk.note||''} onChange={e=>sub('teekin',{note:e.target.value})} style={{width:'100%',height:90,resize:'vertical'}}/>
      <FLbl>説明・注意事項（インドネシア語）</FLbl>
      <textarea value={tk.note_id||''} onChange={e=>sub('teekin',{note_id:e.target.value})} style={{width:'100%',height:90,resize:'vertical'}}/>
    </>);
  }

  if(tab==='hanger'){
    const hg=d.hanger||{};
    return(<>
      <FLbl>ハンガー全体写真</FLbl>
      <ImgSlot url={hg.img} busy={busy==='hanger/img'} h={150} onPick={f=>upImg('hanger/img',f,u=>sub('hanger',{img:u}))} onClear={()=>sub('hanger',{img:''})}/>
      <FLbl>主な特徴（確認ポイント・最大4件）</FLbl>
      <RepList items={hg.features} onChange={v=>sub('hanger',{features:v})} max={4} addLabel="特徴を追加" blank={{title:'',img:'',note:''}}
        render={(it,set,i)=>(<>
          <Row cols="1fr 170px">
            <div><input value={it.title||''} onChange={e=>set({...it,title:e.target.value})} placeholder="例: フック形状（上部）"/></div>
            <ImgSlot url={it.img} busy={busy==='hanger/f'+i} h={90} onPick={f=>upImg('hanger/f'+i,f,u=>set({...it,img:u}))} onClear={()=>set({...it,img:''})}/>
          </Row>
          <FLbl>補足</FLbl>
          <textarea value={it.note||''} onChange={e=>set({...it,note:e.target.value})} style={{width:'100%',height:60,resize:'vertical'}}/>
        </>)}/>
      <FLbl>ハンガー仕様（「項目：値」を1行ずつ）</FLbl>
      <textarea value={(hg.spec||[]).map(r=>`${r.k}：${r.v}`).join('\n')}
        onChange={e=>sub('hanger',{spec:e.target.value.split('\n').map(l=>{const i=l.indexOf('：')>=0?l.indexOf('：'):l.indexOf(':');return i<0?null:{k:l.slice(0,i).trim(),v:l.slice(i+1).trim()};}).filter(Boolean)})}
        style={{width:'100%',height:150,resize:'vertical'}} placeholder={'ハンガー名：標準ハンガーA\nサイズ：W500 × H800 mm\n材質：SS400'}/>
      <FLbl>使用時の注意（1行1項目）</FLbl>
      <LinesArea value={hg.cautions} onChange={v=>sub('hanger',{cautions:v})}/>
    </>);
  }

  if(tab==='steps')return(<>
    <FLbl>作業の流れ（手順ごとにカード）</FLbl>
    <RepList items={d.steps} onChange={v=>S('steps',v)} addLabel="手順を追加" blank={{text:'',text_id:'',img:''}}
      render={(it,set,i)=>(<>
        <Row cols="1fr 170px">
          <div>
            <textarea value={it.text||''} onChange={e=>set({...it,text:e.target.value})} style={{width:'100%',height:60,resize:'vertical'}} placeholder="手順の内容（日本語）"/>
            <textarea value={it.text_id||''} onChange={e=>set({...it,text_id:e.target.value})} style={{width:'100%',height:50,resize:'vertical',marginTop:6}} placeholder="Indonesian（任意）"/>
          </div>
          <ImgSlot url={it.img} busy={busy==='step'+i} h={100} onPick={f=>upImg('step'+i,f,u=>set({...it,img:u}))} onClear={()=>set({...it,img:''})}/>
        </Row>
      </>)}/>
  </>);

  if(tab==='caution')return(<>
    <FLbl>注意ポイント（1行1項目）</FLbl>
    <LinesArea value={d.cautions} onChange={v=>S('cautions',v)} height={200} ph={'例: 製品同士がぶつからないように置いてください'}/>
  </>);

  if(tab==='tools')return(<>
    <FLbl>必要道具類</FLbl>
    <RepList items={d.tools} onChange={v=>S('tools',v)} addLabel="道具を追加" blank={{name:'',img:'',note:''}}
      render={(it,set,i)=>(<>
        <Row cols="1fr 170px">
          <div>
            <input value={it.name||''} onChange={e=>set({...it,name:e.target.value})} placeholder="道具名 例: 軍手"/>
            <textarea value={it.note||''} onChange={e=>set({...it,note:e.target.value})} style={{width:'100%',height:56,resize:'vertical',marginTop:6}} placeholder="用途 例: 製品の取扱い時に使用します。"/>
          </div>
          <ImgSlot url={it.img} busy={busy==='tool'+i} h={100} onPick={f=>upImg('tool'+i,f,u=>set({...it,img:u}))} onClear={()=>set({...it,img:''})}/>
        </Row>
      </>)}/>
    <FLbl>注意事項（1行1項目）</FLbl>
    <LinesArea value={d.toolNotes} onChange={v=>S('toolNotes',v)}/>
  </>);

  if(tab==='packing'){
    const pk=d.packing||{};
    return(<>
      <Row>
        <div><FLbl>代表の収容数（1箱あたり）</FLbl>
          <input type="number" min="0" value={pk.capacity||''} onChange={e=>sub('packing',{capacity:e.target.value})} placeholder="例: 42"/>
          <div style={{fontSize:11,color:'#6B7480',marginTop:5,lineHeight:1.6}}>荷姿ごとに収容数を入れなかった場合は、この値が使われます。<br/>作業指示の端数計算にもこの値を使います。</div>
        </div>
        <div><FLbl>製品イメージ（未設定なら製品写真を使用）</FLbl>
          <ImgSlot url={pk.productImg} busy={busy==='packing/img'} h={90} onPick={f=>upImg('packing/img',f,u=>sub('packing',{productImg:u}))} onClear={()=>sub('packing',{productImg:''})}/>
        </div>
      </Row>
      <FLbl>梱包荷姿（最大4種類）― 荷姿ごとに収容数を設定できます</FLbl>
      <RepList items={pk.patterns} onChange={v=>sub('packing',{patterns:v})} max={4} addLabel="荷姿を追加" blank={{img:'',divider:'',direction:'',capacity:''}}
        render={(it,set,i)=>{
          const sl={fontSize:11,fontWeight:700,color:'#6B7480',marginBottom:3};
          return(
          <Row cols="170px 1fr">
            <ImgSlot url={it.img} busy={busy==='packing/p'+i} h={100} onPick={f=>upImg('packing/p'+i,f,u=>set({...it,img:u}))} onClear={()=>set({...it,img:''})}/>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div><div style={sl}>仕切り</div>
                <input value={it.divider||''} onChange={e=>set({...it,divider:e.target.value})} placeholder="例: 縦 × 横"/></div>
              <div><div style={sl}>向き</div>
                <input value={it.direction||''} onChange={e=>set({...it,direction:e.target.value})} placeholder="例: 縦向き"/></div>
              <div style={{gridColumn:'1 / -1'}}>
                <div style={{...sl,color:NAVY}}>収容数（この荷姿のとき）</div>
                <input type="number" min="0" value={it.capacity||''} onChange={e=>set({...it,capacity:e.target.value})}
                  placeholder={pk.capacity?`未入力なら代表の ${pk.capacity} 個`:'例: 42'}
                  style={{fontWeight:700,color:NAVY}}/>
              </div>
            </div>
          </Row>);
        }}/>
      <FLbl>注意事項（1行1項目）</FLbl>
      <LinesArea value={pk.notes} onChange={v=>sub('packing',{notes:v})}/>
    </>);
  }

  if(tab==='boxes')return(<>
    <FLbl>納入箱（最大4種類）</FLbl>
    <RepList items={d.boxes} onChange={v=>S('boxes',v)} max={4} addLabel="納入箱を追加"
      blank={{name:'',img:'',inUse:false,size:'',dividers:'',material:'',steps:[{title:'箱の外観を確認',desc:'納入箱の品番、ラベルを確認します。'},{title:'箱を開ける',desc:'箱のフタを開け、製品の入れ方を確認します。'},{title:'製品を確認',desc:'製品の識別マークを確認します。'},{title:'所定の場所に納める',desc:'確認後、指定の場所に納めます。'}]}}
      render={(it,set,i)=>(<>
        <Row cols="170px 1fr">
          <ImgSlot url={it.img} busy={busy==='box'+i} h={110} onPick={f=>upImg('box'+i,f,u=>set({...it,img:u}))} onClear={()=>set({...it,img:''})}/>
          <div>
            <input value={it.name||''} onChange={e=>set({...it,name:e.target.value})} placeholder="箱名 例: 納入箱 A（標準箱）"/>
            <label style={{display:'flex',alignItems:'center',gap:8,marginTop:8,fontSize:13,fontWeight:600,color:'#4A5460'}}>
              <input type="checkbox" checked={!!it.inUse} onChange={e=>set({...it,inUse:e.target.checked})} style={{width:18,height:18}}/> この品番で使用中
            </label>
            <Row cols="1fr 1fr 1fr">
              <input value={it.size||''} onChange={e=>set({...it,size:e.target.value})} placeholder="外寸" style={{marginTop:8}}/>
              <input value={it.dividers||''} onChange={e=>set({...it,dividers:e.target.value})} placeholder="仕切数" style={{marginTop:8}}/>
              <input value={it.material||''} onChange={e=>set({...it,material:e.target.value})} placeholder="材質" style={{marginTop:8}}/>
            </Row>
          </div>
        </Row>
        <FLbl>確認手順（「見出し：説明」を1行ずつ）</FLbl>
        <textarea value={(it.steps||[]).map(s=>`${s.title}：${s.desc}`).join('\n')}
          onChange={e=>set({...it,steps:e.target.value.split('\n').map(l=>{const p=l.indexOf('：')>=0?l.indexOf('：'):l.indexOf(':');return p<0?null:{title:l.slice(0,p).trim(),desc:l.slice(p+1).trim()};}).filter(Boolean)})}
          style={{width:'100%',height:90,resize:'vertical'}}/>
      </>)}/>
  </>);

  if(tab==='idmark'){
    const im=d.idMark||{};
    return(<>
      <Row>
        <div><FLbl>全体写真</FLbl><ImgSlot url={im.fullImg} busy={busy==='idmark/full'} h={130} onPick={f=>upImg('idmark/full',f,u=>sub('idMark',{fullImg:u}))} onClear={()=>sub('idMark',{fullImg:''})}/></div>
        <div><FLbl>拡大写真</FLbl><ImgSlot url={im.zoomImg} busy={busy==='idmark/zoom'} h={130} onPick={f=>upImg('idmark/zoom',f,u=>sub('idMark',{zoomImg:u}))} onClear={()=>sub('idMark',{zoomImg:''})}/></div>
      </Row>
      <FLbl>全体写真の説明</FLbl>
      <input value={im.fullNote||''} onChange={e=>sub('idMark',{fullNote:e.target.value})} placeholder="製品に付いている識別マークの位置（全体）"/>
      <FLbl>拡大写真の説明</FLbl>
      <input value={im.zoomNote||''} onChange={e=>sub('idMark',{zoomNote:e.target.value})} placeholder="識別マークの拡大写真"/>
      <FLbl>マークの種類（赤字で表示）</FLbl>
      <input value={im.markType||''} onChange={e=>sub('idMark',{markType:e.target.value})} placeholder="例: 丸マーク（●）"/>
    </>);
  }

  if(tab==='kanban')return(<>
    <FLbl>かんばん情報（最大4種類）</FLbl>
    <RepList items={d.kanbans} onChange={v=>S('kanbans',v)} max={4} addLabel="かんばんを追加"
      blank={{type:'',color:'',code:'',use:'',process:'',issuer:'',size:'W100 × H70 mm',note:''}}
      render={(it,set)=>(<>
        <Row>
          <div><input value={it.type||''} onChange={e=>set({...it,type:e.target.value})} placeholder="種類 例: 生産かんばん"/></div>
          <div>
            <select value={it.color||''} onChange={e=>set({...it,color:e.target.value})}>
              <option value="">色を選択</option>
              {['緑','黄','青','ピンク','赤','白'].map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </Row>
        <Row>
          <div><input value={it.code||''} onChange={e=>set({...it,code:e.target.value})} placeholder="コード 例: KBN0001" style={{marginTop:8}}/></div>
          <div><input value={it.size||''} onChange={e=>set({...it,size:e.target.value})} placeholder="サイズ 例: W100 × H70 mm" style={{marginTop:8}}/></div>
        </Row>
        <Row>
          <div><input value={it.use||''} onChange={e=>set({...it,use:e.target.value})} placeholder="用途 例: 生産指示用" style={{marginTop:8}}/></div>
          <div><input value={it.process||''} onChange={e=>set({...it,process:e.target.value})} placeholder="使用工程 例: 掛け工程" style={{marginTop:8}}/></div>
        </Row>
        <Row>
          <div><input value={it.issuer||''} onChange={e=>set({...it,issuer:e.target.value})} placeholder="発行先 例: Aライン" style={{marginTop:8}}/></div>
          <div><input value={it.note||''} onChange={e=>set({...it,note:e.target.value})} placeholder="備考 例: 製造数の管理に使用" style={{marginTop:8}}/></div>
        </Row>
      </>)}/>
    <FLbl>注意事項（1行1項目）</FLbl>
    <LinesArea value={d.kanbanNotes} onChange={v=>S('kanbanNotes',v)}/>
  </>);

  if(tab==='sheet'){
    const sheets=d.sheets||{};
    const sh=sheets[sheetProc]||{};
    const setSh=patch=>upd({sheets:{...sheets,[sheetProc]:{...sh,...patch}}});
    const cap=(d.packing&&d.packing.capacity)||'';
    return(<>
      <FLbl>工程を選択（工程ごとに要領書・1箱工数を登録します）</FLbl>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:4}}>
        {PROCESSES.map(p=>{
          const on=p.id===sheetProc;
          const has=!!(sheets[p.id]&&((sheets[p.id].steps||[]).length||sheets[p.id].kosu));
          return <button key={p.id} onClick={()=>setSheetProc(p.id)}
            style={{padding:'7px 12px',borderRadius:16,fontSize:12.5,fontWeight:on?700:600,background:on?NAVY:(has?'#E8F0FB':'#F2F4F7'),color:on?'#fff':(has?NAVY:'#4A5460'),border:'1px solid '+(on?NAVY:(has?'#C3D6F0':LINE))}}>{p.no}. {p.ja}{has&&!on?' ●':''}</button>;
        })}
      </div>
      <Row>
        <div><FLbl>1箱あたり工数（分）</FLbl><input type="number" min="0" step="0.1" value={sh.kosu||''} onChange={e=>setSh({kosu:e.target.value})} placeholder="例: 12.5"/></div>
        <div><FLbl>収容数（参考：収容数・荷姿タブの値）</FLbl><input value={cap} readOnly style={{background:'#F7F8FA',color:'#6B7480'}}/></div>
      </Row>
      <FLbl>要領書：手順（写真＋コメント）</FLbl>
      <RepList items={sh.steps} onChange={v=>setSh({steps:v})} addLabel="手順を追加" blank={{img:'',text:'',text_id:''}}
        render={(it,set,i)=>(<Row cols="200px 1fr">
          <ImgSlot url={it.img} busy={busy===`sheet/${sheetProc}/${i}`} h={130} onPick={f=>upImg(`sheet/${sheetProc}/${i}`,f,u=>set({...it,img:u}))} onClear={()=>set({...it,img:''})}/>
          <div>
            <textarea value={it.text||''} onChange={e=>set({...it,text:e.target.value})} style={{width:'100%',height:80,resize:'vertical'}} placeholder="作業内容・コメント（日本語）"/>
            <textarea value={it.text_id||''} onChange={e=>set({...it,text_id:e.target.value})} style={{width:'100%',height:50,resize:'vertical',marginTop:6}} placeholder="Indonesian（任意）"/>
          </div>
        </Row>)}/>
      <FLbl>注意事項（1行1項目）</FLbl>
      <LinesArea value={sh.notes} onChange={v=>setSh({notes:v})}/>
    </>);
  }

  return null;
}


/* ══════════ 作業指示（Phase 2） ══════════ */
function pad2(n){return String(n).padStart(2,'0');}
function fmtHM(d){return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function fmtHMS(d){return fmtHM(d)+':'+pad2(d.getSeconds());}
function fmtDur(ms){const m=Math.max(0,Math.floor(ms/60000));const h=Math.floor(m/60);return (h?h+'h ':'')+(m%60)+'m';}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function daysAgoKey(n){const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
/* ── 始業・休憩設定と時間割計算 ── */
const DEFAULT_SETTINGS={startTime:'08:10',breaks:[
  {label:'休憩1',from:'10:00',to:'10:20'},
  {label:'昼休憩',from:'12:00',to:'12:45'},
  {label:'休憩2',from:'15:00',to:'15:20'},
]};
function hm2min(x){const m=/^(\d{1,2}):(\d{2})$/.exec(String(x||'').trim());return m?(+m[1])*60+(+m[2]):0;}
function min2hm(m){m=Math.max(0,Math.round(m));return pad2(Math.floor(m/60))+':'+pad2(m%60);}
/* start(分)から dur(分) 作業したときの終了時刻(分)。休憩帯はまたいで後ろ倒し */
function addWork(start,dur,breaks){
  const bs=(breaks||[]).map(b=>({f:hm2min(b.from),t:hm2min(b.to)})).filter(b=>b.t>b.f).sort((a,b)=>a.f-b.f);
  let t=start,remain=Math.max(0,dur);
  for(const b of bs){if(t>=b.f&&t<b.t)t=b.t;}
  if(remain<=0)return t;
  while(remain>0){
    const nb=bs.find(b=>b.f>t);
    const avail=nb?(nb.f-t):Infinity;
    if(remain<=avail){t+=remain;remain=0;}
    else{remain-=avail;t=nb.t;}
  }
  return t;
}
/* 行の予定所要（分）：製品行＝1箱工数×箱数／作業行＝所要時間 */
function rowPlanMin(o){
  if(o&&o.kind==='task')return Number(o.durMin)||0;
  return (Number(o&&o.kosu)||0)*(Number(o&&o.targetBoxes)||0);
}
/* 計画行に _planStart/_planEnd/_planMin を付与して返す */
function buildTimeline(rows,settings){
  const st=settings||DEFAULT_SETTINGS;
  let cur=hm2min(st.startTime||'08:00');
  return rows.map(o=>{
    const dur=rowPlanMin(o);
    const a=addWork(cur,0,st.breaks);       /* 休憩中なら明けへ */
    const e=addWork(a,dur,st.breaks);
    cur=e;
    return {...o,_planMin:dur,_planStart:a,_planEnd:e};
  });
}

/* ── 評価・集計 ── */
/* 調整後の先行遅れ（分）。管理者が異常などで補正した分を加算 */
function effDiff(o){return (Number(o&&o.diffMin)||0)+(Number(o&&o.adjustMin)||0);}
function ymKey(d){return String(d||'').slice(0,7);}
function yKey(d){return String(d||'').slice(0,4);}
function shiftDate(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function shiftMonth(n){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1);}
/* 期間モードごとのバケット（新しい順→古い順に並べ替えて返す） */
function buildBuckets(mode){
  const out=[];
  if(mode==='day'){for(let i=13;i>=0;i--)out.push({key:shiftDate(-i),label:shiftDate(-i).slice(5)});}
  else if(mode==='month'){for(let i=11;i>=0;i--){const k=shiftMonth(-i);out.push({key:k,label:k.slice(2)});}}
  else{const y=new Date().getFullYear();for(let i=4;i>=0;i--)out.push({key:String(y-i),label:String(y-i)});}
  return out;
}
function bucketOf(o,mode){return mode==='day'?String(o.date||''):(mode==='month'?ymKey(o.date):yKey(o.date));}
function summarize(list){
  return list.reduce((a,o)=>{
    a.n++;a.boxes+=Number(o.doneBoxes)||0;a.target+=Number(o.targetBoxes)||0;
    a.std+=Number(o.stdMin)||0;a.act+=Number(o.actMin)||0;a.diff+=effDiff(o);
    a.anom+=((o.anomalies||[]).length);a.adj+=Number(o.adjustMin)||0;
    return a;
  },{n:0,boxes:0,target:0,std:0,act:0,diff:0,anom:0,adj:0});
}

/* ── 棒グラフ（先行+は緑／遅れ−は赤） ── */
function DiffBarChart({buckets,values,unit}){
  const W=Math.max(360,buckets.length*62), H=200, pad=26;
  const max=Math.max(1,...values.map(v=>Math.abs(v)));
  const zero=H/2;
  const bw=(W-pad*2)/Math.max(1,buckets.length);
  return(
    <div style={{overflowX:'auto'}}>
      <svg width={W} height={H+28} style={{display:'block'}}>
        <line x1={pad} y1={zero} x2={W-pad} y2={zero} stroke="#C7CDD6" strokeWidth="1"/>
        {buckets.map((b,i)=>{
          const v=values[i]||0;
          const h=Math.abs(v)/max*(H/2-16);
          const x=pad+i*bw+bw*0.2, w=bw*0.6;
          const y=v>=0?zero-h:zero;
          return(
            <g key={b.key}>
              <rect x={x} y={y} width={w} height={Math.max(h,v===0?0:1)} rx="3" fill={v>=0?'#2E7D4F':'#C2410C'}/>
              {v!==0&&<text x={x+w/2} y={v>=0?y-4:y+h+13} textAnchor="middle" fontSize="11" fontWeight="700" fill={v>=0?'#1B5E20':'#B71C1C'}>
                {(v>0?'+':'')+Math.round(v)}
              </text>}
              <text x={x+w/2} y={H+16} textAnchor="middle" fontSize="11" fill="#6B7480">{b.label}</text>
            </g>
          );
        })}
      </svg>
      <div style={{fontSize:11,color:'#8A93A0',marginTop:2}}>↑ 先行（{unit}）　↓ 遅れ（{unit}）</div>
    </div>
  );
}

/* 先行・遅れ計算 */
function calcLog(log,now){
  const start=log.startAt||now, end=log.endAt||now;
  let paused=0, cur=null;
  (log.pauses||[]).forEach(p=>{if(p.to){paused+=p.to-p.from;}else{cur=p;paused+=end-p.from;}});
  const elapsed=Math.max(0,end-start), active=Math.max(0,elapsed-paused);
  const cap=Number(log.capacity)||0, kosu=Number(log.kosu)||0;
  const fracBox=cap?(Number(log.fraction)||0)/cap:0;
  const doneEq=(Number(log.doneBoxes)||0)+fracBox;
  const stdMin=kosu*doneEq, actMin=active/60000, diffMin=stdMin-actMin;
  const target=Number(log.targetBoxes)||0;
  const remainMin=Math.max(0,kosu*(target-doneEq));
  return {elapsed,paused,active,stdMin,actMin,diffMin,remainMin,eta:new Date(end+remainMin*60000),cur,doneEq,hasKosu:kosu>0};
}
function useNow(){const[n,setN]=useState(Date.now());useEffect(()=>{const id=setInterval(()=>setN(Date.now()),1000);return()=>clearInterval(id);},[]);return n;}
